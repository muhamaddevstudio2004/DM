<style>

button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;cursor:pointer}
button.pri{background:var(--yl);color:#14233c;border-color:#d9a300;font-weight:600}button.on{background:var(--ac);color:var(--yl);border-color:var(--ac)}

.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{min-height:40px;display:inline-flex;gap:5px;align-items:center;justify-content:center;color:var(--ac)}button.pri,button.on{color:inherit}button.pri{color:#14233c}button.on{color:var(--yl)}
input[type=text],textarea{font-size:16px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:3px solid var(--yl);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
#nav .tab{flex:1;border:0;border-radius:0;flex-direction:column;min-height:54px;font-size:12px;gap:2px}
.pc.col .bl,.pc.col .add,.pc.col .tb{display:none}.hm{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:6px}.hc{flex-direction:column;align-items:flex-start;text-align:left;padding:18px;border:2px solid var(--bd);border-radius:12px;gap:4px;height:auto}.hc b{font-size:19px}.hc small{color:var(--mut);font-size:13px}.hc .hi{width:46px;height:46px;border-radius:12px;background:var(--yl);display:flex;align-items:center;justify-content:center;color:#14233c;margin-bottom:6px}.hc .ic{width:26px;height:26px}
.pr{display:flex;gap:6px;margin-bottom:8px}.pr .pn{flex:1;justify-content:flex-start;text-align:left;gap:10px;border:2px solid var(--bd);border-radius:10px;padding:8px 10px}.pn b{background:var(--yl);color:#14233c;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none}.pn span{display:flex;flex-direction:column;min-width:0}.pn small{color:var(--mut)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--ac);font-weight:600}.bh button{min-height:34px;padding:4px 8px}
.addbar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;background:#fff;border:2px solid var(--yl);border-radius:12px;padding:6px;margin-top:10px}.addbar button,.ab{flex:none;flex-direction:column;min-height:52px;font-size:11px;gap:2px;padding:4px 8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;color:var(--ac);cursor:pointer;margin:0}
.fb{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:9px 12px;color:var(--ac);cursor:pointer;margin:6px 0;font-size:15px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}.tt{flex-direction:column;align-items:flex-start;text-align:left;height:auto;padding:12px;border:2px solid var(--bd);border-radius:10px;gap:3px}.tt small{color:var(--mut);font-size:11px;font-weight:400}.tt.on{background:#fff;color:var(--ac);border-color:var(--yl);box-shadow:inset 0 0 0 2px var(--yl)}.hint{color:var(--mut);font-size:13px}
.page.mod::after{inset:0;border:0;border-left:18px solid var(--dc)}.page.cvp::after{inset:0;border:0;border-top:18px solid var(--dc)}.cvp .ft{display:none}.cvh{border-bottom:2px solid var(--dc);margin-bottom:8px}.bd .cvh h1{font-size:26pt;color:var(--dk);margin:0}.cj{font-size:14pt;color:var(--dc)}.cc{font-size:10.5pt;color:#444;margin-bottom:6px}.bd h2.cs{font-size:1.08em;color:var(--dc);text-transform:uppercase;border-bottom:1px solid var(--dc);margin:10px 0 4px}.tb{display:flex;gap:6px;margin:8px 0}.tb button{flex:1}
#app{display:flex;align-items:flex-start;padding-bottom:76px}#ed{flex:1;min-width:0;padding:10px}#pv{flex:1;min-width:0;padding:10px;overflow-x:hidden}
body[data-tab="edit"] #pv{display:none}body[data-tab="pv"] #ed{display:none}
@media(min-width:900px){#app #ed,#app #pv{display:block!important}#ed{max-width:46%}#nav{display:none}#app{padding-bottom:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.bl{border-left:3px solid var(--ac);padding-left:8px;margin:8px 0}.bl small{color:var(--mut);text-transform:uppercase;font-size:11px}
.add{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.add button{font-size:13px;padding:5px 8px}
.hdl{cursor:grab;user-select:none;padding:0 4px}
.dng{color:#b00020;border-color:#b00020}.thumb{max-width:100px;max-height:70px;display:block;margin:4px 0}
/* ---- academic document (always white paper) ---- */
.page{width:794px;height:1123px;box-sizing:border-box;background:#fff;color:#000;position:relative;margin:0 auto 14px;font:12pt/1.5 var(--ff),"Times New Roman",Times,"Liberation Serif",serif;box-shadow:0 1px 6px rgba(0,0,0,.3);overflow:hidden}
.page::after{content:"";position:absolute;inset:14px;border:3px double var(--dc);pointer-events:none}
.bd{position:absolute;top:60px;left:76px;right:76px;bottom:84px;overflow:hidden}
.hd{position:absolute;top:36px;left:76px;right:76px;font-size:10pt;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #888;line-height:1.3}
.hd span{max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{position:absolute;bottom:38px;left:0;right:0;text-align:center;font-size:11pt}
.bd h1{font-size:1.33em;color:var(--dk);margin:0 0 8px;line-height:1.3}.bd h2{font-size:1.08em;margin:6px 0 4px}
.bd p{text-align:justify;margin:0 0 8px}.bd ul,.bd ol{margin:0 0 8px;padding-left:28px;text-align:justify}
.bd table{width:100%;border-collapse:collapse;font-size:.92em;line-height:1.3;margin:6px 0 10px}
.bd td,.bd th{border:1px solid #444;padding:4px 7px;text-align:left;vertical-align:top}.bd th{background:var(--dk);color:#fff}
.bd figure{margin:8px 0;text-align:center}.bd figure img{max-width:100%;max-height:430px}.bd figcaption{font-style:italic;font-size:.85em;line-height:1.3}
.tr{display:flex;gap:6px;margin:4px 0}.tr i{flex:1;border-bottom:1px dotted #000;margin-bottom:5px}
.cv{position:absolute;inset:56px 76px 56px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--cf);line-height:1.35}
.cv .ct{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:calc(19pt*var(--cz,1))}.cv .ct img{max-height:120px;max-width:120px;object-fit:contain}
.cv .cm{text-align:center}.cv h1{font-size:calc(27pt*var(--cz,1));color:var(--dc);margin:0 0 14px;line-height:1.2}.cv .sb{font-size:calc(15pt*var(--cz,1));color:#333}
.cv .cb{display:flex;justify-content:space-between;font-size:calc(17pt*var(--cz,1))}.cv .cb>div{flex:none}.cv li{white-space:nowrap}.cv .r{color:var(--dc);font-size:calc(19pt*var(--cz,1))}.cv ul{margin:4px 0;padding-left:20px;font-weight:bold}
.cv .yr{text-align:center;font-size:calc(18pt*var(--cz,1));color:var(--dc)}
.page.rtl{direction:rtl;font-family:var(--ff),"Noto Naskh Arabic","Times New Roman",serif;line-height:1.7}
.page.rtl.mod::after{border-left:0;border-right:18px solid var(--dc)}
.page.rtl .bd ul,.page.rtl .bd ol{padding-left:0;padding-right:28px}
.page.rtl .bd td,.page.rtl .bd th{text-align:right}.page.rtl .bd table{line-height:1.5}
.page.rtl .bd figcaption{font-style:normal}
.page.rtl .cv ul{padding-left:0;padding-right:20px}.page.rtl .cv{line-height:1.6}
.x .page{margin:0;box-shadow:none;page-break-after:always}.x .page:last-child{page-break-after:auto}
@media print{@page{size:A4;margin:0}body{background:#fff}#top,#ed{display:none!important}#app,#pv{display:block!important;padding:0}#doc{transform:none!important;margin:0!important;width:auto!important}.page{margin:0;box-shadow:none;page-break-after:always}.page:last-child{page-break-after:auto}}

<script>
/* app-like: block pinch, ctrl+wheel and keyboard zoom */

const $=id=>document.getElementById(id);
const e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="academic-report-builder-v1";let curP=-1,view="home",FZ=12;
const IC={doc:"M6 2h9l5 5v15H6zM14 2v6h6",dl:"M12 3v12m-5-5 5 5 5-5M5 21h14",print:"M6 9V3h12v6M6 18H4v-8h16v8h-2M7 14h10v7H7z",edit:"M4 20h4L19 9l-4-4L4 16zM13 7l4 4",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6",plus:"M12 5v14M5 12h14",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6",up:"M6 15l6-6 6 6",down:"M6 9l6 6 6-6",image:"M3 4h18v16H3zM3 16l5-5 4 4 3-3 6 6M8 8h.01",text:"M5 6h14M5 11h14M5 16h9",type:"M5 6V4h14v2M12 4v16M9 20h6",list:"M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01",olist:"M10 6h10M10 12h10M10 18h10M4 5h2v4M4 12h3l-3 3h3M4 17h3v2H4",table:"M3 5h18v14H3zM3 10h18M3 15h18M9 5v14M15 5v14",upload:"M12 16V4m-5 5 5-5 5 5M5 20h14",user:"M12 12a4 4 0 100-8 4 4 0 000 8M4 21c0-4 4-6 8-6s8 2 8 6",al:"M4 6h16M4 12h10M4 18h14",ac:"M4 6h16M7 12h10M5 18h14",ar:"M4 6h16M10 12h10M6 18h14",palette:"M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 003-3c0-5-4-11-8-11zM7.5 11h.01M10 7h.01M15 7h.01",back:"M15 6l-6 6 6 6"};

let S=load();
function seed(){return{info:{students:["Muhamad Yousif","Karzan Salam","Ismahil"],sup:"Dr. Kherota",uni:"Erbil Polytechnic University",col:"Soran Technical College",dep:"IT Department | Evening",year:"2025–2026",course:"Computer Networks II",title:"Field Visit Report: How FTTH Internet Is Delivered to Homes",sub:"Visit to an FTTH Service Center – Erbil, Iraq"},logo:"",pages:[

{title:"Equipment Used",blocks:[{t:"tbl",text:"Equipment | Function\nOLT | Manages optical connections\nONT | Converts optical signals to Ethernet"}]}]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.info&&d.pages){const i=d.info;if(!i.students)i.students=[i.s1,i.s2,i.s3].filter(Boolean);return d}}catch(x){}return seed()}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){alert("Storage is full. Remove or shrink some images.")}},300)}
/* ---------- editor ---------- */
function blockEd(b,p,k){let f;
 if(b.t=="h")f=`<input type="text" data-f="text" value="${e(b.text)}">`;
 else if(b.t=="img")f=`${b.src?`<img class="thumb" src="${b.src}" alt="">`:""}<input type="file" accept="image/*" data-img="1"><label>Caption</label><input type="text" data-f="cap" value="${e(b.cap)}" placeholder="Figure caption"><label>Image position and size (use ↑ ↓ above to move it)</label><div class="tb" style="display:flex">${[["left","al"],["center","ac"],["right","ar"]].map(([v,i])=>`<button class="${(b.al||"center")==v?"on":""}" data-a="al" data-v="${v}" data-p="${p}" data-b="${k}">${ic(i)}</button>`).join("")}${[["s","S"],["m","M"],["l","L"]].map(([v,l])=>`<button class="${(b.sz||"l")==v?"on":""}" data-a="sz" data-v="${v}" data-p="${p}" data-b="${k}">${l}</button>`).join("")}</div>`;
 else f=`<textarea data-f="text" placeholder="${e(HINT[b.t])}">${e(b.text)}</textarea>`;
 return `<div class="bl" data-b="${k}"><div class="row"><small>${TYPES[b.t]}</small><span style="flex:1"></span><button data-a="bup" data-p="${p}" data-b="${k}" aria-label="Move up">${ic("up")}</button><button data-a="bdn" data-p="${p}" data-b="${k}" aria-label="Move down">${ic("down")}</button><button class="dng" data-a="delb" data-p="${p}" data-b="${k}" aria-label="Delete">${ic("trash")}</button></div>${f}</div>`}
function renderEd(){const I=S.info;
 let hi=`<div class="card"><label>Students</label>${S.info.students.map((s,i)=>`<div class="row" style="margin-bottom:6px"><input type="text" data-st="${i}" value="${e(s)}" placeholder="Student name"><button class="dng" data-a="dels" data-i="${i}" aria-label="Remove student">${ic("trash")}</button></div>`).join("")}<button data-a="adds">${ic("plus")}Add student</button>${FIELDS.map(([k,l])=>`<label>${l}</label><input type="text" data-k="${k}" value="${e(I[k])}">`).join("")}</div>`;let ht=`<div class="card"><label>Report color</label><div class="row" style="margin-bottom:6px">${["#c00000","#1d4e9e","#0b7a43","#6b2fa0","#111111"].map(c=>`<button data-a="col" data-v="${c}" style="background:${c};min-width:36px;border-color:${c}" aria-label="${c}"></button>`).join("")}<input type="color" data-col="1" value="${S.color||"#c00000"}" style="width:46px;height:40px;flex:none;padding:0"></div><label>University logo (optional)</label>${S.logo?`<img class="thumb" src="${S.logo}" alt="">`:""}<input type="file" accept="image/*" id="logo">${S.logo?`<button data-a="nologo" style="margin-top:6px">Remove logo</button>`:""}</div>`;
 let hp=S.pages.map((pg,i)=>`<div class="card pc${curP==i?"":" col"}" data-p="${i}"><div class="row"><span class="hdl" draggable="true" title="Drag to reorder">☰</span><b>${i+1}.</b><input type="text" data-f="title" value="${e(pg.title)}" placeholder="Page title"><button data-a="open" data-p="${i}" aria-label="Open or close">${ic(curP==i?"up":"down")}</button></div><div class="tb"><button data-a="pup" data-p="${i}">${ic("up")}Up</button><button data-a="pdn" data-p="${i}">${ic("down")}Down</button><button class="dng" data-a="delp" data-p="${i}">${ic("trash")}Delete page</button></div>${pg.blocks.map((b,k)=>blockEd(b,i,k)).join("")}<div class="add"><span>Add:</span>${Object.keys(TYPES).map(t=>`<button data-a="addb" data-t="${t}" data-p="${i}">${ic(TI[t])}${TYPES[t]}</button>`).join("")}<label class="up"><button type="button" onclick="this.nextElementSibling.click()">${ic("upload")}Upload .txt</button><input type="file" accept=".txt,text/plain" data-txt="${i}" hidden></label></div></div>`).join("");
 hp+=`<button class="pri" data-a="addp" style="width:100%">${ic("plus")}Add Page</button><p style="color:var(--mut);font-size:12px">Changes are saved automatically on this device.</p>`;
 const back=`<button data-a="home" style="margin-bottom:10px">${ic("back")}Back</button>`;$("ed").innerHTML=view=="home"?`<div class="hm">${[["tpl","palette","Template","Report, CV designs and color"],["info","user","Information","Students, details and logo"],["pages","doc","Page","Add and edit sections"]].map(([v,i,t,s])=>`<button class="hc" data-a="go" data-v="${v}"><span class="hi">${ic(i)}</span><b>${t}</b><small>${s}</small></button>`).join("")}</div><div class="ftr">Developed by <a href="https://DevMuhamad.com" target="_blank" rel="noopener noreferrer">DevMuhamad.com</a></div>`:(view=="pages"&&curP>=0?"":back)+({tpl:tplUI(),info:hi+logoUI()+typeUI(),pages:pagesUI()}[view]||"");$("ed").querySelectorAll('input[type=text],textarea').forEach(x=>x.dir="auto")}

 if(a=="delp"||a=="delb"||(a=="tpl"&&b.dataset.seed)){if(!b.dataset.arm){b.dataset.arm=1;b._h=b.innerHTML;b.textContent="Sure? Tap again";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.innerHTML=b._h}},3000);return}}

 else if(a=="open")curP=curP==p?-1:p;
 else if(a=="adds")S.info.students.push("");else if(a=="dels")S.info.students.splice(+b.dataset.i,1);
