en:`# Computer Networks

## Abstract
This report introduces computer networks, explains their main types and devices, and shows why they are essential for communication in modern organizations.

## 1. Introduction
A computer network connects two or more devices so that they can share data and resources. Networks make it possible to send messages, share files, use a common printer, and reach the Internet.

## 2. Types of Networks
Networks are usually classified by the area they cover.

### 2.1 Common Types
- LAN: covers a small area such as a lab or a home.
- MAN: covers a city or a large campus.
- WAN: covers countries and continents, such as the Internet.

| Type | Coverage | Example |
|---|---|---|
| LAN | Room or building | Computer lab |
| MAN | City | University campus |
| WAN | Country or world | The Internet |

### 2.2 Network Devices
Routers, switches and access points are the main network devices. A router connects different networks, a switch connects devices inside one network, and an access point provides wireless connectivity.

## 3. Conclusion
Computer networks are the foundation of communication and shared work today. Understanding their types and devices helps in designing a suitable network.

## References
- Tanenbaum, A. S., & Wetherall, D. J. (2011). Computer Networks (5th ed.). Pearson.
- Kurose, J. F., & Ross, K. W. (2021). Computer Networking: A Top-Down Approach (8th ed.). Pearson.`,
ckb:`# تۆڕی کۆمپیوتەر

## کورتە
ئەم ڕاپۆرتە ناساندنێکی تۆڕی کۆمپیوتەرە، جۆرە سەرەکییەکان و ئامێرەکانی ڕوون دەکاتەوە، و نیشان دەدات بۆچی لە دامەزراوە نوێکاندا بۆ پەیوەندی گرنگن.

## 1. پێشەکی
تۆڕی کۆمپیوتەر دوو ئامێر یان زیاتر بەیەکەوە دەبەستێتەوە، بۆ ئەوەی داتا و سەرچاوەکان هاوبەش بکەن. تۆڕەکان ڕێگە دەدەن نامە بنێردرێت، فایل هاوبەش بکرێت، چاپکەرێکی هاوبەش بەکاربهێنرێت، و ئینتەرنێت بگاتە ئامێرەکان.

## 2. جۆرەکانی تۆڕ
تۆڕەکان بەگشتی بەپێی ئەو ناوچەیەی دایدەپۆشن پۆلێن دەکرێن.

### 2.1 جۆرە باوەکان
- LAN: ناوچەیەکی بچووک وەک تاقیگە یان ماڵ دادەپۆشێت.
- MAN: شارێک یان کامپەسێکی گەورە دادەپۆشێت.
- WAN: وڵاتان و کیشوەرەکان دادەپۆشێت، وەک ئینتەرنێت.

| جۆر | ناوچە | نموونە |
|---|---|---|
| LAN | ژوورێک یان باڵەخانەیەک | تاقیگەی کۆمپیوتەر |
| MAN | شار | کامپەسی زانکۆ |
| WAN | وڵات یان جیهان | ئینتەرنێت |

### 2.2 ئامێرەکانی تۆڕ
ڕاوتەر و سویچ و ئەکسێس پۆینت ئامێرە سەرەکییەکانی تۆڕن. ڕاوتەر تۆڕە جیاوازەکان پێکەوە دەبەستێتەوە، سویچ ئامێرەکانی ناو یەک تۆڕ دەبەستێتەوە، و ئەکسێس پۆینت پەیوەندی بێتەل دابین دەکات.

## 3. دەرئەنجام
تۆڕی کۆمپیوتەر بنەمای پەیوەندی و کارکردنی هاوبەشە لە ژیانی ئێستادا. تێگەیشتن لە جۆر و ئامێرەکانی یارمەتی دەدات تۆڕێکی گونجاو دیزاین بکرێت.

## سەرچاوەکان
- Tanenbaum, A. S., & Wetherall, D. J. (2011). Computer Networks (5th ed.). Pearson.
- Kurose, J. F., & Ross, K. W. (2021). Computer Networking: A Top-Down Approach (8th ed.). Pearson.`,
ar:`# شبكات الحاسوب

## الملخص
يقدم هذا التقرير تعريفاً بشبكات الحاسوب، ويوضح أنواعها وأجهزتها الرئيسية، ويبين سبب أهميتها للاتصال في المؤسسات الحديثة.

## 1. المقدمة
تربط شبكة الحاسوب جهازين أو أكثر لمشاركة البيانات والموارد. وتتيح الشبكات إرسال الرسائل ومشاركة الملفات واستخدام طابعة مشتركة والوصول إلى الإنترنت.

## 2. أنواع الشبكات
تُصنَّف الشبكات عادةً بحسب المساحة التي تغطيها.

### 2.1 الأنواع الشائعة
- LAN: تغطي مساحة صغيرة مثل مختبر أو منزل.
- MAN: تغطي مدينة أو حرماً جامعياً كبيراً.
- WAN: تغطي دولاً وقارات، مثل الإنترنت.

| النوع | التغطية | مثال |
|---|---|---|
| LAN | غرفة أو مبنى | مختبر الحاسوب |
| MAN | مدينة | الحرم الجامعي |
| WAN | دولة أو العالم | الإنترنت |

### 2.2 أجهزة الشبكة
الموجّه والمحوّل ونقطة الوصول هي الأجهزة الرئيسية للشبكة. يربط الموجّه الشبكات المختلفة، ويربط المحوّل الأجهزة داخل الشبكة الواحدة، وتوفر نقطة الوصول الاتصال اللاسلكي.

## 3. الخاتمة
تُعد شبكات الحاسوب أساس الاتصال والعمل المشترك اليوم. ويساعد فهم أنواعها وأجهزتها على تصميم شبكة مناسبة.
