.color-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.color-row .color-label{font-size:13px;color:var(--mut);margin:0}.color-row input[type=color]{margin-left:auto}

.home-intro{margin:4px 0 12px}.home-intro h2{font-size:20px;margin:0 0 3px;color:var(--ac)}.home-intro p{margin:0;color:var(--mut);font-size:13px}
.hc{min-height:138px}.hc b{font-size:17px}.hc small{line-height:1.45}
.image-layout{display:flex;gap:12px;align-items:flex-start;width:100%}.image-layout.left img,.image-layout.right img{flex:0 0 auto;max-height:280px;object-fit:contain}.image-layout.left .image-copy,.image-layout.right .image-copy{flex:1 1 0;min-width:0}.image-layout.right{flex-direction:row-reverse}.image-layout.top,.image-layout.bottom{display:flex;flex-direction:column;align-items:center}.image-layout.top .image-copy,.image-layout.bottom .image-copy{width:100%}.image-layout.top img,.image-layout.bottom img{max-width:80%;max-height:360px}.image-layout.center{display:flex;flex-direction:column;align-items:center}.image-layout.center img{max-width:80%;max-height:360px}.image-copy{font:inherit;font-size:inherit;line-height:inherit;text-align:justify;white-space:pre-wrap;overflow-wrap:anywhere}.image-copy:empty{display:none}

.content-tabs{display:flex;gap:8px;margin:0 0 10px}.content-tabs button{flex:1;border-radius:9px;font-weight:600}.content-tabs button.on{background:var(--ac);color:var(--yl)}
.pr{display:flex;gap:6px;margin-bottom:8px}.pr .pn{flex:1;justify-content:flex-start;text-align:left;gap:10px;border:2px solid var(--bd);border-radius:10px;padding:8px 10px}.pn b{background:var(--yl);color:#0f2a52;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none}.pn span{display:flex;flex-direction:column;min-width:0}.pn small{color:var(--mut)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--ac);font-weight:600}.bh button{min-height:34px;padding:4px 8px}
.addbar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;background:#fff;border:2px solid var(--yl);border-radius:12px;padding:6px;margin-top:10px}.addbar button,.ab{flex:none;flex-direction:column;min-height:52px;font-size:11px;gap:2px;padding:4px 8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;color:var(--ac);cursor:pointer;margin:0}
.fb{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:9px 12px;color:var(--ac);cursor:pointer;margin:6px 0;font-size:15px}

.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}.tt{flex-direction:column;align-items:flex-start;text-align:left;height:auto;padding:12px;border:2px solid var(--bd);border-radius:10px;gap:3px}.tt small{color:var(--mut);font-size:11px;font-weight:400}.tt.on{background:#fff;color:var(--ac);border-color:var(--yl);box-shadow:inset 0 0 0 2px var(--yl)}.hint{color:var(--mut);font-size:13px}
.page.mod::after{inset:0;border:0;border-left:18px solid var(--dc)}.page.cvp::after{inset:0;border:0;border-top:18px solid var(--dc)}.cvp .ft{display:none}.cvh{border-bottom:2px solid var(--dc);margin-bottom:8px}.bd .cvh h1{font-size:26pt;color:var(--dk);margin:0}.cj{font-size:14pt;color:var(--dc)}.cc{font-size:10.5pt;color:#444;margin-bottom:6px}.bd h2.cs{font-size:1.08em;color:var(--dc);text-transform:uppercase;border-bottom:1px solid var(--dc);margin:10px 0 4px}.tb{display:flex;gap:6px;margin:8px 0}.tb button{flex:1}
#app{display:flex;align-items:flex-start;padding-bottom:76px}#ed{flex:1;min-width:0;padding:10px}#pv{flex:1;min-width:0;padding:10px;overflow-x:hidden}

@media(min-width:900px){#app #ed,#app #pv{display:block!important}#ed{max-width:46%}#nav{display:none}#app{padding-bottom:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.bl{border-left:3px solid var(--ac);padding-left:8px;margin:8px 0}.bl small{color:var(--mut);text-transform:uppercase;font-size:11px}
.add{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.add button{font-size:13px;padding:5px 8px}
.hdl{cursor:grab;user-select:none;padding:0 4px}
.dng{color:#b00020;border-color:#b00020}.thumb{max-width:100px;max-height:70px;display:block;margin:4px 0}
/* ---- academic document (always white paper) ---- */
.page{width:794px;height:1123px;box-sizing:border-box;background:#fff;color:#000;position:relative;margin:0 auto 14px;font:12pt/1.5 var(--ff),"Times New Roman",Times,"Liberation Serif",serif;box-shadow:0 1px 6px rgba(0,0,0,.3);overflow:hidden}
.page::after{content:"";position:absolute;inset:14px;border:3px double var(--dc);pointer-events:none}
.bd{position:absolute;top:60px;left:76px;right:76px;bottom:84px;overflow:hidden;line-height:var(--ls,1.5)}
.hd{position:absolute;top:36px;left:76px;right:76px;font-size:10pt;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #888;line-height:1.3}
.hd span{max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{position:absolute;bottom:38px;left:0;right:0;text-align:center;font-size:11pt}
.bd h1{font-size:1.33em;color:var(--dk);margin:0 0 8px;line-height:1.3}.bd h2{font-size:1.08em;margin:10px 0 4px;line-height:1.3}.bd h3{font-size:1em;margin:8px 0 3px;line-height:1.3}.bd caption{caption-side:top;text-align:center;font-style:italic;font-size:.95em;padding-bottom:4px}.page.rtl .bd caption{font-style:normal}
.bd p{text-align:var(--ta,justify);margin:0 0 8px;overflow-wrap:anywhere}.bd ul,.bd ol{margin:0 0 8px;padding-left:28px;text-align:var(--ta,justify)}
.bd table{width:100%;border-collapse:collapse;font-size:.92em;line-height:1.3;margin:6px 0 10px}
.bd td,.bd th{border:1px solid #444;padding:4px 7px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.bd th{background:var(--dk);color:#fff}
.bd figure{margin:8px 0;text-align:center}.bd figure img{max-width:100%;max-height:430px}.bd figcaption{font-style:italic;font-size:.85em;line-height:1.3}
.tr{display:flex;align-items:flex-end;gap:4px;margin:3px 0;line-height:1.4}.tr .tl{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;border:0;border-radius:0;background:none;padding:0;box-shadow:none}.tr.l2,.tr.l3{font-weight:400}.tcn{font-size:.85em;font-style:italic;color:#444;border-bottom:1px solid #888;margin-bottom:10px;padding-bottom:3px}.tr i{flex:1 0 22px;border-bottom:1px dotted #000;margin-bottom:.35em}.tr .pgn{flex:none;min-width:2.2em;text-align:right}.page.rtl .tr .pgn{text-align:left}.tr.l1{font-weight:bold;margin-top:9px;text-transform:uppercase}.tr.l2{margin-inline-start:22px}.tr.l3{margin-inline-start:44px}.tr.lf{margin:5px 0}
.cv{position:absolute;inset:56px 76px 56px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--cf);line-height:1.35}
.cv .ct{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:calc(19pt*var(--cz,1))}.cv .ct img{max-height:120px;max-width:120px;object-fit:contain}
.cv .cm{text-align:center}.cv .cm.ns{padding-top:56px}.cv .cm.ns h1{margin-bottom:0}.cv h1{font-size:calc(27pt*var(--cz,1));color:var(--dc);margin:0 0 14px;line-height:1.2}.cv .sb{font-size:calc(15pt*var(--cz,1));color:#333}
.cv .cb{display:flex;justify-content:space-between;font-size:calc(17pt*var(--cz,1))}.cv .cb>div{flex:none}.cv li{white-space:nowrap}.cv .r{color:var(--dc);font-size:calc(19pt*var(--cz,1))}.cv ul{margin:4px 0;padding-left:20px;font-weight:bold}
.cv .yr{text-align:center;font-size:calc(18pt*var(--cz,1));color:var(--dc)}
.page.rtl{direction:rtl;font-family:var(--ff),"Noto Naskh Arabic","Times New Roman",serif;line-height:1.7}
.page.rtl.mod::after{border-left:0;border-right:18px solid var(--dc)}
.page.rtl .bd ul,.page.rtl .bd ol{padding-left:0;padding-right:28px}
.page.rtl .bd td,.page.rtl .bd th{text-align:right}.page.rtl .bd table{line-height:1.5}
.page.rtl .bd figcaption{font-style:normal}
.page.rtl .cv ul{padding-left:0;padding-right:20px}.page.rtl .cv{line-height:1.6}
.citation{color:#143a7b;text-decoration:underline;font-weight:600}.autolink{color:#143a7b;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}.ref-entry{padding-left:48px;text-indent:-48px;overflow-wrap:anywhere;margin-bottom:10px}.page.rtl .ref-entry{padding-left:0;padding-right:48px;text-indent:-48px}.bd table{break-inside:auto}.bd tr{break-inside:avoid;page-break-inside:avoid}.bd thead{display:table-header-group}.bd figure{break-inside:avoid;page-break-inside:avoid}.bd h1,.bd h2,.bd h3{break-after:avoid;page-break-after:avoid}.bd img{height:auto;object-fit:contain;max-width:100%}.x .page{margin:0;box-shadow:none;page-break-after:always}.x .page:last-child{page-break-after:auto}
.bd>h1{border-bottom:2px solid var(--gd);padding-bottom:4px}.bd>h1.sh{margin-top:14px;text-transform:uppercase}.bd>h1.sh:first-child{margin-top:0}.cv h1::after{content:"";display:block;width:90px;height:3px;background:var(--gd);margin:12px auto 0}.no-report-line .bd>h1{border-bottom:0;padding-bottom:0}.no-report-line .cv h1::after{display:none}

@media print{@page{size:A4;margin:0}body{background:#fff}#top,#ed,#nav{display:none!important}#app,#pv{display:block!important;padding:0}#doc{transform:none!important;margin:0!important;width:auto!important}.page{margin:0;box-shadow:none;page-break-after:always}.page:last-child{page-break-after:auto}html.ios .page{zoom:.85;margin:0 auto}}

/* Final responsive overrides for the updated UI */

.template-card{padding:16px;border-radius:14px;box-shadow:0 3px 12px rgba(20,58,123,.06)}
.template-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.template-head h3{margin:3px 0 4px;color:var(--ac);font-size:18px;line-height:1.25}
.template-head p{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.template-head label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--mut)}
.template-mark{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:#eef3fb;color:var(--ac);font-size:20px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.tt{position:relative;display:flex;flex-direction:row;align-items:center;text-align:left;gap:10px;min-height:82px;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);transition:border-color .15s,background .15s,box-shadow .15s}
.tt .tt-icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;background:#f0f4fa;color:var(--ac);font-size:18px}
.tt .tt-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.tt b{font-size:14px;line-height:1.25;color:var(--fg)}
.tt small{color:var(--mut);font-size:11px;line-height:1.3;font-weight:400}
.tt .tt-check{margin-left:auto;align-self:flex-start;color:var(--gd);font-size:16px}
.tt.on{background:#f8f6ef;border:2px solid var(--yl);box-shadow:0 0 0 2px rgba(216,187,116,.16)}
.tt.on .tt-icon{background:#eee5ce;color:#725719}
.tt.on b{color:var(--ac)}
.template-hint{margin:8px 0 12px;padding:10px 12px;border-radius:9px;background:#f4f6fa;line-height:1.5}
.template-divider{height:1px;background:var(--bd);margin:14px 0}
.chapter-break-option{margin:8px 0 12px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#f7f9fc}
.chapter-break-label{display:flex;align-items:flex-start;gap:9px;margin:0!important;cursor:pointer}
.chapter-break-label input{width:18px;height:18px;flex:none;margin:2px 0 0;accent-color:var(--ac)}
.chapter-break-label span{display:flex;flex-direction:column;gap:3px}
.chapter-break-label b{font-size:13px;color:var(--fg)}
.chapter-break-label small{font-size:11px;line-height:1.4;color:var(--mut);font-weight:400}
@media(max-width:380px){.tt{padding:9px;gap:7px}.tt .tt-icon{width:32px;height:32px}.tt b{font-size:12px}}

/* Academic editor refinement: mobile-first, calm academic hierarchy */
.content-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px}
.content-tabs button{min-width:0;min-height:48px;padding:9px 7px;border-radius:10px;font-size:14px;line-height:1.25;font-weight:650;white-space:normal}
.content-tabs button.on{background:var(--ac);color:var(--yl);border-color:var(--ac)}
.pr{align-items:stretch;gap:6px}
.pr .pn{min-height:66px}
.pc{min-width:0}
.pc>.row:first-child{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.pc>.row:first-child input{min-width:0;min-height:44px}
.pc label{font-size:13px;font-weight:600;letter-spacing:.01em;margin:12px 0 6px}
.pc button{min-height:42px}
.pc textarea,.pc input[type=text]{font-size:15px;line-height:1.5;padding:10px 11px;border-radius:9px}
.pc textarea{min-height:112px}
.pc .bl{border-left-width:3px;padding:10px 0 10px 11px;margin:12px 0;border-radius:0 8px 8px 0;background:#f7f9fc}
.pc .bh{gap:8px;flex-wrap:wrap}
.pc .bh button{min-width:40px}
.pc .addbar{gap:7px;padding:8px;box-shadow:0 -3px 14px rgba(15,42,82,.07)}
.pc .addbar button,.pc .addbar .ab{min-width:76px;min-height:66px;font-size:12px}
.pc .hint{line-height:1.55}

 #ed{padding:10px 12px}

 .pc .row{flex-wrap:wrap}

 .pc .row[style*="margin-bottom:6px"]>button{flex:1 1 calc(33.333% - 8px)!important;min-height:46px}

}

}

/* Responsive, consistent block controls and link settings */
.pc .bh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pc .bh-title{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:15px;line-height:1.35}
.pc .bh-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
