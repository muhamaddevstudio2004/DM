#app{display:flex;align-items:flex-start;padding-bottom:76px}#ed{flex:1;min-width:0;padding:10px}#pv{flex:1;min-width:0;padding:10px;overflow-x:hidden}

@media(min-width:900px){#app #ed,#app #pv{display:block!important}#ed{max-width:46%}#nav{display:none}#app{padding-bottom:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px}

/* ---- academic document (always white paper) ---- */
.page{width:794px;height:1123px;box-sizing:border-box;background:#fff;color:#000;position:relative;margin:0 auto 14px;font:12pt/1.5 var(--ff),"Times New Roman",Times,"Liberation Serif",serif;box-shadow:0 1px 6px rgba(0,0,0,.3);overflow:hidden}

.bd{position:absolute;top:60px;left:76px;right:76px;bottom:84px;overflow:hidden;line-height:var(--ls,1.5)}
.hd{position:absolute;top:36px;left:76px;right:76px;font-size:10pt;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #888;line-height:1.3}

.bd p{text-align:var(--ta,justify);margin:0 0 8px;overflow-wrap:anywhere}.bd ul,.bd ol{margin:0 0 8px;padding-left:28px;text-align:var(--ta,justify)}

.bd figure{margin:8px 0;text-align:center}.bd figure img{max-width:100%;max-height:430px}.bd figcaption{font-style:italic;font-size:.85em;line-height:1.3}

.cv .cm{text-align:center}.cv .cm.ns{padding-top:56px}.cv .cm.ns h1{margin-bottom:0}.cv h1{font-size:calc(27pt*var(--cz,1));color:var(--dc);margin:0 0 14px;line-height:1.2}.cv .sb{font-size:calc(15pt*var(--cz,1));color:#333}
.cv .cb{display:flex;justify-content:space-between;font-size:calc(17pt*var(--cz,1))}.cv .cb>div{flex:none}.cv li{white-space:nowrap}.cv .r{color:var(--dc);font-size:calc(19pt*var(--cz,1))}.cv ul{margin:4px 0;padding-left:20px;font-weight:bold}
.cv .yr{text-align:center;font-size:calc(18pt*var(--cz,1));color:var(--dc)}

.page.rtl .cv ul{padding-left:0;padding-right:20px}.page.rtl .cv{line-height:1.6}
.citation{color:#143a7b;text-decoration:underline;font-weight:600}.autolink{color:#143a7b;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}.ref-entry{padding-left:48px;text-indent:-48px;overflow-wrap:anywhere;margin-bottom:10px}.page.rtl .ref-entry{padding-left:0;padding-right:48px;text-indent:-48px}.bd table{break-inside:auto}.bd tr{break-inside:avoid;page-break-inside:avoid}.bd thead{display:table-header-group}.bd figure{break-inside:avoid;page-break-inside:avoid}.bd h1,.bd h2,.bd h3{break-after:avoid;page-break-after:avoid}.bd img{height:auto;object-fit:contain;max-width:100%}.x .page{margin:0;box-shadow:none;page-break-after:always}.x .page:last-child{page-break-after:auto}
.bd>h1{border-bottom:2px solid var(--gd);padding-bottom:4px}.bd>h1.sh{margin-top:14px;text-transform:uppercase}.bd>h1.sh:first-child{margin-top:0}.cv h1::after{content:"";display:block;width:90px;height:3px;background:var(--gd);margin:12px auto 0}.no-report-line .bd>h1{border-bottom:0;padding-bottom:0}.no-report-line .cv h1::after{display:none}

/* Final responsive overrides for the updated UI */

.template-card{padding:16px;border-radius:14px;box-shadow:0 3px 12px rgba(20,58,123,.06)}
.template-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.template-head h3{margin:3px 0 4px;color:var(--ac);font-size:18px;line-height:1.25}
.template-head p{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.template-head label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--mut)}
.template-mark{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:#eef3fb;color:var(--ac);font-size:20px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.tt{position:relative;display:flex;flex-direction:row;align-items:center;text-align:left;gap:10px;min-height:82px;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);transition:border-color .15s,background .15s,box-shadow .15s}

.tt b{font-size:14px;line-height:1.25;color:var(--fg)}
.tt small{color:var(--mut);font-size:11px;line-height:1.3;font-weight:400}
.tt .tt-check{margin-left:auto;align-self:flex-start;color:var(--gd);font-size:16px}
.tt.on{background:#f8f6ef;border:2px solid var(--yl);box-shadow:0 0 0 2px rgba(216,187,116,.16)}
.tt.on .tt-icon{background:#eee5ce;color:#725719}
.tt.on b{color:var(--ac)}
.template-hint{margin:8px 0 12px;padding:10px 12px;border-radius:9px;background:#f4f6fa;line-height:1.5}
.template-divider{height:1px;background:var(--bd);margin:14px 0}
.chapter-break-option{margin:8px 0 12px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#f7f9fc}
.chapter-break-label{display:flex;align-items:flex-start;gap:9px;margin:0!important;cursor:pointer}
.chapter-break-label input{width:18px;height:18px;flex:none;margin:2px 0 0;accent-color:var(--ac)}
.chapter-break-label span{display:flex;flex-direction:column;gap:3px}
.chapter-break-label b{font-size:13px;color:var(--fg)}
.chapter-break-label small{font-size:11px;line-height:1.4;color:var(--mut);font-weight:400}

/* Academic editor refinement: mobile-first, calm academic hierarchy */
.content-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px}

.pr{align-items:stretch;gap:6px}
.pr .pn{min-height:66px}
.pc{min-width:0}
.pc>.row:first-child{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.pc>.row:first-child input{min-width:0;min-height:44px}
.pc label{font-size:13px;font-weight:600;letter-spacing:.01em;margin:12px 0 6px}
.pc button{min-height:42px}
.pc textarea,.pc input[type=text]{font-size:15px;line-height:1.5;padding:10px 11px;border-radius:9px}
.pc textarea{min-height:112px}
.pc .bl{border-left-width:3px;padding:10px 0 10px 11px;margin:12px 0;border-radius:0 8px 8px 0;background:#f7f9fc}
.pc .bh{gap:8px;flex-wrap:wrap}
.pc .bh button{min-width:40px}
.pc .addbar{gap:7px;padding:8px;box-shadow:0 -3px 14px rgba(15,42,82,.07)}
.pc .addbar button,.pc .addbar .ab{min-width:76px;min-height:66px;font-size:12px}
.pc .hint{line-height:1.55}

 #ed{padding:10px 12px}

 .pc .row{flex-wrap:wrap}

 .pc .row[style*="margin-bottom:6px"]>button{flex:1 1 calc(33.333% - 8px)!important;min-height:46px}
 .pc .row[style*="margin-bottom:6px"]>button:nth-child(4),

}
@media(max-width:360px){

}

/* Responsive, consistent block controls and link settings */
.pc .bh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pc .bh-title{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:15px;line-height:1.35}
.pc .bh-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.pc .bh-actions button{min-width:42px;min-height:42px;padding:7px 10px;border-radius:9px;gap:6px;font-size:12px;font-weight:600}
.pc .bh-actions .move-btn{color:var(--ac);background:var(--card);border-color:var(--bd)}
.pc .bh-actions .delete-btn{color:#a11b32;border-color:#c9828d;background:#fff}
.pc .bh-actions button .ic{width:17px;height:17px}
.pc .bh-actions button span{white-space:nowrap}
.pc .linkify-setting{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;margin:10px 0 12px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.pc .linkify-btn{display:flex;align-items:center;justify-content:flex-start;gap:9px;width:100%;min-height:44px;padding:9px 11px;border-radius:8px;text-align:left;white-space:normal;font-size:14px;font-weight:650;line-height:1.35}
.pc .linkify-btn.is-enabled{border-color:#a9c4b2;background:#f3f8f4;color:#245c3b}
.pc .linkify-state{width:18px;height:18px;flex:none;border:1.5px solid currentColor;border-radius:50%;position:relative}
.pc .linkify-btn.is-enabled .linkify-state:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pc .linkify-setting .hint{display:block;margin:0;font-size:12px;line-height:1.5;text-transform:none;overflow-wrap:anywhere}
.pc .bh-actions button:focus-visible,.pc .linkify-btn:focus-visible{outline:3px solid rgba(20,58,123,.25);outline-offset:2px}
@media(max-width:600px){
 .pc .bh{align-items:flex-start}
 .pc .bh-title{flex:1 1 100%}
 .pc .bh-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .pc .bh-actions button{width:100%;min-width:0;min-height:44px;padding:7px 5px}
 .pc .bh-actions button span{font-size:11px}
 .pc .linkify-setting{padding:9px;gap:6px}
 .pc .linkify-btn{font-size:13px;min-height:46px}
}
@media(max-width:360px){
 .pc .bh-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
 .pc .bh-actions button{font-size:11px;padding:6px 3px}
 .pc .bh-actions button .ic{width:15px;height:15px}
 .pc .linkify-btn{font-size:12px}
}


/* Soft academic treatment for student-uploaded report images */
.bd figure img.academic-report-image{
  display:block;
  border:1px solid rgba(30,55,90,.12);
  border-radius:9px;
  opacity:.94;
  box-shadow:0 2px 9px rgba(25,45,75,.08);
  transition:opacity .2s ease,box-shadow .2s ease;
}
@media print{
  .bd figure img.academic-report-image{
    opacity:.96;
    box-shadow:0 1px 4px rgba(25,45,75,.06);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}

/* Add-content bar: equal-size grid, no sideways scrolling */
.pc .addbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;padding:8px;overflow:visible;border-radius:14px;background:#fff}
.pc .addbar button,.pc .addbar .ab{box-sizing:border-box;width:100%;min-width:0;min-height:56px;height:auto;margin:0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;line-height:1.15;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ac);cursor:pointer}
.pc .addbar .ab .ic,.pc .addbar button .ic{width:20px;height:20px}
.pc .addbar button span,.pc .addbar .ab span{display:block;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.pc .addbar button:active,.pc .addbar .ab:active{background:#eef3fb}
@media(max-width:600px){.pc .addbar{grid-template-columns:repeat(4,1fr);gap:5px;padding:6px}.pc .addbar button,.pc .addbar .ab{min-height:54px;font-size:11px}}
@media(max-width:340px){.pc .addbar{grid-template-columns:repeat(3,1fr)}}

.ur-ai{padding:10px 14px}.ur-ai summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}.ur-ai summary::-webkit-details-marker{display:none}.ur-ai summary b{font-size:14px;color:var(--ac)}.ur-ai summary{position:relative;padding-right:34px}.ur-ai summary::after{content:"";position:absolute;right:2px;top:6px;width:9px;height:9px;border-right:2.5px solid var(--ac);border-bottom:2.5px solid var(--ac);transform:rotate(45deg);transition:transform .2s}.ur-ai[open] summary::after{transform:rotate(-135deg);top:10px}html[dir="rtl"] .ur-ai summary{padding-right:0;padding-left:34px}html[dir="rtl"] .ur-ai summary::after{right:auto;left:2px}.ur-ai summary small{font-size:12px;color:var(--mut);line-height:1.45}
.ur-ai[open] summary{margin-bottom:10px}.ur-ai input[type=text]{width:100%;box-sizing:border-box;min-height:40px;padding:6px 11px;border:1.5px solid var(--bd);border-radius:9px;font-size:15px;background:#fff;color:#0f2a52}

.ai-row{display:flex;flex-wrap:wrap;gap:5px}.ai-row button{min-height:34px;min-width:38px;padding:2px 11px;border:1.5px solid var(--bd);border-radius:999px;background:#fff;color:var(--fg);font-weight:700;font-size:13px}.ai-row button.on{background:var(--ac);border-color:var(--ac);color:#fff}

#nav .tab.on .tab-ic{background:var(--ac);color:var(--yl)}
#nav .tab:not(.on):active .tab-ic{background:#eef3fb}
#nav .tab:focus-visible{outline:3px solid rgba(20,58,123,.3);outline-offset:-3px}
@media(min-width:560px){#nav{justify-content:center;gap:16px}#nav .tab{flex:0 1 240px}}

.stu-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.stu-row input{flex:1;min-width:0}
#ed .stu-del{flex:none;width:46px;min-width:46px;height:46px;min-height:46px;padding:0;color:#a11b32;border-color:#c9828d;background:#fff}
#ed .stu-del:active{background:#fbeaed}
/* Loader (upload + PDF) */
.ld{position:fixed;inset:0;z-index:99;display:flex;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(244,246,250,.97);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ld-card{margin:auto;width:min(440px,100%);box-sizing:border-box;padding:26px 24px 24px;background:#fff;border:1px solid var(--bd);border-top:5px solid var(--yl);border-radius:16px;box-shadow:0 14px 40px rgba(15,42,82,.14);text-align:center;color:var(--fg)}
.ld-kick{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gd);margin-bottom:16px}
.ld-emb{position:relative;width:76px;height:76px;margin:0 auto 14px}
.ld-ring{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(216,187,116,.45);border-top-color:var(--ac);animation:spin 1s linear infinite}
.ld-ic{position:absolute;inset:10px;display:grid;place-items:center;border-radius:50%;background:#f4f6fa;color:var(--ac)}.ld-ic .ic{width:28px;height:28px}
.ld-ttl{margin:0;font-size:20px;font-weight:800;color:var(--ac)}
.ld-pct{margin-top:6px;font-size:42px;font-weight:800;line-height:1.1;color:var(--ac);font-variant-numeric:tabular-nums}
.ld-bar{height:10px;margin:12px 0 10px;border-radius:999px;background:#e6edf8;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ac);transition:width .3s ease}
.ld-st{min-height:22px;font-size:14px;font-weight:600;color:var(--fg);overflow-wrap:anywhere}
.ld-steps{list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--bd);display:grid;gap:9px;text-align:left}
.ld-steps li{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.35;color:#8b99b3}
.ld-dot{position:relative;width:18px;height:18px;flex:none;border-radius:50%;border:2px solid #c9d6ea;box-sizing:border-box}
.ld-steps li.cur{color:var(--ac);font-weight:700}.ld-steps li.cur .ld-dot{border-color:var(--ac);background:var(--ac);box-shadow:inset 0 0 0 3px #fff}
.ld-steps li.done{color:var(--fg)}.ld-steps li.done .ld-dot{background:var(--yl);border-color:var(--yl)}
.ld-steps li.done .ld-dot:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #0f2a52;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ld.is-done .ld-ring{animation:none;border-color:var(--yl)}.ld.is-done .ld-ic{background:var(--yl);color:#0f2a52}.ld.is-done .ld-st{color:var(--ac);font-weight:700}
@media(max-width:380px){.ld{padding:12px}.ld-card{padding:20px 16px}.ld-pct{font-size:36px}.ld-steps li{font-size:12.5px}}
@media(max-height:640px){.ld-emb{width:56px;height:56px;margin-bottom:8px}.ld-ic{inset:8px}.ld-ic .ic{width:22px;height:22px}.ld-kick{margin-bottom:10px}.ld-pct{font-size:32px}.ld-steps{margin-top:10px;padding-top:10px;gap:6px}}
@media(prefers-reduced-motion:reduce){.ld-ring{animation-duration:3s}}
