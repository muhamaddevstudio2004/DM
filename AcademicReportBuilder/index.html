ss point provides wireless connectivity.\n\n## 3. Conclusion\nComputer networks are the foundation of communication and shared work today. Understanding their types and devices helps in designing a suitable network.\n\n## References\n- Tanenbaum, A. S., & Wetherall, D. J. (2011). Computer Networks (5th ed.). Pearson.\n- Kurose, J. F., & Ross, K. W. (2021). Computer Networking: A Top-Down Approach (8th ed.). Pearson.",ckb:"# تۆڕی کۆمپیوتەر\n\n## کورتە\nئەم ڕاپۆرتە ناساندنێکی تۆڕی کۆمپیوتەرە، جۆرە سەرەکییەکان و ئامێرەکانی ڕوون دەکاتەوە، و نیشان دەدات بۆچی لە دامەزراوە نوێکاندا بۆ پەیوەندی گرنگن.\n\n## 1. پێشەکی\nتۆڕی کۆمپیوتەر دوو ئامێر یان زیاتر بەیەکەوە دەبەستێتەوە، بۆ ئەوەی داتا و سەرچاوەکان هاوبەش بکەن. تۆڕەکان ڕێگە دەدەن نامە بنێردرێت، فایل هاوبەش بکرێت، چاپکەرێکی هاوبەش بەکاربهێنرێت، و ئینتەرنێت بگاتە ئامێرەکان.\n\n## 2. جۆرەکانی تۆڕ\nتۆڕەکان بەگشتی بەپێی ئەو ناوچەیەی دایدەپۆشن پۆلێن دەکرێن.\n\n### 2.1 جۆرە باوەکان\n- LAN: ناوچەیەکی بچووک وەک تاقیگە یان ماڵ دادەپۆشێت.\n- MAN: شارێک یان کامپەسێکی گەورە دادەپۆشێت.\n- WAN: وڵاتان و کیشوەرەکان دادەپۆشێت، وەک ئینتەرنێت.\n\n| جۆر | ناوچە | نموونە |\n|---|---|---|\n| LAN | ژوورێک یان باڵەخانەیەک | تاقیگەی کۆمپیوتەر |\n| MAN | شار | کامپەسی زانکۆ |\n| WAN | وڵات یان جیهان | ئینتەرنێت |\n\n### 2.2 ئامێرەکانی تۆڕ\nڕاوتەر و سویچ و ئەکسێس پۆینت ئامێرە سەرەکییەکانی تۆڕن. ڕاوتەر تۆڕە جیاوازەکان پێکەوە دەبەستێتەوە، سویچ ئامێرەکانی ناو یەک تۆڕ دەبەستێتەوە، و ئەکسێس پۆینت پەیوەندی بێتەل دابین دەکات.\n\n## 3. دەرئەنجام\nتۆڕی کۆمپیوتەر بنەمای پەیوەندی و کارکردنی هاوبەشە لە ژیانی ئێستادا. تێگەیشتن لە جۆر و ئامێرەکانی یارمەتی دەدات تۆڕێکی گونجاو دیزاین بکرێت.\n\n## سەرچاوەکان\n- Tanenbaum, A. S., & Wetherall, D. J. (2011). Computer Networks (5th ed.). Pearson.\n- Kurose, J. F., & Ross, K. W. (2021). Computer Networking: A Top-Down Approach (8th ed.). Pearson.",ar:"# شبكات الحاسوب\n\n## الملخص\nيقدم هذا التقرير تعريفاً بشبكات الحاسوب، ويوضح أنواعها وأجهزتها الرئيسية، ويبين سبب أهميتها للاتصال في المؤسسات الحديثة.\n\n## 1. المقدمة\nتربط شبكة الحاسوب جهازين أو أكثر لمشاركة البيانات والموارد. وتتيح الشبكات إرسال الرسائل ومشاركة الملفات واستخدام طابعة مشتركة والوصول إلى الإنترنت.\n\n## 2. أنواع الشبكات\nتُصنَّف الشبكات عادةً بحسب المساحة التي تغطيها.\n\n### 2.1 الأنواع الشائعة\n- LAN: تغطي مساحة صغيرة مثل مختبر أو منزل.\n- MAN: تغطي مدينة أو حرماً جامعياً كبيراً.\n- WAN: تغطي دولاً وقارات، مثل الإنترنت.\n\n| النوع | التغطية | مثال |\n|---|---|---|\n| LAN | غرفة أو مبنى | مختبر الحاسوب |\n| MAN | مدينة | الحرم الجامعي |\n| WAN | دولة أو العالم | الإنترنت |\n\n### 2.2 أجهزة الشبكة\nالموجّه والمحوّل ونقطة الوصول هي الأجهزة الرئيسية للشبكة. يربط الموجّه الشبكات المختلفة، ويربط المحوّل الأجهزة داخل الشبكة الواحدة، وتوفر نقطة الوصول الاتصال اللاسلكي.\n\n## 3. الخاتمة\nتُعد شبكات الحاسوب أساس الاتصال والعمل المشترك اليوم. ويساعد فهم أنواعها وأجهزتها على تصميم شبكة مناسبة.\n\n## المراجع\n- Tanenbaum, A. S., & Wetherall, D. J. (2011). Computer Networks (5th ed.). Pearson.\n- Kurose, J. F., & Ross, K. W. (2021). Computer Networking: A Top-Down Approach (8th ed.). Pearson."};case 19:return({}=(delete n._$j0zikv.EXAMPLE,0)),({}=(i.EXAMPLE=EXAMPLE,0)),({}=(o.EXAMPLE=i.EXAMPLE,0)),{t:"",p:5,l:null};case 20:return({}=(delete n._$j0zikv.AIS,0)),({}=(i.AIS=AIS,0)),({}=(o.AIS=i.AIS,0)),{en:{abs:"Abstract",intro:"Introduction",obj:"Objectives",lit:"Literature Review",met:"Methodology",main:"Main Content",res:"Results",dis:"Discussion",con:"Conclusion",rec:"Recommendations",ref:"References"},ckb:{abs:"کورتە",intro:"پێشەکی",obj:"ئامانجەکان",lit:"پێداچوونەوەی ئەدەبیات",met:"میتۆدۆلۆجی",main:"ناوەڕۆکی سەرەکی",res:"ئەنجامەکان",dis:"گفتوگۆ",con:"دەرئەنجام",rec:"پێشنیارەکان",ref:"سەرچاوەکان"},ar:{abs:"الملخص",intro:"المقدمة",obj:"الأهداف",lit:"مراجعة الأدبيات",met:"المنهجية",main:"المحتوى الرئيسي",res:"النتائج",dis:"المناقشة",con:"الخاتمة",rec:"التوصيات",ref:"المراجع"}};case 21:return({}=(delete n._$j0zikv.AISEC,0)),({}=(i.AISEC=AISEC,0)),({}=(o.AISEC=i.AISEC,0)),a=>b(void 0,28,void 0,void 0,[a],C,214,55);case 22:return({}=
