name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 6 * * *"   # once every 24 hours (06:17 UTC). GitHub may delay scheduled runs.
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call health Edge Function (3 attempts)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}      # e.g. https://abcd1234.supabase.co
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 30 -X POST \
              "$SUPABASE_URL/functions/v1/health" \
              -H "Authorization: Bearer $HEALTH_SECRET" || true)
            echo "Attempt $i: HTTP ${code:-000}"
            cat out.json 2>/dev/null || true; echo
            [ "$code" = "200" ] && exit 0
            [ "$i" -lt 3 ] && sleep $((i * 60))
          done
          echo "::error::Health check failed after 3 attempts. The project may be paused. Restore it manually in the Supabase dashboard."
          exit 1

