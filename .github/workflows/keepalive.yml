
name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call health Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$HEALTH_SECRET" ]; then
            echo "::error::HEALTH_SECRET is missing"
            exit 1
          fi

          URL="${SUPABASE_URL%/}"

          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 30 -X POST \
            "$URL/functions/v1/health" \
            -H "Authorization: Bearer $HEALTH_SECRET" \
            -H "Content-Type: application/json")

          cat response.json
          echo "HTTP Status: $code"

          if [ "$code" != "200" ]; then
            echo "::error::Health check failed"
            exit 1
          fi
