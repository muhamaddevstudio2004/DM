
name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Supabase database (3 attempts)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"; URL="${URL%/}"
          KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          for i in 1 2 3; do
            code=$(curl -sS -o out.json -w '%{http_code}' --max-time 30 -X POST \
              "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' 2>err.txt || true)
            echo "Attempt $i: HTTP ${code:-000}"
            [ "$code" = "200" ] && exit 0
            cat err.txt; head -c 300 out.json; echo
            [ "$i" -lt 3 ] && sleep $((i * 20))
          done
          echo "::error::Ping failed after 3 attempts."
          exit 1
