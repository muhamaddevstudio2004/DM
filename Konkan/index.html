<!DOCTYPE html>
<!-- KonKan Scorekeeper — Version 3.5 -->
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خاڵنووسی کۆنکان">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6eee3">
<title>خاڵنووسی کۆنکان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  input, textarea{
    -webkit-user-select: text;
    user-select: text;
  }
  :root{
    --ivory:#f6eee3;
    --ivory-2:#eee2d2;
    --card:#fffaf3;
    --charcoal:#3a2218;
    --charcoal-soft:#7a6354;
    --copper:#5c3b2c;
    --copper-deep:#4a2e21;
    --copper-tint:#ead9c6;
    --olive:#6d4f3b;
    --olive-tint:#efe3d3;
    --border:#e2d2bd;
    --shadow: 0 1px 2px rgba(58,34,24,.04), 0 8px 24px rgba(58,34,24,.06);
    --shadow-lg: 0 4px 10px rgba(58,34,24,.06), 0 20px 40px rgba(58,34,24,.10);
    --radius: 18px;
    --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ivory);
    color: var(--charcoal);
    font-family: "Vazirmatn", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body::before{
    content:"";
    position: fixed; inset:0;
    background:
      radial-gradient(60% 40% at 15% 0%, rgba(92,59,44,.07), transparent 60%),
      radial-gradient(50% 30% at 100% 100%, rgba(92,59,44,.05), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  button{font-family:inherit;}
  input{font-family:inherit;}
  h1,h2,h3,p{margin:0;}
  button{border:none;background:none;cursor:pointer;color:inherit;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: 2.5px solid var(--copper);
    outline-offset: 2px;
  }

  .screen{
    display:none;
    max-width: 480px;
    margin: 0 auto;
    padding: calc(20px + var(--safe-top)) 18px calc(28px + var(--safe-bottom));
    position: relative;
    z-index: 1;
  }
  .screen.active{display:block;}

  /* ---------- Logo ---------- */
  .logo-block{
    position:relative;
    overflow:hidden;
    background:#5c3b2c;
    border-radius:28px;
    padding:26px 16px 24px;
    text-align:center;
    margin: 8px 0 18px;
    color:#f5ece0;
  }
  .logo-block::before{
    content:"";
    position:absolute;
    left:50%; top:-75%;
    width:125%; aspect-ratio:1;
    transform:translateX(-50%);
    border-radius:50%;
    background:#664735;
    border:1px solid #7b5841;
  }
  .logo-block > *{ position:relative; }
  .hero-art{
    display:block;
    width:72%; max-width:260px; height:auto;
    margin:0 auto 10px;
  }
  .hero-art text{ font-family:"Vazirmatn","Noto Sans Arabic",sans-serif; font-weight:800; }
  .logo-mark{
    display:inline-flex;
    align-items:baseline;
    gap: 2px;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.02em;
    direction: ltr;
  }
  .logo-mark span.k1{ color: #f5ece0; }
  .logo-mark span.k2{ color: #e3bd92; }
  .logo-sub{
    margin-top: 4px;
    font-size: 22px;
    font-weight: 700;
    color: #e8d9c6;
  }

  /* single coffee card: illustration + form together */
  .setup-card{
    margin-top: 8px;
    border-radius: 28px;
    background: #5c3b2c;
    box-shadow: var(--shadow-lg);
    padding: 26px 18px 22px;
    color: #f5ece0;
  }
  .setup-card .logo-block{
    background: none;
    border-radius: 0;
    overflow: visible;
    padding: 0;
    margin: 0 0 22px;
  }
  .setup-card .logo-block::before{ display:none; }
  .setup-card .card{
    background: transparent;
    border: 0;
    box-shadow: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
  }
  .setup-card .field label{ color:#e8d9c6; }
  .setup-card .field input[type="text"],
  .setup-card .field input[type="number"]{
    background:#f3ebdd; border-color:#f3ebdd; color:#3a2218;
  }
  .setup-card .field input:focus{ background:#fffaf3; border-color:#e3bd92; }
  .setup-card .field input::placeholder{ color:#b8a592; }
  .setup-card .round-opt{
    background: transparent; border-color:#8a6a55; color:#e8d9c6;
  }
  .setup-card .round-opt.selected{
    background:#f3ebdd; border-color:#f3ebdd; color:#3a2218;
  }
  .setup-card .btn-primary{
    background:#f5ece0; color:#4a2e21; box-shadow:none;
  }
  .setup-card .btn-primary:hover{ background:#fffaf3; }
  /* ---- compact, player-friendly layout ---- */
  .setup-card{ padding: 20px 16px 18px; }
  .setup-card .logo-block{ margin: 0 0 16px; }
  .setup-card .hero-art{ width:46%; max-width:170px; margin:0 auto 6px; }
  .setup-card .logo-mark{ font-size:34px; }
  .setup-card .logo-sub{ font-size:16px; margin-top:0; opacity:.85; }
  .setup-card .field{ margin-bottom:14px; }
  .setup-card .field label{ font-size:14px; }
  .setup-card .team-field{ --tc:#e8664f; }
  .setup-card .team-field.t2{ --tc:#5b9be8; }
  .setup-card .team-field label{ display:flex; align-items:center; gap:8px; }
  .setup-card .team-field label::before{
    content:""; width:11px; height:11px; border-radius:50%; background:var(--tc); flex-shrink:0;
  }
  .setup-card .team-field input{
    border-inline-start: 6px solid var(--tc) !important;
    font-size:18px; font-weight:700; padding:15px 16px;
  }
  .setup-card .round-options{ gap:8px; }
  .setup-card .round-opt{ padding:14px 8px; font-size:17px; }
  .setup-card .btn-primary{ padding:16px; font-size:18px; margin-top:4px; border-radius:14px; }
  .setup-card .custom-rounds-input input{ font-size:18px; font-weight:700; text-align:center; }

  .setup-card .error-text{ color:#ffb9a6; }
  .setup-card button:focus-visible, .setup-card input:focus-visible{ outline-color:#e3bd92; }

  /* ---------- Setup form ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--charcoal-soft);
    margin-bottom: 8px;
  }
  .field input[type="text"], .field input[type="number"]{
    width:100%;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--ivory-2);
    font-size: 16px;
    color: var(--charcoal);
    transition: border-color .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: #b8a592; }
  .field input:focus{ border-color: var(--copper); background: var(--card); }

  .round-options{
    display:flex;
    gap: 8px;
  }
  .round-opt{
    flex:1;
    padding: 12px 8px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--ivory-2);
    text-align:center;
    font-weight: 700;
    font-size: 15px;
    color: var(--charcoal-soft);
    transition: all .15s ease;
  }
  .round-opt.selected{
    border-color: var(--copper);
    background: var(--copper-tint);
    color: var(--copper-deep);
  }
  .custom-rounds-input{ margin-top: 10px; display:none; }
  .custom-rounds-input.show{ display:block; }

  .error-text{
    color: #b3402a;
    font-size: 13px;
    margin-top: 6px;
    display:none;
  }
  .error-text.show{ display:block; }

  .btn-primary{
    width:100%;
    padding: 15px;
    border-radius: var(--radius-sm);
    background: var(--copper);
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    box-shadow: 0 6px 16px rgba(92,59,44,.30);
    transition: transform .1s ease, box-shadow .15s ease, background .15s ease;
    margin-top: 6px;
  }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary:hover{ background: var(--copper-deep); }

  .score-actions{
    display:flex;
    gap:10px;
  }
  .score-actions .btn-primary{ margin-top:0; }
  .btn-share{
    width: 52px;
    flex-shrink:0;
    border-radius: var(--radius-sm);
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--charcoal-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-share:hover{ background: var(--ivory-2); color: var(--copper-deep); border-color: var(--copper); }
  .btn-share svg{ width:20px; height:20px; }

  /* ---------- Score screen header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 16px;
  }
  .icon-btn{
    width: 42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--charcoal-soft);
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background: var(--ivory-2); color: var(--charcoal); }
  .icon-btn svg{ width:20px; height:20px; }
  .topbar-actions{ display:flex; gap:8px; }
  .brand-mini{
    font-weight: 800; font-size: 19px; direction: ltr;
  }
  .brand-mini span.k2{ color: var(--copper); }

  .game-timer{
    direction:ltr;
    display:flex; align-items:center; gap:7px;
    font-size: 15px;
    font-weight: 800;
    color: var(--copper-deep);
    font-variant-numeric: tabular-nums;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 9px 13px;
    border-radius: 999px;
  }
  .game-timer::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:#3f9d5a; box-shadow:0 0 0 3px rgba(63,157,90,.18);
  }
  .game-timer.stopped::before{ background:#b8a592; box-shadow:none; }

  /* ---------- Hero: who needs how many points ---------- */
  :root{ --t1:#d2452f; --t2:#2a68b8; --t1-soft:#ff8f78; --t2-soft:#86b6f2; }
  .need-card{
    position:relative; overflow:hidden;
    background:#5c3b2c; color:#f5ece0;
    border-radius:26px;
    padding:20px 18px 20px;
    text-align:center;
    box-shadow: var(--shadow-lg);
    margin-bottom:12px;
    display:flex; flex-direction:column; align-items:center;
  }
  .need-card::before{
    content:""; position:absolute; left:50%; top:-120%;
    width:140%; aspect-ratio:1; transform:translateX(-50%);
    border-radius:50%; background:#664735; border:1px solid #7b5841;
  }
  .need-card > *{ position:relative; }
  .need-card .dot{ width:13px; height:13px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .need-card .dot.t1{ background:var(--t1-soft); }
  .need-card .dot.t2{ background:var(--t2-soft); }
  .need-who{
    display:inline-flex; align-items:center; gap:9px; max-width:100%;
    font-size:24px; font-weight:800; line-height:1.3;
  }
  .need-who .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .need-label{ font-size:15px; font-weight:600; color:#e8d9c6; opacity:.9; }
  .need-num{
    display:flex; align-items:baseline; justify-content:center; gap:10px;
    line-height:1; margin:6px 0 2px;
  }
  .need-num b{
    font-size:88px; font-weight:800; letter-spacing:-.02em;
    font-variant-numeric: tabular-nums; direction:ltr;
  }
  .need-num span{ font-size:24px; font-weight:800; color:#e3bd92; }
  .need-sub{
    display:inline-flex; align-items:center; gap:7px;
    margin-top:12px; font-size:14px; font-weight:700;
    background:rgba(243,235,221,.12); border:1px solid rgba(243,235,221,.22);
    padding:7px 14px; border-radius:999px; max-width:100%;
  }
  .need-sub .dot{ width:9px; height:9px; }
  .need-msg{ font-size:20px; font-weight:800; margin-top:6px; }
  .need-hint{ font-size:13.5px; color:#e8d9c6; opacity:.8; margin-top:4px; }
  .need-winner{
    display:inline-flex; align-items:center; gap:10px; max-width:100%;
    font-size:40px; font-weight:800; line-height:1.25; margin-top:2px;
  }
  .need-winner .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .need-trophy{ color:#e3bd92; display:flex; justify-content:center; margin-bottom:2px; }
  .need-trophy svg{ width:38px; height:38px; }
  @keyframes needBump{ 0%{ transform:scale(.96); } 55%{ transform:scale(1.025); } 100%{ transform:scale(1); } }
  .need-card.bump{ animation: needBump .45s ease; }

  /* ---------- Team total cards ---------- */
  .teams{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:16px;
  }
  .tcard{
    --tc: var(--t1);
    position:relative; min-width:0;
    background: var(--card);
    border:1.5px solid var(--border);
    border-top:5px solid var(--tc);
    border-radius:18px;
    padding:12px 14px 10px;
    transition: background .3s ease, border-color .3s ease;
  }
  .tcard.t2{ --tc: var(--t2); }
  .tc-name{ display:flex; align-items:center; gap:7px; min-width:0; font-weight:700; font-size:15px; }
  .tc-name .sb-dot{ width:10px; height:10px; border-radius:50%; background:var(--tc); flex-shrink:0; }
  .tc-name .sb-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tc-score{
    font-size:40px; font-weight:800; line-height:1.15; margin-top:4px;
    color: var(--tc); direction:ltr; text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .tc-chip{
    display:none; position:absolute; top:-12px; left:10px;
    font-size:11.5px; font-weight:800; color:#fff;
    background: var(--tc); padding:3px 10px; border-radius:999px;
  }
  .tcard.leading .tc-chip{ display:inline-block; }
  .tcard.t1.leading{ background:#fdf0ec; border-color:#f2c3b8; border-top-color:var(--t1); }
  .tcard.t2.leading{ background:#edf3fc; border-color:#bcd2f0; border-top-color:var(--t2); }

  /* ---------- Game progress ---------- */
  .progress{ margin: 0 2px 16px; }
  .progress-text{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; font-weight:700; color: var(--charcoal-soft); margin-bottom:7px;
  }
  .progress-segs{ display:flex; gap:4px; direction:rtl; }
  .pseg{
    flex:1; height:8px; border-radius:999px;
    background: var(--ivory-2); border:1px solid var(--border);
    transition: background .3s ease, border-color .3s ease;
  }
  .pseg.done{ background: var(--copper); border-color: var(--copper); }
  .pseg.skipped{ opacity:.35; }
  .pseg.bonus{ border-style:dashed; border-color: var(--copper); }
  .pseg.bonus.done{ border-style:solid; }
  @keyframes segPulse{ 0%,100%{ background: var(--copper-tint); } 50%{ background:#d9bf9f; } }
  .pseg.current{ border-color: var(--copper); animation: segPulse 1.6s ease-in-out infinite; }

  .konkan-notice{
    display:flex; align-items:center; justify-content:center; gap:8px;
    text-align:center;
    font-size: 16px;
    font-weight: 800;
    color: #8f2a17;
    background: #fbe3da;
    border: 1.5px solid #eeb09e;
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .konkan-notice::before{ content:"⚠"; font-size:18px; margin-inline-end:2px; }

  /* ---------- Round table ---------- */
  .rounds-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--charcoal-soft);
    margin: 4px 4px 10px;
  }
  .round-header{
    display:grid;
    grid-template-columns: 44px 1fr 1fr;
    padding: 0 2px 8px;
  }
  .round-header .rh-name{
    text-align:center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--charcoal-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding: 0 4px;
  }
  #rhName1::before, #rhName2::before{
    content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-inline-end:5px; vertical-align:middle;
  }
  #rhName1::before{ background: var(--t1); }
  #rhName2::before{ background: var(--t2); }
  .round-list{
    display:flex;
    flex-direction:column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .round-row{
    display:grid;
    grid-template-columns: 44px 1fr 1fr;
    align-items:center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow:hidden;
  }
  .round-tag{
    font-size: 13px;
    font-weight: 700;
    color: var(--charcoal-soft);
    text-align:center;
    padding: 0 4px;
  }
  .round-cell{
    padding: 15px 6px;
    text-align:center;
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--charcoal);
    border-inline-start: 1px solid var(--border);
    transition: background .12s ease;
  }
  .round-cell:active{ background: var(--copper-tint); }
  .round-cell.empty{ color: #c3b9a8; font-weight:600; }
  .round-cell.round-cell-disabled{
    color:#d8d0c2;
    background: var(--ivory-2);
    cursor: default;
    pointer-events: none;
  }
  .round-row.current{
    border:2px solid var(--copper);
    box-shadow: 0 6px 18px rgba(92,59,44,.14);
  }
  .round-row.current .round-tag{ color: var(--copper-deep); font-weight:800; }
  .round-row.current .round-cell.empty{ color: var(--copper); font-size:24px; font-weight:700; }
  .round-row.locked{ background:transparent; border-style:dashed; }
  .round-row.locked .round-cell{ background:transparent; padding:9px 6px; font-size:15px; }
  .round-row.locked .round-tag{ opacity:.55; }
  .round-cell.round-cell-gharbat{
    color: var(--olive);
    font-size: 13.5px;
    font-weight: 700;
  }

  /* ---------- Final result ---------- */
  .final-result{
    display:none;
    background: linear-gradient(180deg, var(--copper-tint), var(--card) 60%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 22px 18px;
    text-align:center;
    margin-bottom: 20px;
    animation: pop .35s ease;
  }
  .final-result.show{ display:block; }
  @keyframes pop{
    from{ opacity:0; transform: translateY(6px) scale(.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .final-trophy{ color: var(--copper); margin-bottom: 6px; }
  .final-trophy svg{ width:34px; height:34px; }
  .final-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--charcoal-soft);
    margin-bottom: 12px;
  }
  .final-scores{
    display:flex;
    justify-content:center;
    gap: 28px;
    margin-bottom: 12px;
  }
  .final-team-name{ font-size: 14px; font-weight:600; color: var(--charcoal-soft); margin-bottom:4px;}
  .final-team-score{ font-size: 30px; font-weight:800; color: var(--charcoal); }
  .final-verdict{
    font-size: 15px;
    font-weight: 700;
    color: var(--copper-deep);
  }

  /* ---------- Overlay / Modal ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(58,34,24,.42);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
    padding: 0;
  }
  .overlay.show{ display:flex; }
  @media (min-width: 520px){
    .overlay{ align-items:center; }
  }
  .modal{
    width:100%;
    max-width: 460px;
    background: var(--ivory);
    border-radius: 22px 22px 0 0;
    padding: 20px 18px calc(20px + var(--safe-bottom));
    box-shadow: var(--shadow-lg);
    transform: translateY(24px);
    opacity:0;
    transition: transform .22s ease, opacity .22s ease;
    max-height: 88vh;
    overflow-y:auto;
  }
  @media (min-width: 520px){
    .modal{ border-radius: 22px; }
  }
  .overlay.show .modal{ transform: translateY(0); opacity:1; }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .modal-title{ font-size: 17px; font-weight: 800; }
  .modal-close{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color: var(--charcoal-soft);
    background: var(--ivory-2);
  }
  .modal-close svg{ width:16px;height:16px; }

  .score-input-group{ margin-bottom: 14px; }
  .score-input-group label{
    display:block; font-size:13.5px; font-weight:700; color: var(--charcoal-soft);
    margin-bottom:8px;
  }
  .score-input-group input{
    width:100%;
    padding: 15px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 20px;
    font-weight: 700;
    color: var(--charcoal);
    text-align:center;
    font-variant-numeric: tabular-nums;
    transition: border-color .15s ease;
  }
  .score-input-group input.active-input{ border-color: var(--copper); }
  #scoreLabel1, #scoreLabel2{ display:flex; align-items:center; gap:8px; font-size:15px; color:var(--charcoal); }
  #scoreLabel1::before, #scoreLabel2::before{ content:""; width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  #scoreLabel1::before{ background:var(--t1); }
  #scoreLabel2::before{ background:var(--t2); }
  #scoreInput1.active-input{ border-color:var(--t1); box-shadow:0 0 0 3px rgba(210,69,47,.12); }
  #scoreInput2.active-input{ border-color:var(--t2); box-shadow:0 0 0 3px rgba(42,104,184,.12); }

  .quick-scores{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 14px 0 18px;
  }
  .quick-btn{
    padding: 10px 4px;
    border-radius: 10px;
    background: var(--ivory-2);
    border: 1px solid var(--border);
    font-weight: 700;
    font-size: 14px;
    color: var(--charcoal-soft);
    font-variant-numeric: tabular-nums;
  }
  .quick-btn:active{ background: var(--copper-tint); color: var(--copper-deep); }

  .modal-save{
    width:100%;
    padding: 15px;
    border-radius: var(--radius-sm);
    background: var(--copper);
    color:#fff;
    font-weight:700;
    font-size:16px;
  }
  .modal-gharbat{
    width:100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    background: var(--olive-tint);
    border: 1px solid #e0d0bb;
    color: var(--olive);
    font-weight:700;
    font-size:14.5px;
    margin-bottom: 10px;
  }

  /* small confirm modal */
  .confirm-modal{ text-align:center; }
  .confirm-text{ font-size:15px; color:var(--charcoal-soft); margin: 4px 0 18px; line-height:1.6; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{
    flex:1;
    padding: 13px;
    border-radius: var(--radius-sm);
    font-weight:700;
    font-size:15px;
  }
  .confirm-cancel{ background: var(--ivory-2); border:1px solid var(--border); color: var(--charcoal-soft); }
  .confirm-ok{ background: var(--copper); color:#fff; }

  /* history */
  .history-list{ display:flex; flex-direction:column; gap:10px; max-height:60vh; overflow-y:auto; }
  .history-empty{ text-align:center; color: var(--charcoal-soft); font-size:14px; padding: 30px 0; }
  .history-item{
    background: var(--card);
    border:1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .history-item-main{ min-width:0; }
  .history-teams{ font-weight:700; font-size:15px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .history-score{ font-weight:800; font-size:15px; color: var(--copper-deep); }
  .history-meta{ font-size:12.5px; color: var(--charcoal-soft); margin-top:3px; }
  .history-del{
    width:36px;height:36px;flex-shrink:0;
    border-radius: 10px;
    display:flex;align-items:center;justify-content:center;
    color:#b3402a; background: #fbe9e4;
  }
  .history-del svg{ width:16px;height:16px; }

  .share-preview{
    display:block;
    width:100%;
    height:auto;
    max-height:58vh;
    object-fit:contain;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fff;
    margin-bottom:14px;
    -webkit-touch-callout: default;
    -webkit-user-select: auto;
    user-select: auto;
  }
  .toast{
    position: fixed;
    bottom: calc(24px + var(--safe-bottom));
    left:50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--charcoal);
    color: var(--ivory);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 100;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }


  /* ================= Tournament ================= */
  .mode-tabs{
    display:flex; gap:6px; padding:4px; margin-bottom:16px;
    background: rgba(0,0,0,.2); border-radius:14px;
  }
  .mode-tab{
    flex:1; padding:11px 8px; border-radius:11px;
    font-weight:700; font-size:15px; color:#e8d9c6;
    transition: background .15s ease, color .15s ease;
  }
  .mode-tab.active{ background:#f3ebdd; color:#3a2218; }

  .resume-box{
    background: rgba(243,235,221,.12);
    border: 1px solid rgba(243,235,221,.28);
    border-radius:14px; padding:12px 14px; margin-bottom:16px;
    color:#f5ece0;
  }
  .resume-title{ font-weight:800; font-size:15px; }
  .resume-sub{ font-size:12.5px; opacity:.8; margin-top:2px; }
  .resume-actions{ display:flex; gap:8px; margin-top:10px; }
  .resume-actions button{
    flex:1; padding:10px; border-radius:11px; font-weight:700; font-size:14px;
  }
  .resume-go{ background:#f3ebdd; color:#3a2218; }
  .resume-del{ border:1px solid rgba(243,235,221,.4); color:#f5ece0; }

  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:54px; height:54px; border-radius:14px; flex-shrink:0;
    background:#f3ebdd; color:#3a2218; font-size:28px; font-weight:700; line-height:1;
  }
  .stepper input{ text-align:center; font-size:22px !important; font-weight:800 !important; }

  .tname-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tnum{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(243,235,221,.18); color:#f5ece0; font-weight:700; font-size:13.5px;
  }
  .setup-card .tname-row input{
    flex:1; min-width:0; width:100%;
    padding:13px 14px; border-radius:12px;
    border:1.5px solid #f3ebdd; background:#f3ebdd; color:#3a2218;
    font-size:17px; font-weight:700;
  }
  .setup-card .tname-row input:focus{ background:#fffaf3; border-color:#e3bd92; }
  .setup-card .tname-row input.dup{ border-color:#ff9c86; }

  .match-label{
    text-align:center; font-size:13px; font-weight:700;
    color: var(--charcoal-soft); margin: -4px 0 4px;
  }

  /* bracket */
  .b-head{ margin: 6px 0 14px; }
  .b-title{ font-size:22px; font-weight:800; }
  .b-sub{ color: var(--charcoal-soft); font-size:13.5px; margin-top:2px; }
  .round-title{
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:16px; margin: 20px 0 10px;
  }
  .round-badge{
    font-size:11.5px; background: var(--copper); color:#f5ece0;
    padding:2px 10px; border-radius:999px; font-weight:700;
  }
  .match-card{
    background: var(--card); border:1px solid var(--border);
    border-radius:16px; padding:12px; margin-bottom:10px; box-shadow: var(--shadow);
  }
  .match-card.bye{ background:transparent; box-shadow:none; border-style:dashed; padding:10px 12px; }
  .mc-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color: var(--charcoal-soft); margin-bottom:8px; font-weight:600;
  }
  .mc-chip{ padding:2px 10px; border-radius:999px; background: var(--ivory-2); font-weight:700; }
  .mc-chip.live{ background:#f1d9b8; color:#6a3d12; }
  .mc-chip.done{ background:#dfe8d2; color:#46602a; }
  .mc-team{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 12px; border-radius:11px; background: var(--ivory);
    margin-bottom:6px; font-weight:700;
  }
  .mc-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mc-team.win{ background:#e3ecd6; }
  .mc-team.win .mc-name::before{ content:"✓"; color:#46602a; margin-inline-end:6px; }
  .mc-team.lose{ opacity:.5; }
  .mc-team.lose .mc-name{ text-decoration:line-through; }
  .mc-team.tbd{ background:transparent; border:1px dashed var(--border); color: var(--charcoal-soft); font-weight:600; }
  .mc-score{ direction:ltr; font-variant-numeric: tabular-nums; font-weight:800; }
  .mc-btn{
    width:100%; margin-top:4px; padding:12px; border-radius:12px;
    background: var(--copper); color:#f5ece0; font-weight:700; font-size:15px;
  }
  .mc-btn.secondary{ background: var(--ivory-2); color: var(--charcoal-soft); border:1px solid var(--border); }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(14px) scale(.97); } to{ opacity:1; transform:none; } }
  .match-card.reveal{ animation: cardIn .5s ease both; }

  .champion-card{
    background:#5c3b2c; color:#f5ece0; border-radius:24px;
    padding:24px 18px; text-align:center; margin-bottom:6px;
    box-shadow: var(--shadow-lg);
  }
  .champion-card svg{ width:58px; height:58px; color:#e3bd92; }
  .champion-label{ font-size:13.5px; opacity:.85; margin-top:4px; }
  .champion-name{ font-size:30px; font-weight:800; margin:4px 0 14px; }
  .champion-card button{
    padding:12px 22px; border-radius:12px; background:#f3ebdd; color:#3a2218; font-weight:700;
  }
  .btn-danger-ghost{
    width:100%; margin-top:24px; padding:13px; border-radius:14px;
    color:#a3402e; border:1px solid #e0b9ae; background:transparent; font-weight:700;
  }

  /* draw */
  .draw-card{
    background:#5c3b2c; color:#f5ece0; border-radius:28px;
    padding:34px 16px 26px; text-align:center; margin-top:30px;
    box-shadow: var(--shadow-lg);
  }
  .draw-title{ font-size:24px; font-weight:800; }
  .draw-hint{ font-size:14px; opacity:.85; margin-top:4px; }
  .draw-count{
    width:124px; height:124px; border-radius:50%; margin:22px auto;
    border:4px solid #e3bd92; display:flex; align-items:center; justify-content:center;
    font-size:64px; font-weight:800; font-variant-numeric: tabular-nums;
  }
  @keyframes tickPulse{ 0%{ transform:scale(1.14); } 100%{ transform:scale(1); } }
  .draw-count.tick{ animation: tickPulse .5s ease; }
  .draw-slots{ display:flex; align-items:center; gap:8px; }
  .draw-slot{
    flex:1; min-height:56px; padding:14px 8px; border-radius:14px;
    background:#f3ebdd; color:#3a2218; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .draw-vs{ color:#e3bd92; font-weight:800; font-size:20px; }
  .draw-skip{ margin-top:22px; color:#e8d9c6; font-size:14px; text-decoration:underline; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
  }
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<section id="setupScreen" class="screen active">
  <div class="setup-card">
  <div class="logo-block">
    <svg class="hero-art" viewBox="0 0 340 178" aria-hidden="true">
      <g transform="rotate(-8 66 114)">
        <rect x="20" y="62" width="92" height="104" rx="11" fill="#f3ebdd"/>
        <text x="66" y="130" font-size="50" fill="#3d2218" text-anchor="middle">8</text>
      </g>
      <g transform="rotate(8 274 114)">
        <rect x="228" y="62" width="92" height="104" rx="11" fill="#f3ebdd"/>
        <text x="274" y="130" font-size="50" fill="#3d2218" text-anchor="middle">5</text>
      </g>
      <rect x="130" y="14" width="80" height="124" rx="12" fill="#f3ebdd"/>
      <text x="170" y="92" font-size="50" fill="#8a5230" text-anchor="middle">13</text>
    </svg>
    <div class="logo-mark"><span class="k1">Kon</span><span class="k2">Kan</span></div>
    <div class="logo-sub">خاڵنووس</div>
  </div>

  <div id="tournResume" class="resume-box" style="display:none;"></div>

  <div class="mode-tabs" id="modeTabs">
    <button type="button" class="mode-tab active" data-mode="quick">یاری خێرا</button>
    <button type="button" class="mode-tab" data-mode="tourn">پاڵەوانێتی</button>
  </div>

  <div class="card" id="tournForm" style="display:none;">
    <div class="field">
      <label for="tournName">ناوی پاڵەوانێتی (ئارەزوومەندانە)</label>
      <input type="text" id="tournName" maxlength="30" autocomplete="off" autocorrect="off">
    </div>
    <div class="field">
      <label for="tCountInput">ژمارەی تیمەکان</label>
      <div class="stepper">
        <button type="button" id="tCountMinus" aria-label="کەمکردنەوە">−</button>
        <input type="number" id="tCountInput" inputmode="numeric" min="2" max="32" value="4">
        <button type="button" id="tCountPlus" aria-label="زیادکردن">+</button>
      </div>
    </div>
    <div class="field">
      <label>ناوی تیمەکان</label>
      <div id="tournNames"></div>
    </div>
    <div class="field">
      <label id="tRoundsLabel">تەڵقەکانی هەر یارییەک</label>
      <div class="round-options" role="group" aria-labelledby="tRoundsLabel">
        <button type="button" class="round-opt t-opt selected" data-rounds="7">7</button>
        <button type="button" class="round-opt t-opt" data-rounds="9">9</button>
        <button type="button" class="round-opt t-opt" data-rounds="custom">دڵخواز</button>
      </div>
      <div class="custom-rounds-input" id="tCustomWrap">
        <input type="number" id="tCustomInput" inputmode="numeric" min="1" max="30" placeholder="ژمارە بنووسە">
      </div>
    </div>
    <p class="error-text" id="tournError"></p>
    <button class="btn-primary" id="tournStartBtn">قورعە بکە</button>
  </div>

  <div class="card" id="quickForm">
    <div class="field team-field t1">
      <label for="team1Input">ناوی تیمی یەکەم</label>
      <input type="text" id="team1Input" maxlength="20" autocomplete="off" autocorrect="off" enterkeyhint="next">
    </div>
    <div class="field team-field t2">
      <label for="team2Input">ناوی تیمی دووەم</label>
      <input type="text" id="team2Input" maxlength="20" autocomplete="off" autocorrect="off" enterkeyhint="go">
    </div>

    <div class="field">
      <label id="roundsLabel">تەڵقەکان</label>
      <div class="round-options" role="group" aria-labelledby="roundsLabel">
        <button type="button" class="round-opt selected" data-rounds="7">7</button>
        <button type="button" class="round-opt" data-rounds="9">9</button>
        <button type="button" class="round-opt" data-rounds="custom">دڵخواز</button>
      </div>
      <div class="custom-rounds-input" id="customRoundsWrap">
        <input type="number" id="customRoundsInput" inputmode="numeric" min="1" max="30" placeholder="ژمارە بنووسە">
      </div>
    </div>

    <p class="error-text" id="setupError">تکایە ناوی هەردوو تیم بنووسە</p>
    <button class="btn-primary" id="startGameBtn">بابڕوا</button>
  </div>
  </div>
</section>

<!-- ============ DRAW SCREEN ============ -->
<section id="drawScreen" class="screen">
  <div class="draw-card">
    <div class="draw-title">قورعە</div>
    <div class="draw-hint">تیمەکان بە Random دەکەونە بەرامبەر یەکتر</div>
    <div class="draw-count" id="drawCount">5</div>
    <div class="draw-slots">
      <div class="draw-slot" id="drawA"></div>
      <div class="draw-vs">×</div>
      <div class="draw-slot" id="drawB"></div>
    </div>
    <button class="draw-skip" id="drawSkip" type="button">پەڕاندن</button>
  </div>
</section>

<!-- ============ BRACKET SCREEN ============ -->
<section id="bracketScreen" class="screen">
  <div class="topbar">
    <div class="brand-mini">Kon<span class="k2">Kan</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="bHomeBtn" aria-label="سەرەتا" title="سەرەتا"></button>
    </div>
  </div>
  <div class="b-head">
    <div class="b-title" id="bTitle"></div>
    <div class="b-sub" id="bSub"></div>
  </div>
  <div id="bChampion" style="display:none;"></div>
  <div id="bRounds"></div>
  <button class="btn-danger-ghost" id="bDeleteBtn" type="button">سڕینەوەی پاڵەوانێتی</button>
</section>

<!-- ============ SCORE SCREEN ============ -->
<section id="scoreScreen" class="screen">
  <div class="topbar">
    <div class="brand-mini">Kon<span class="k2">Kan</span></div>
    <div class="game-timer" id="gameTimer">00:00</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="homeBtn" aria-label="گەڕانەوە بۆ سەرەتا" title="سەرەتا"></button>
      <button class="icon-btn" id="soundBtn" aria-label="دەنگ" title="دەنگ"></button>
      <button class="icon-btn" id="historyBtn" aria-label="مێژووی یارییەکان" title="مێژوو"></button>
    </div>
  </div>

  <div class="match-label" id="matchLabel" style="display:none;"></div>

  <div class="need-card" id="needCard" aria-live="polite"></div>

  <div class="konkan-notice" id="konkanNotice" style="display:none;"></div>

  <div class="teams" id="scoreboard">
    <div class="tcard t1" id="sbRow1">
      <span class="tc-chip">لە پێشە</span>
      <div class="tc-name"><span class="sb-dot"></span><span class="sb-name" id="sbName1"></span></div>
      <div class="tc-score" id="sbScore1">0</div>
    </div>
    <div class="tcard t2" id="sbRow2">
      <span class="tc-chip">لە پێشە</span>
      <div class="tc-name"><span class="sb-dot"></span><span class="sb-name" id="sbName2"></span></div>
      <div class="tc-score" id="sbScore2">0</div>
    </div>
  </div>

  <div class="progress" id="gameProgress">
    <div class="progress-text"><span id="progressLeft"></span><span id="progressRight"></span></div>
    <div class="progress-segs" id="progressSegs"></div>
  </div>

  <div class="round-header" id="roundHeader">
    <div></div>
    <div class="rh-name" id="rhName1"></div>
    <div class="rh-name" id="rhName2"></div>
  </div>
  <div class="round-list" id="roundList"></div>

  <div class="score-actions">
    <button class="btn-primary" id="newGameBtn">یاری نوێ</button>
    <button class="btn-share" id="shareBtn" aria-label="وێنەگرتن و هاوبەشکردن" title="وێنەگرتن و هاوبەشکردن"></button>
  </div>
</section>
<canvas id="shareCanvas" style="display:none;"></canvas>

<!-- ============ SCORE MODAL ============ -->
<div class="overlay" id="scoreOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="scoreModalTitle">ت 1</div>
      <button class="modal-close" id="closeScoreModal" aria-label="داخستن"></button>
    </div>

    <div class="score-input-group">
      <label id="scoreLabel1"></label>
      <input type="number" inputmode="numeric" id="scoreInput1" min="0" placeholder="0">
    </div>
    <div class="score-input-group">
      <label id="scoreLabel2"></label>
      <input type="number" inputmode="numeric" id="scoreInput2" min="0" placeholder="0">
    </div>

    <div class="quick-scores" id="quickScores"></div>

    <button class="modal-gharbat" id="gharbatBtn" type="button">غەربەت کردن</button>
    <button class="modal-save" id="saveScoreBtn">تۆمارکردن</button>
  </div>
</div>

<!-- ============ NEW GAME CONFIRM MODAL ============ -->
<div class="overlay" id="newGameOverlay">
  <div class="modal confirm-modal">
    <div class="modal-head" style="justify-content:center; margin-bottom:4px;">
      <div class="modal-title">یاری نوێ؟</div>
    </div>
    <p class="confirm-text">هەموو خاڵەکانی ئێستا دەسڕدرێنەوە. ناوی گرووپەکان وەک خۆی دەمێنێتەوە.</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="cancelNewGame">پاشگەزبوونەوە</button>
      <button class="confirm-ok" id="confirmNewGame">دەستپێبکە</button>
    </div>
  </div>
</div>

<!-- ============ GENERIC CONFIRM MODAL ============ -->
<div class="overlay" id="confirmOverlay">
  <div class="modal confirm-modal">
    <div class="modal-head" style="justify-content:center; margin-bottom:4px;">
      <div class="modal-title" id="confirmTitle"></div>
    </div>
