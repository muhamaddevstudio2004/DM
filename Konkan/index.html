  /* ---------------- Tournament (knockout) ---------------- */
  var T = null;                 // current tournament
  var currentMatchId = null;
  var soundPref = true;

  /*T-PURE-START*/
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildTournament(name, teams, roundsPerMatch){
    var n = teams.length;
    var size = 1;
    while(size < n) size *= 2;
    var R = 0;
    for(var q=size; q>1; q = q/2) R++;
    var byes = size - n;
    var order = shuffle(teams.map(function(_, i){ return i; }));
    var firstCount = size/2;
    var idx = [];
    for(var k=0;k<firstCount;k++) idx.push(k);
    idx = shuffle(idx);
    var byeSet = {};
    for(var b=0;b<byes;b++) byeSet[idx[b]] = true;

    var rounds = [];
    var p = 0;
    for(var r=0;r<R;r++){
      var count = size / Math.pow(2, r+1);
      var list = [];
      for(var i=0;i<count;i++){
        var m = { id:"r"+r+"m"+i, r:r, i:i, a:null, b:null, winner:null, bye:false, game:null, no:0 };
        if(r === 0){
          if(byeSet[i]){ m.a = order[p++]; m.bye = true; m.winner = m.a; }
          else { m.a = order[p++]; m.b = order[p++]; }
        }
        list.push(m);
      }
      rounds.push(list);
    }
    var no = 0;
    rounds.forEach(function(list){ list.forEach(function(m){ if(!m.bye) m.no = ++no; }); });

    var tour = {
      id: "t" + Date.now(),
      name: name,
      teams: teams,
      roundsPerMatch: roundsPerMatch,
      size: size,
      rounds: rounds,
      revealed: false,
      finished: false,
      champion: null,
      activeMatchId: null
    };
    refreshSlots(tour);
    return tour;
  }

  // Fill each next-round slot from the winners of the previous round
  function refreshSlots(tour){
    var R = tour.rounds.length;
    var prev = {};
    for(var r=1;r<R;r++){
      tour.rounds[r].forEach(function(m){ prev[m.id] = m.a + "|" + m.b; m.a = null; m.b = null; });
    }
    for(var r2=0;r2<R-1;r2++){
      tour.rounds[r2].forEach(function(m, i){
        if(m.winner !== null){
          var nx = tour.rounds[r2+1][i>>1];
          if(i % 2 === 0) nx.a = m.winner; else nx.b = m.winner;
        }
      });
    }
    for(var r3=1;r3<R;r3++){
      tour.rounds[r3].forEach(function(m){
        if(prev[m.id] !== (m.a + "|" + m.b) && m.game && m.winner === null){ m.game = null; }
      });
    }
    var fin = tour.rounds[R-1][0];
    tour.finished = fin.winner !== null;
    tour.champion = fin.winner;
  }

  function roundTitleFor(size, r){
    var remaining = size / Math.pow(2, r);
    if(remaining === 2) return "کۆتایی";
    if(remaining === 4) return "نیمەکۆتایی";
    if(remaining === 8) return "چارەکی کۆتایی";
    return "دەوری " + remaining;
  }
  /*T-PURE-END*/

  function roundTitle(r){ return roundTitleFor(T.size, r); }

  function loadTournament(){
    try{
      var raw = localStorage.getItem(K_TOURN);
      T = raw ? JSON.parse(raw) : null;
      if(T && !Array.isArray(T.rounds)) T = null;
    }catch(e){ T = null; }
  }
  function saveTournament(){
    if(!T) return;
    try{ lsSet(K_TOURN, JSON.stringify(T)); }catch(e){}
  }
  function clearTournament(){
    T = null;
    currentMatchId = null;
    try{ lsRemove(K_TOURN); }catch(e){}
  }

  function getMatch(id){
    if(!T) return null;
    for(var r=0;r<T.rounds.length;r++){
      for(var i=0;i<T.rounds[r].length;i++){
        if(T.rounds[r][i].id === id) return T.rounds[r][i];
      }
    }
    return null;
  }
  function nextMatchOf(m){
    if(!T || m.r >= T.rounds.length-1) return null;
    return T.rounds[m.r+1][m.i>>1];
  }
  function gameHasScore(g){
    return !!(g && g.roundsData && g.roundsData.some(function(r){
      return (r.t1 !== null && r.t1 !== undefined) || (r.t2 !== null && r.t2 !== undefined);
    }));
  }
  function gameTotals(g){
    var t1 = 0, t2 = 0;
    g.roundsData.forEach(function(r){
      if(r.t1 !== null && r.t1 !== undefined) t1 += r.t1;
      if(r.t2 !== null && r.t2 !== undefined) t2 += r.t2;
    });
    return { t1:t1, t2:t2 };
  }

  // A finished match is locked once the next match already has scores
  function tournamentLocked(){
    if(!currentMatchId || !T) return false;
    var m = getMatch(currentMatchId);
    if(!m) return false;
    var nx = nextMatchOf(m);
    return !!(nx && (nx.winner !== null || gameHasScore(nx.game)));
  }

  // Called after every score change of a tournament match
  function tournamentAfterChange(){
    var m = getMatch(currentMatchId);
    if(!m) return;
    var status = getRoundCheckStatus();
    var result = null;
    if(status && status.type === "lost"){
      result = status.team === "team1" ? "team2" : "team1";
    } else if(isGameComplete()){
      var t = calculateTotals();
      result = t.t1 < t.t2 ? "team1" : (t.t2 < t.t1 ? "team2" : "tie");
    }

    if(result === "tie"){
      gameState.roundsData.push({ t1:null, t2:null });
      gameState.rounds += 1;
      showToast("یەکسان بوون — تەڵقەیەکی زیادە زیاد کرا");
      result = null;
    }

    var newWinner = result === null ? null : (result === "team1" ? m.a : m.b);
    if(newWinner !== m.winner){
      m.winner = newWinner;
      refreshSlots(T);
      if(newWinner !== null){
        showToast(T.teams[newWinner] + (T.finished ? " بوو بە پاڵەوان" : " تێپەڕی"));
      }
    }
    saveTournament();
  }

  function startMatch(id){
    var m = getMatch(id);
    if(!m || m.a === null || m.b === null || m.bye) return;
    if(!m.game){
      var actual = T.roundsPerMatch + 1;
      m.game = {
        team1Name: T.teams[m.a],
        team2Name: T.teams[m.b],
        rounds: actual,
        roundsData: createRounds(actual),
        sound: soundPref,
        historySaved: false,
        startedAt: Date.now()
      };
    }
    gameState = m.game;
    gameState.sound = soundPref;
    currentMatchId = id;
    undoStack = [];
    T.activeMatchId = id;
    saveTournament();
    lsSet(K_VIEW, "t");
    renderScoreScreen();
    showScreen("scoreScreen");
    requestWakeLock();
  }

  function leaveMatch(){
    saveTournament();
    currentMatchId = null;
    if(T) T.activeMatchId = null;
    saveTournament();
    gameState = { sound: soundPref };
    renderBracket(false);
    showScreen("bracketScreen");
  }

  /* ---- bracket rendering ---- */
  function renderBracket(reveal){
    $("bTitle").textContent = T.name;
    lsSet(K_VIEW, "t");

    var total = 0, done = 0;
    T.rounds.forEach(function(list){ list.forEach(function(m){
      if(!m.bye){ total++; if(m.winner !== null) done++; }
    }); });
    $("bSub").textContent = toEastern(T.teams.length) + " تیم · " + toEastern(done) + "/" + toEastern(total) + " یاری تەواو بوو";

    // champion
    var ch = $("bChampion");
    if(T.finished && T.champion !== null){
      ch.style.display = "block";
      ch.innerHTML = '<div class="champion-card">' + ICONS.trophy +
        '<div class="champion-label">پاڵەوانی پاڵەوانێتی</div>' +
        '<div class="champion-name">' + escapeHtml(T.teams[T.champion]) + '</div>' +
        '<button type="button" id="newTournBtn">پاڵەوانێتی نوێ</button></div>';
      $("newTournBtn").addEventListener("click", function(){ openSetupTab("tourn"); showScreen("setupScreen"); lsSet(K_VIEW, "q"); });
    } else {
      ch.style.display = "none";
      ch.innerHTML = "";
    }

    // which round is current
    var currentRound = -1;
    for(var r=0;r<T.rounds.length;r++){
      if(T.rounds[r].some(function(m){ return !m.bye && m.winner === null; })){ currentRound = r; break; }
    }

    var wrap = $("bRounds");
    wrap.innerHTML = "";
    var delay = 0;
    T.rounds.forEach(function(list, r){
      var title = document.createElement("div");
      title.className = "round-title";
      title.textContent = roundTitle(r);
      if(r === currentRound){
        var badge = document.createElement("span");
        badge.className = "round-badge";
        badge.textContent = "ئێستا";
        title.appendChild(badge);
      }
      wrap.appendChild(title);

      list.forEach(function(m){
        var card = buildMatchCard(m);
        if(reveal){
          card.classList.add("reveal");
          card.style.animationDelay = (delay * 0.12) + "s";
          delay++;
        }
        wrap.appendChild(card);
      });
    });
  }

  function teamRow(idx, m, side){
    var row = document.createElement("div");
    row.className = "mc-team";
    var name = document.createElement("span");
    name.className = "mc-name";
    var score = document.createElement("span");
    score.className = "mc-score";

    if(idx === null){
      row.classList.add("tbd");
      name.textContent = "چاوەڕێی براوە…";
    } else {
      name.textContent = T.teams[idx];
      if(m.game && gameHasScore(m.game)){
        var tt = gameTotals(m.game);
        score.textContent = toEastern(side === "a" ? tt.t1 : tt.t2);
      }
      if(m.winner !== null){
        row.classList.add(m.winner === idx ? "win" : "lose");
      }
    }
    row.appendChild(name);
    row.appendChild(score);
    return row;
  }

  function buildMatchCard(m){
    var card = document.createElement("div");
    card.className = "match-card";

    if(m.bye){
      card.classList.add("bye");
      var hb = document.createElement("div");
      hb.className = "mc-head";
      hb.innerHTML = '<span>بەبێ بەرامبەر</span><span class="mc-chip done">تێپەڕی</span>';
      card.appendChild(hb);
      var r1 = document.createElement("div");
      r1.className = "mc-team win";
      r1.innerHTML = '<span class="mc-name"></span>';
      r1.firstChild.textContent = T.teams[m.a];
      card.appendChild(r1);
      return card;
    }

    var live = m.game && gameHasScore(m.game) && m.winner === null;
    var chipClass = "mc-chip", chipText = "چاوەڕێ";
    if(m.winner !== null){ chipClass += " done"; chipText = "تەواو"; }
    else if(live){ chipClass += " live"; chipText = "یاری دەکرێت"; }
    else if(m.a !== null && m.b !== null){ chipText = "ئامادەیە"; }

    var head = document.createElement("div");
    head.className = "mc-head";
    head.innerHTML = '<span>یاری ' + toEastern(m.no) + '</span><span class="' + chipClass + '">' + chipText + '</span>';
    card.appendChild(head);

    card.appendChild(teamRow(m.a, m, "a"));
    card.appendChild(teamRow(m.b, m, "b"));

    if(m.a !== null && m.b !== null){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mc-btn";
      if(m.winner !== null){ btn.classList.add("secondary"); btn.textContent = "بینینی خاڵەکان"; }
      else if(live){ btn.textContent = "بەردەوامبە"; }
      else { btn.textContent = "دەستپێبکە"; }
      btn.addEventListener("click", function(){ soundClick(); startMatch(m.id); });
      card.appendChild(btn);
    }
    return card;
  }

  /* ---- draw (5 second countdown) ---- */
  var drawRoll = null, drawCountdown = null;

  function startDraw(){
    showScreen("drawScreen");
    var left = 5;
    var cEl = $("drawCount");
    function setCount(){
      cEl.textContent = toEastern(left);
      cEl.classList.remove("tick");
      void cEl.offsetWidth;
      cEl.classList.add("tick");
    }
    setCount();
    soundClick();

    function rollNames(){
      var names = T.teams;
      var i = Math.floor(Math.random()*names.length);
      var j = Math.floor(Math.random()*names.length);
      if(names.length > 1){ while(j === i) j = Math.floor(Math.random()*names.length); }
      $("drawA").textContent = names[i];
      $("drawB").textContent = names[j];
    }
    rollNames();
    drawRoll = setInterval(rollNames, 90);
    drawCountdown = setInterval(function(){
      left--;
      if(left <= 0){ finishDraw(); return; }
      setCount();
      soundClick();
    }, 1000);
  }

  function finishDraw(){
    clearInterval(drawRoll); clearInterval(drawCountdown);
    drawRoll = null; drawCountdown = null;
    if(!T) return;
    T.revealed = true;
    saveTournament();
    soundConfirm();
    renderBracket(true);
    showScreen("bracketScreen");
  }

  /* ---- generic confirm ---- */
  var confirmCb = null;
  function askConfirm(title, text, okLabel, cb){
    $("confirmTitle").textContent = title;
    $("confirmText").textContent = text;
    $("confirmOk").textContent = okLabel || "باشە";
    confirmCb = cb;
    $("confirmOverlay").classList.add("show");
  }

  /* ---- setup: tournament form ---- */
  var tRounds = 7;

  function openSetupTab(mode){
    document.querySelectorAll("#modeTabs .mode-tab").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-mode") === mode);
    });
    $("quickForm").style.display = mode === "quick" ? "" : "none";
    $("tournForm").style.display = mode === "tourn" ? "" : "none";
  }

  function getTeamCount(){
    var n = parseInt($("tCountInput").value, 10);
    if(!n || n < 2) n = 2;
    if(n > 32) n = 32;
    return n;
  }

  function buildNameInputs(){
    var n = getTeamCount();
    var wrap = $("tournNames");
    var old = [];
    wrap.querySelectorAll("input").forEach(function(inp){ old.push(inp.value); });
    wrap.innerHTML = "";
    for(var i=0;i<n;i++){
      var row = document.createElement("div");
      row.className = "tname-row";
      var num = document.createElement("span");
      num.className = "tnum";
      num.textContent = toEastern(i+1);
      var inp = document.createElement("input");
      inp.type = "text";
      inp.maxLength = 20;
      inp.autocomplete = "off";
      inp.setAttribute("autocorrect","off");
      inp.setAttribute("enterkeyhint", i === n-1 ? "go" : "next");
      inp.value = old[i] || "";
      (function(idx, el){
        el.addEventListener("keydown", function(e){
          if(e.key === "Enter"){
            e.preventDefault();
            var all = wrap.querySelectorAll("input");
            if(idx < all.length-1) all[idx+1].focus();
            else $("tournStartBtn").click();
          }
        });
      })(i, inp);
      row.appendChild(num);
      row.appendChild(inp);
      wrap.appendChild(row);
    }
  }

  function setTeamCount(n){
    if(n < 2) n = 2;
    if(n > 32) n = 32;
    $("tCountInput").value = n;
    buildNameInputs();
  }

  function refreshResumeBox(){
    var box = $("tournResume");
    if(!box) return;
    if(!T){ box.style.display = "none"; box.innerHTML = ""; return; }
    var done = 0, total = 0;
    T.rounds.forEach(function(list){ list.forEach(function(m){ if(!m.bye){ total++; if(m.winner !== null) done++; } }); });
    var sub = T.finished ? ("پاڵەوان: " + T.teams[T.champion]) : (toEastern(done) + "/" + toEastern(total) + " یاری تەواو بوو");
    box.style.display = "block";
    box.innerHTML = '<div class="resume-title"></div><div class="resume-sub"></div>' +
      '<div class="resume-actions"><button type="button" class="resume-go" id="resumeGo">بەردەوامبە</button>' +
      '<button type="button" class="resume-del" id="resumeDel">سڕینەوە</button></div>';
    box.querySelector(".resume-title").textContent = T.name;
    box.querySelector(".resume-sub").textContent = sub;
    $("resumeGo").addEventListener("click", function(){
      if(!T.revealed){ T.revealed = true; saveTournament(); }
      renderBracket(false);
      showScreen("bracketScreen");
    });
    $("resumeDel").addEventListener("click", function(){ confirmDeleteTournament(); });
  }

  function confirmDeleteTournament(){
    askConfirm("پاڵەوانێتی بسڕدرێتەوە؟", "هەموو یاری و ئەنجامەکانی پاڵەوانێتییەکە دەسڕدرێنەوە.", "بسڕەوە", function(){
      clearTournament();
      lsSet(K_VIEW, "q");
      gameState = { sound: soundPref };
      showScreen("setupScreen");
    });
  }

  function startTournamentFromForm(){
    var err = $("tournError");
    var inputs = $("tournNames").querySelectorAll("input");
    var names = [], seen = {}, bad = false, dup = false;
    inputs.forEach(function(inp){
      inp.classList.remove("dup");
      var v = inp.value.trim();
      if(!v){ bad = true; return; }
      var key = v.toLowerCase();
      if(seen[key]){ dup = true; inp.classList.add("dup"); }
      seen[key] = true;
      names.push(v);
    });
    if(bad){ err.textContent = "تکایە ناوی هەموو تیمەکان بنووسە"; err.classList.add("show"); return; }
    if(dup){ err.textContent = "ناوی تیمەکان نابێت وەک یەک بن"; err.classList.add("show"); return; }
    err.classList.remove("show");

    var per = tRounds;
    if(per === "custom"){
      per = parseInt($("tCustomInput").value, 10);
      if(!per || per < 1) per = 7;
      if(per > 30) per = 30;
    }
    var name = $("tournName").value.trim() || "پاڵەوانێتی";

    function go(){
      T = buildTournament(name, names, per);
      currentMatchId = null;
      gameState = { sound: soundPref };
      saveTournament();
      lsSet(K_VIEW, "t");
      startDraw();
    }
    if(T && !T.finished){
      askConfirm("پاڵەوانێتی نوێ؟", "پاڵەوانێتییەکی نەتەواو هەیە. ئەگەر نوێ دروست بکەیت، ئەوی پێشوو دەسڕدرێتەوە.", "نوێ دروست بکە", go);
    } else {
      go();
    }
  }

  function wireTournament(){
    document.querySelectorAll("#modeTabs .mode-tab").forEach(function(b){
      b.addEventListener("click", function(){ openSetupTab(b.getAttribute("data-mode")); });
    });
    $("tCountMinus").addEventListener("click", function(){ setTeamCount(getTeamCount()-1); });
    $("tCountPlus").addEventListener("click", function(){ setTeamCount(getTeamCount()+1); });
    $("tCountInput").addEventListener("change", function(){ setTeamCount(getTeamCount()); });
    buildNameInputs();

    document.querySelectorAll(".t-opt").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll(".t-opt").forEach(function(b){ b.classList.remove("selected"); });
        btn.classList.add("selected");
        var val = btn.getAttribute("data-rounds");
        if(val === "custom"){ $("tCustomWrap").classList.add("show"); tRounds = "custom"; }
        else { $("tCustomWrap").classList.remove("show"); tRounds = parseInt(val,10); }
      });
    });

    $("tournStartBtn").addEventListener("click", startTournamentFromForm);
    $("drawSkip").addEventListener("click", finishDraw);

    $("bHomeBtn").addEventListener("click", function(){
      lsSet(K_VIEW, "q");
      showScreen("setupScreen");
    });
    $("bDeleteBtn").addEventListener("click", confirmDeleteTournament);

    $("confirmCancel").addEventListener("click", function(){
      $("confirmOverlay").classList.remove("show"); confirmCb = null;
    });
    $("confirmOk").addEventListener("click", function(){
      $("confirmOverlay").classList.remove("show");
      var cb = confirmCb; confirmCb = null;
      if(cb) cb();
    });
  }

  /* ---------------- Init ---------------- */
  function initializeApp(){
    wireSetupScreen();
    wireScoreScreen();
    wireScoreModal();
    wireIcons();
    wireTournament();
    buildQuickButtons();
    preventPinchAndDoubleTapZoom();

    var savedSound = null;
    try{ savedSound = localStorage.getItem(K_SOUND); }catch(e){}

    soundPref = savedSound === null ? true : savedSound === "1";
    loadTournament();
    var view = null;
    try{ view = localStorage.getItem(K_VIEW); }catch(e){}

    var restored = loadCurrentGame();
    var am = (T && T.activeMatchId) ? getMatch(T.activeMatchId) : null;

    if(T && view === "t"){
      if(am && am.game){
        gameState = am.game;
        gameState.sound = soundPref;
        currentMatchId = am.id;
        renderScoreScreen();
        showScreen("scoreScreen");
        requestWakeLock();
      } else {
        gameState = { sound: soundPref };
        if(!T.revealed){ T.revealed = true; saveTournament(); }
        renderBracket(false);
        showScreen("bracketScreen");
      }
    } else if(restored && restored.team1Name && restored.team2Name && Array.isArray(restored.roundsData)){
      gameState = restored;
      if(gameState.historySaved === undefined) gameState.historySaved = false;
      if(!gameState.startedAt) gameState.startedAt = Date.now();
      if(savedSound !== null) gameState.sound = savedSound === "1";
      renderScoreScreen();
      showScreen("scoreScreen");
      requestWakeLock();
    } else {
      gameState = { sound: soundPref };
      loadLastSetup();
      showScreen("setupScreen");
    }

    setInterval(updateTimerDisplay, 1000);

    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible" && gameState && gameState.startedAt){
        requestWakeLock();
      }
    });
  }

  /* ---------------- Prevent pinch/double-tap zoom (feel native) ---------------- */
  function preventPinchAndDoubleTapZoom(){
    document.addEventListener("touchmove", function(e){
      if(e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive:false });

    var lastTouchEnd = 0;
    document.addEventListener("touchend", function(e){
      var now = Date.now();
      if(now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive:false });

    document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  }

  document.addEventListener("DOMContentLoaded", function(){ restoreFromMirror(initializeApp); });

  // Save the running game whenever the page is hidden / closed
  function flushGame(){ if(currentMatchId && T){ saveTournament(); } else if(gameState && gameState.roundsData){ saveCurrentGame(); } }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flushGame(); });
  window.addEventListener("pagehide", flushGame);
})();
</script>
</body>
