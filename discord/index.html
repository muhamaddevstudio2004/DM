<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>چوونەژوورەوە</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#2f6fed;--blue-d:#1f4fc7;--bg:#f4f6fb;--card:#ffffff;--text:#1a1f2b;--sub:#6b7280;--border:#e7eaf1;--danger:#e0472e;--shadow:0 8px 24px rgba(20,30,60,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans Arabic','Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);width:100%;max-width:380px;border-radius:24px;padding:32px 24px;box-shadow:var(--shadow)}
.login-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue),#7c4fe0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;margin-bottom:18px}
h1{font-size:19px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:var(--sub);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--sub)}
.field input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;background:#fafbfd}
.field input:focus{outline:none;border-color:var(--blue);background:#fff}
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{background:#fdeceb;color:var(--danger);font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="login-box">
<div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div>
<h1>چوونەژوورەوە بۆ سیستەم</h1>
<div class="sub">تکایە ئیمەیل و وشەی نهێنیت بنووسە</div>
<div class="err" id="errBox"></div>
<div class="field"><label>ئیمەیل</label><input type="email" id="email" placeholder="you@example.com"></div>
<div class="field"><label>وشەی نهێنی</label><input type="password" id="password" placeholder="••••••••"></div>
<button class="btn" id="loginBtn" onclick="doLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i>چوونەژوورەوە</button>
</div>
<script>
const SUPABASE_URL='https://fhqcgnocjnpiovsrhcfa.supabase.co';
const SUPABASE_KEY='sb_publishable_mA781IfMBeZdl7n_xj3iZg_55DcwZ6-';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function checkExisting(){
const {data:{session}}=await sb.auth.getSession();
if(session)location.href='staff-app.html';
}
checkExisting();

async function doLogin(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const errBox=document.getElementById('errBox');
const btn=document.getElementById('loginBtn');
errBox.style.display='none';
if(!email||!password){errBox.textContent='تکایە هەردوو خانە پڕبکەرەوە';errBox.style.display='block';return}
btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>چاوەڕوان بە...';
const {data,error}=await sb.auth.signInWithPassword({email,password});
btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i>چوونەژوورەوە';
if(error){errBox.textContent='ئیمەیل یان وشەی نهێنی هەڵەیە';errBox.style.display='block';return}
location.href='staff-app.html';
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
