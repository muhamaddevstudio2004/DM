<!DOCTYPE html>
<html lang="en" dir="ltr" data-ui="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#842D42"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Academic CV Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Vazirmatn:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F7F3F4;--fg:#333333;--card:#fff;--bd:#E7DADD;--ac:#842D42;--yl:#D9B56D;--gd:#B8924A;--sc:#A94D63;--mut:#666666;--dk:#9b1c1c;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation;overscroll-behavior:none}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
html[data-ui="ckb"] body{font-family:"Noto Sans Arabic","Noto Naskh Arabic",Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif}
html[data-ui="ckb"] :is(button,input,textarea){font-family:inherit}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:42px;display:inline-flex;gap:6px;align-items:center;justify-content:center;color:var(--ac);font-weight:600}
button:active{transform:scale(.98);background:#F1E8EA}
button.pri{background:var(--yl);border-color:var(--gd);color:#333333;font-weight:700}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yl);outline-offset:1px}
input,textarea{font-size:16px!important;width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;background:#fff;color:#333333;line-height:1.5}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#A39A9D}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[dir="rtl"] .chev{transform:scaleX(-1)}

#top{position:sticky;top:0;z-index:20;background:var(--ac);border-bottom:3px solid var(--yl);display:flex;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));align-items:center}
#top .lg{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:#fff;font-weight:800;font-size:17px}
#top .lg span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgm{flex:none;width:40px;height:40px;border-radius:11px;background:var(--yl);color:#842D42;display:grid;place-items:center}.lgm svg{width:27px;height:27px;fill:currentColor}
#top button{min-height:42px}#top .sec{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff}

#app{display:block}
#ed{padding:14px 14px 110px;max-width:640px;margin:0 auto}
#pv{padding:14px 12px 110px;background:#EFE6E9;min-height:calc(100vh - 62px);overflow-x:auto}
body[data-view="ed"] #pv{display:none}body[data-view="pv"] #ed{display:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;width:max-content;min-width:100%}
.sc{position:relative;flex:none;box-shadow:0 4px 18px rgba(60,20,30,.22);background:#fff;overflow:hidden}
.sc .page{position:absolute;left:0;top:0;transform-origin:0 0}
.fit{border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.5;margin:0 0 12px;font-weight:600;border:1.5px solid}.fit.ok{background:#eaf6ee;border-color:#9fd0ae;color:#1d5a32}.fit.small{background:#fbf6e8;border-color:#e8d9a8;color:#5a4a1a}.fit.over{background:#fdeeee;border-color:#e3a3a3;color:#8b1c1c}

#zm{display:flex;gap:8px;justify-content:center;margin:0 0 12px;position:sticky;left:0}#zm button{min-height:38px;padding:4px 14px;font-size:14px}
#mz{position:absolute;left:0;top:0;width:794px;visibility:hidden;pointer-events:none;z-index:-1}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--yl);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;box-shadow:0 -4px 14px rgba(60,20,30,.08)}
#nav button{flex:1;min-height:48px;border-radius:12px;font-size:16px;font-weight:700}
@media(min-width:900px){
 #nav{display:none}
 #app{display:grid;grid-template-columns:minmax(380px,470px) 1fr;height:calc(100vh - 62px)}
 body[data-view] #ed,body[data-view] #pv{display:block!important}
 #ed{max-width:none;margin:0;overflow-y:auto;padding:18px 18px 40px;border-inline-end:1px solid var(--bd);height:100%}
 #pv{height:100%;overflow:auto;min-height:0;padding-bottom:40px}
}

.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--ac)}
.lab{display:block;font-size:13px;font-weight:600;color:var(--ac);margin:10px 0 4px}.lab:first-child{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:72px;font-size:14px}
.langsw{direction:ltr}
.hero{margin:2px 0 14px}.hero h1{margin:0;font-size:24px;line-height:1.25;color:var(--ac)}.hero i{display:block;width:60px;height:4px;border-radius:2px;background:var(--yl);margin-top:10px}
.note{font-size:13px;color:var(--mut);margin:8px 0 0;line-height:1.55}
.banner{background:#fbf6e8;border:1.5px solid #e8d9a8;border-radius:14px;padding:12px 14px;margin:0 0 12px;color:#5a4a1a;font-size:14px;line-height:1.6}
.banner .seg{margin-top:10px}.banner button{min-height:40px;font-size:14px}
button.arm{background:#fff3f3!important;border-color:#d98a8a!important;color:var(--dk)!important}

.ch{display:flex;align-items:center;gap:6px}
.chm{flex:1;justify-content:flex-start;text-align:start;border:0;background:transparent;padding:6px 2px;min-height:44px;font-size:16px;color:var(--ac);font-weight:700;min-width:0}
.chm span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chm .chev{margin-inline-start:auto;transition:transform .15s;color:var(--sc)}.open>.ch .chm .chev{transform:rotate(90deg)}
.chb{display:flex;gap:4px}.chb button,.ib button{min-height:38px;min-width:38px;padding:4px;border-radius:9px}
.hid .chm{opacity:.5}.tag{font-size:11px;background:#F1E8EA;border-radius:6px;padding:1px 6px;color:var(--mut);font-weight:600}
.cb{padding-top:6px}
.it{border:1.5px solid var(--bd);border-radius:12px;margin:8px 0;background:#FBF8F9}
.ih{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 8px}html[dir="rtl"] .ih{padding:2px 8px 2px 4px}
.ih>button:first-child{flex:1;border:0;background:transparent;justify-content:flex-start;text-align:start;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;line-height:42px;padding:0 4px}
.ib{display:flex;gap:3px}
.ib button{min-width:36px;min-height:36px}
.it .fb{padding:2px 10px 12px}
.add{width:100%;margin-top:6px;border-style:dashed}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu button{font-size:14px;min-height:46px}
.ph{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.pth{width:86px;height:86px;flex:none;background:#F7F3F4;border:2px dashed #D9C3C9;display:grid;place-items:center;color:#A39A9D;overflow:hidden}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth.circle{border-radius:50%}.pth.round{border-radius:16px}.pth.portrait{width:70px;height:92px;border-radius:6px}
.pbt{display:flex;flex-direction:column;gap:6px;flex:1}.pbt button{min-height:40px;font-size:14px}
input[type=range]{padding:0;height:34px;border:0;background:transparent;accent-color:var(--ac)}
.lk{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin:6px 0;align-items:center}
.clr{display:flex;gap:10px;flex-wrap:wrap}.clr button{width:44px;height:44px;min-width:44px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--bd)}.clr button.on{box-shadow:0 0 0 3px var(--yl)}
.ftr{text-align:center;color:var(--mut);font-size:13px;margin:18px 0 0}.ftr a{color:var(--ac);font-weight:600}
#ov{position:fixed;inset:0;z-index:9999;background:rgba(40,12,20,.6);display:none;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}#ov.on{display:flex}

/* ================= A4 page (single page, ATS-friendly, single column) ================= */
.page{--ac:#842D42;--sc:#A94D63;--ln:#D9C3C9;width:794px;height:1123px;background:#fff;color:#333333;padding:46px 54px 0;position:relative;overflow:hidden;line-height:1.42;font-size:14px;direction:ltr;text-align:start}
.page.f-sans{font-family:Inter,Calibri,"Segoe UI",Arial,Helvetica,sans-serif}
.page.f-serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.page.rtl{direction:rtl;line-height:1.6}
.page.rtl.f-serif{font-family:"Noto Naskh Arabic","Noto Sans Arabic",Vazirmatn,"Times New Roman",serif}
.page.rtl.f-sans{font-family:"Noto Sans Arabic","Noto Naskh Arabic",Vazirmatn,Tahoma,Arial,sans-serif}
.pc{height:1037px;overflow:hidden}
.hd{display:flex;align-items:center;gap:22px}.hd-t{flex:1;min-width:0}
.nm{font-size:2.15em;font-weight:700;color:var(--ac);line-height:1.12;letter-spacing:.01em}
.tt{font-size:1.07em;margin-top:.3em;color:var(--sc);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.page.rtl .tt{text-transform:none;letter-spacing:0}
.ct{margin-top:.6em;font-size:.92em;color:#333333;line-height:1.6;display:flex;flex-wrap:wrap;align-items:center}.ct.lk2{margin-top:.1em}
.ct span{display:inline-block;unicode-bidi:isolate}.ct .sp{width:1px;align-self:stretch;margin:.35em .7em;background:var(--ln)}
.ct a{color:inherit;text-decoration:none}
.pho{flex:none;width:104px;height:104px;overflow:hidden;background:#eee}.pho img{width:100%;height:100%;object-fit:cover;display:block}
.pho.circle{border-radius:50%}.pho.round{border-radius:12px}.pho.portrait{width:96px;height:128px;border-radius:6px}
.pho.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed #C9B4BA;background:#F7F3F4;color:#A3868F;font:700 10px/1 Inter,Arial,sans-serif;letter-spacing:.1em}.pho.empty .ic{width:30px;height:30px}
.hr{height:3px;background:var(--ac);margin:.95em 0 0}
.sx{margin-top:1.05em}.sx:first-child{margin-top:0}
.sx h2{margin:0 0 .45em;font-size:.93em;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.11em;border-bottom:1px solid var(--ln);padding-bottom:.22em}
.page.rtl .sx h2{letter-spacing:0;text-transform:none;font-size:1.05em}
.it2{margin-top:.5em}.sx h2+.it2,.sx h2+.sk,.sx h2+.tx{margin-top:0}
.r1{display:flex;justify-content:space-between;gap:14px;align-items:baseline}.r1 b{font-weight:700;color:#333333}
.dt{unicode-bidi:isolate;flex:none;font-size:.93em;color:#666666;white-space:nowrap}
.r2{color:#666666;font-style:italic}.page.rtl .r2{font-style:normal}
.sx ul{list-style:none;margin:.18em 0 0;padding:0}
.sx li{position:relative;padding-left:15px;margin-top:.1em}.sx li::before{content:"•";position:absolute;left:3px;color:var(--ac)}
.page.rtl .sx li{padding-left:0;padding-right:15px}.page.rtl .sx li::before{left:auto;right:3px}
.tx{margin:0;white-space:pre-line}
.pb{margin:.3em 0 0;padding-left:28px;text-indent:-28px}.pb em{font-style:normal;color:var(--ac);display:inline-block;width:28px;text-indent:0;font-weight:600}
.page.rtl .pb{padding-left:0;padding-right:28px;text-indent:0}.page.rtl .pb em{margin-right:-28px}
.sk{margin:.18em 0 0}.sk b{font-weight:700;color:#333333}.sk .lg{white-space:nowrap}
.cm .r1>span:first-child b{margin-inline-end:.2em}.cm .org{font-style:normal;color:#666666}

@page{size:A4;margin:0}
@media print{
 html,body{background:#fff!important;height:auto!important}
 #top,#nav,#ed,#zm,.ftr,#ov,.fit,#mz{display:none!important}
 #app{display:block!important;height:auto!important}
 #pv{display:block!important;padding:0!important;background:#fff!important;overflow:visible!important;height:auto!important;min-height:0!important}
 #pages{display:block!important;width:auto!important}
 .sc{width:794px!important;height:1123px!important;box-shadow:none!important;break-after:page;page-break-after:always;overflow:hidden}
 .sc:last-child{break-after:auto;page-break-after:auto}
 .sc .page{transform:none!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

 document.documentElement.lang=S.ui==="ckb"?"ckb":"en";document.documentElement.dir=S.ui==="ckb"?"rtl":"ltr";document.documentElement.dataset.ui=S.ui;
 document.title=t("app");
 $("top").innerHTML=`<div class="lg"><span class="lgm">${CAP}</span><span class="t">${t("appS")}</span></div><button type="button" class="pri" id="bpdf">${ic("dl")}<span>${t("pdf")}</span></button><button type="button" class="sec" id="bprint">${ic("print")}<span class="bpt">${t("print")}</span></button>`;
 $("bpdf").onclick=exportPdf;$("bprint").onclick=()=>window.print();
 $("nav").innerHTML=`<button type="button" data-v="ed" class="${VIEW==="ed"?"on":""}">${ic("edit")}${t("edit")}</button><button type="button" data-v="pv" class="${VIEW==="pv"?"on":""}">${ic("eye")}${t("live")}</button>`;
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;document.body.dataset.view=VIEW;chrome();if(VIEW==="pv")requestAnimationFrame(applyScale);window.scrollTo(0,0)});
}

/* ---------------- CV rendering ---------------- */
const nonEmpty=it=>Object.values(it).some(v=>String(v||"").trim());
const isBlank=d=>["name","title","email","phone","loc"].every(k=>!String(d[k]||"").trim())&&d.links.every(l=>!String((l.t||"")+(l.u||"")).trim())&&d.sections.every(x=>!x.items.some(nonEmpty));
/* a completely empty CV (e.g. cleared earlier on this device) gets the guide text again automatically */
function ensureGuide(l){const d=S.data[l];if(d&&isBlank(d)){S.data[l]=mk(l);S.banner=1;save();return true}return false}
const lines=s=>String(s||"").split(/\r?\n/).map(x=>x.replace(/^\s*[-•*–]\s+/,"").trim()).filter(Boolean);
const href=u=>/^(https?:|mailto:|tel:)/i.test(u)?u:"https://"+u;
function headerHTML(d,exp){
 const c1=[d.email&&`<span><a href="mailto:${esc(d.email)}">${esc(d.email)}</a></span>`,d.phone&&`<span dir="ltr">${esc(d.phone)}</span>`,d.loc&&`<span>${esc(d.loc)}</span>`].filter(Boolean).join('<i class="sp"></i>');
 const ls=d.links.filter(l=>(l.u||"").trim()).map(l=>`<span dir="ltr">${l.t?esc(l.t)+": ":""}<a href="${esc(href(l.u.trim()))}" dir="ltr">${esc(l.u.trim().replace(/^https?:\/\//i,""))}</a></span>`).join('<i class="sp"></i>');
 const ph=!S.photoOn?"":S.photo?`<div class="pho ${S.shape}"><img src="${S.photo}" alt=""></div>`:(exp?"":`<div class="pho ${S.shape} empty">${ic("user")}<span>PHOTO</span></div>`);
 return`<div class="hd"><div class="hd-t">${d.name?`<div class="nm">${esc(d.name)}</div>`:""}${d.title?`<div class="tt">${esc(d.title)}</div>`:""}${c1?`<div class="ct">${c1}</div>`:""}${ls?`<div class="ct lk2">${ls}</div>`:""}</div>${ph}</div><div class="hr"></div>`}
function itemHTML(type,it,i){
 const a=esc(it.a||"");
 if(type==="summary")return`<p class="tx">${a}</p>`;
 if(type==="publications")return`<p class="pb"><em>[${i+1}]</em>${a}</p>`;
 if(type==="skills")return`<p class="sk">${it.a?`<b>${a}:</b> `:""}${esc(it.b||"")}</p>`;
 if(type==="refs")return`<div class="it2"><div class="r1"><b>${a}</b></div>${it.b?`<div class="r2">${esc(it.b)}</div>`:""}${it.c?`<div>${esc(it.c)}</div>`:""}</div>`;
 if(type==="awards")return`<div class="it2 cm"><div class="r1"><span><b>${a}</b>${it.b?` <span class="org">— ${esc(it.b)}</span>`:""}</span>${it.d?`<span class="dt" dir="auto">${esc(it.d)}</span>`:""}</div></div>`;
 const sub=[it.b,it.c].map(x=>(x||"").trim()).filter(Boolean).map(esc).join(" · "),ls=lines(it.e);
 return`<div class="it2"><div class="r1"><b>${a}</b>${it.d?`<span class="dt" dir="auto">${esc(it.d)}</span>`:""}</div>${sub?`<div class="r2">${sub}</div>`:""}${ls.length?`<ul>${ls.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`}
function unitsOf(d,exp){
 const U=[headerHTML(d,exp)];
 d.sections.forEach(s=>{if(s.show===false)return;const items=s.items.filter(nonEmpty);if(!items.length)return;
  const h=s.title?`<h2>${esc(s.title)}</h2>`:"";
  const body=s.type==="languages"?`<p class="sk">${items.map(it=>`<span class="lg"><b>${esc(it.a||"")}</b>${it.b?" ("+esc(it.b)+")":""}</span>`).join(" · ")}</p>`:items.map((it,i)=>itemHTML(s.type,it,i)).join("");
  U.push(`<section class="sx">${h}${body}</section>`)});
 return U}
const SIZES=[14,13.5,13,12.5,12,11.5,11];
function renderCV(root,exp){
 const d=D();root.innerHTML="";
 const p=document.createElement("div");p.className=`page f-${S.font} ${S.cl==="ckb"?"rtl":""}`;{const C=colorOf();p.style.setProperty("--ac",C.ac);p.style.setProperty("--sc",C.sc);p.style.setProperty("--ln",C.ln)}
 p.innerHTML='<div class="pc"></div>';root.appendChild(p);const pc=p.firstChild;
 pc.innerHTML=unitsOf(d,exp).join("");
 let fs=SIZES[0],fits=false;
 for(const z of SIZES){fs=z;p.style.fontSize=z+"px";if(pc.scrollHeight<=pc.clientHeight+1){fits=true;break}}
 return{p,fs,fits}}
function setFit(r){FIT=r;const k=r.fits?(r.fs<12?"small":"ok"):"over",m=r.fits?(r.fs<12?t("fitSmall"):t("fitOk")):t("fitOver");
 ["fit"].forEach(id=>{const e=$(id);if(e){e.className="fit "+k;e.textContent=m;e.style.display=k==="ok"?"none":""}})}
function scaleK(){const w=$("pv").clientWidth-24;return Math.max(.3,Math.min(1,w/794))}
function applyScale(){const k=scaleK();document.querySelectorAll("#pages .sc").forEach(w=>{w.style.width=794*k+"px";w.style.height=1123*k+"px";w.firstChild.style.transform=`scale(${k})`})}
function buildPreview(){
 const r=renderCV($("mz")),host=$("pages");host.innerHTML="";
 const w=document.createElement("div");w.className="sc";w.appendChild(r.p);host.appendChild(w);
 applyScale();setFit(r)}
let pvT=0;const schedule=()=>{clearTimeout(pvT);pvT=setTimeout(buildPreview,120)};
function refresh(){chrome();renderEd();buildPreview()}

/* ---------------- photo ---------------- */
function cropPhoto(){return new Promise(res=>{if(!S.psrc){S.photo="";return res()}const im=new Image();im.onload=()=>{const ar=S.shape==="portrait"?.75:1,H=480,W=Math.round(H*ar),c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
 let bh=Math.min(im.height,im.width/ar)/S.pz,bw=bh*ar;const sx=(im.width-bw)*S.px/100,sy=(im.height-bh)*S.py/100;g.fillStyle="#fff";g.fillRect(0,0,W,H);g.drawImage(im,sx,sy,bw,bh,0,0,W,H);S.photo=c.toDataURL("image/jpeg",.9);res()};im.onerror=()=>res();im.src=S.psrc})}
$("pf").onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1000,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.psrc=c.toDataURL("image/jpeg",.88);S.pz=1;S.px=50;S.py=30;S.photoOn=true;cropPhoto().then(()=>{save();OP="per";refresh()})};im.src=r.result};r.readAsDataURL(f)};
let phT=0;

/* ---------------- events ---------------- */
function arm(b,label){if(b.dataset.arm)return true;b.dataset.arm=1;const old=b.innerHTML;b.classList.add("arm");b.textContent=label;setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.classList.remove("arm");b.innerHTML=old}},3500);return false}
const secOf=id=>D().sections.find(s=>s.id===id);
function blankItem(){return{a:"",b:"",c:"",d:"",e:""}}
$("ed").addEventListener("input",e=>{
 const el=e.target;
 if(el.dataset.ph){S[el.dataset.ph]=+el.value;clearTimeout(phT);phT=setTimeout(()=>cropPhoto().then(()=>{save();schedule();const th=document.querySelector(".pth");if(th&&S.photo)th.innerHTML=`<img src="${S.photo}" alt="">`}),60);return}
 const p=el.dataset.p;if(!p)return;const a=p.split("|"),d=D();
 if(a[0]==="p")d[a[1]]=el.value;
 else if(a[0]==="l")d.links[+a[1]][a[2]]=el.value;
 else if(a[0]==="st"){secOf(a[1]).title=el.value;const n=document.querySelector(".open>.ch .chm .n");if(n)n.textContent=el.value||"…"}
 else if(a[0]==="s"){const s=secOf(a[1]);s.items[+a[2]][a[3]]=el.value;
  if(a[3]==="a"||a[3]==="b"){const btn=el.closest(".it").querySelector(".ih>button:first-child");btn.textContent=itemSummary(s,s.items[+a[2]])}}
 save();schedule();const eb=$("eb");if(eb&&!isBlank(D()))eb.remove()});
$("ed").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,d=D();
 if(a==="set"){const k=b.dataset.k;
  if(k==="photoOn"){S.photoOn=v==="1";save();renderEd();buildPreview();return}
  if(k==="shape"){S.shape=v;save();cropPhoto().then(()=>{save();renderEd();buildPreview()});return}
  S[k]=v;save();
  if(k==="ui"){chrome();renderEd();return}
  if(k==="cl"){ensureGuide(S.cl);OP="";OI="";refresh();return}
  renderEd();buildPreview();return}
 if(a==="acc"){OP=OP===v?"":v;OI="";renderEd();return}
 if(a==="item"){OI=OI===v?"":v;renderEd();return}
 if(a==="sshow"){const s=secOf(v);s.show=!s.show;save();renderEd();buildPreview();return}
 if(a==="smv"){const i=d.sections.findIndex(s=>s.id===v),j=i+(+b.dataset.d);if(j<0||j>=d.sections.length)return;[d.sections[i],d.sections[j]]=[d.sections[j],d.sections[i]];save();renderEd();buildPreview();return}
 if(a==="imv"){const[id,ix]=v.split(":"),s=secOf(id),i=+ix,j=i+(+b.dataset.d);if(j<0||j>=s.items.length)return;[s.items[i],s.items[j]]=[s.items[j],s.items[i]];OI=id+":"+j;save();renderEd();buildPreview();return}
 if(a==="idel"){if(!arm(b,t("delConfirm")))return;const[id,ix]=v.split(":"),s=secOf(id);s.items.splice(+ix,1);if(!s.items.length)s.items.push(blankItem());OI="";save();renderEd();buildPreview();return}
 if(a==="addi"){const s=secOf(v);s.items.push(blankItem());OI=v+":"+(s.items.length-1);save();renderEd();buildPreview();return}
 if(a==="sdel"){if(!arm(b,t("delConfirm")))return;d.sections=d.sections.filter(s=>s.id!==v);OP="";save();renderEd();buildPreview();return}
 if(a==="addsec"){const id="x"+Date.now().toString(36),type=(ADD.find(x=>x[0]===v)||[0,"custom"])[1];d.sections.push({id,type,title:TT[S.cl][v]||TT.en[v],show:true,items:[blankItem()]});OP=id;OI=id+":0";save();renderEd();buildPreview();return}
 if(a==="ladd"){d.links.push({t:"",u:""});save();renderEd();return}
 if(a==="ldel"){d.links.splice(+v,1);save();renderEd();buildPreview();return}
 if(a==="pup"){$("pf").click();return}
 if(a==="prm"){S.psrc="";S.photo="";save();renderEd();buildPreview();return}
 if(a==="loadsample"){S.data[S.cl]=mk(S.cl);S.banner=1;OP="per";OI="";save();renderEd();buildPreview();return}
 if(a==="bok"){S.banner=0;save();renderEd();return}
 if(a==="clear"){if(!arm(b,t("confirmClear")))return;
  ["en","ckb"].forEach(l=>{const x=S.data[l];x.name=x.title=x.email=x.phone=x.loc="";x.links=[{t:"",u:""},{t:"",u:""}];x.sections.forEach(s=>{s.items=[blankItem()]})});
  S.photo="";S.psrc="";S.banner=0;OP="per";OI="";save();renderEd();buildPreview();return}
 if(a==="reset"){if(!arm(b,t("resetConfirm")))return;const ui=S.ui,cl=S.cl;S=fresh();S.ui=ui;S.cl=cl;OP="";OI="";save();refresh();return}
});

/* ---------------- export ---------------- */
const fontsReady=()=>Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,2500))]);
/* invisible text layer so ATS / text extraction can read the PDF (Latin text only) */
function addTextLayer(pdf,page){
 const pr=page.getBoundingClientRect(),k=210/pr.width;
 const tw=document.createTreeWalker(page,NodeFilter.SHOW_TEXT),rg=document.createRange();let n;
 pdf.setFont("helvetica","normal");
 while((n=tw.nextNode())){const s=n.nodeValue;if(!s.trim())continue;
  const fs=parseFloat(getComputedStyle(n.parentElement).fontSize)||14;
  let seg="",x0=0,top0=null,bot=0;
  const flush=()=>{if(seg.trim()){try{pdf.setFontSize(fs*.75);pdf.text(seg,(x0-pr.left)*k,(bot-pr.top-fs*.22)*k,{renderingMode:"invisible"})}catch(e){}}seg=""};
  for(let i=0;i<s.length;i++){rg.setStart(n,i);rg.setEnd(n,i+1);const r=rg.getClientRects()[0];if(!r)continue;
   if(top0===null||Math.abs(r.top-top0)>fs*.5){flush();x0=r.left;top0=r.top}
   seg+=s[i];bot=r.bottom}
  flush()}
 page.querySelectorAll("a[href]").forEach(a=>{try{const r=a.getBoundingClientRect();if(r.width)pdf.link((r.left-pr.left)*k,(r.top-pr.top)*k,r.width*k,r.height*k,{url:a.href})}catch(e){}})}
async function exportPdf(){
 if(!window.html2canvas||!(window.jspdf&&window.jspdf.jsPDF)){alert(t("libFail"));return}
 if(!FIT.fits){alert(t("fitOver"));return}
 const b=$("bpdf");b.disabled=true;const ov=$("ov");ov.textContent=t("pdfWait");ov.classList.add("on");
 const w=document.createElement("div");w.style.cssText="position:absolute;left:0;top:0;width:794px;background:#fff;z-index:-1";document.body.appendChild(w);
 try{await fontsReady();const r=renderCV(w,true);await new Promise(x=>requestAnimationFrame(()=>x()));
  const pdf=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  const nm0=(D().name||"").trim();try{pdf.setProperties({title:(nm0||"CV")+" – CV",author:nm0,subject:"Curriculum Vitae"})}catch(e){}
  const c=await html2canvas(r.p,{scale:innerWidth<900?2:2.5,backgroundColor:"#fff",useCORS:true,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123});
  pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,210,297,undefined,"FAST");c.width=c.height=0;
  if(S.cl==="en")addTextLayer(pdf,r.p);
  const blob=pdf.output("blob"),nm=(nm0.replace(/[^\p{L}\p{N}\- ]+/gu,"").trim().replace(/\s+/g,"_").slice(0,40)||"My")+"_CV.pdf";
  let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(x){}
  if(dl)await dl.save({filename:nm,data:blob});
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
 }catch(x){if(!(x&&x.code==="declined"))alert(t("pdfFail"))}
 finally{w.remove();ov.classList.remove("on");b.disabled=false}}

addEventListener("resize",()=>{clearTimeout(pvT);pvT=setTimeout(applyScale,80)});
["en","ckb"].forEach(l=>ensureGuide(l));
chrome();renderEd();buildPreview();
if(document.fonts&&document.fonts.load){const smp="ڕێڵۆە کوردی";Promise.all(["400","600","700"].map(w=>document.fonts.load(w+' 14px "Noto Sans Arabic"',smp).catch(()=>0)).concat(document.fonts.load('400 14px "Noto Naskh Arabic"',smp).catch(()=>0))).then(()=>{buildPreview();if(document.fonts.ready)document.fonts.ready.then(buildPreview)})}
else if(document.fonts&&document.fonts.ready)document.fonts.ready.then(buildPreview);
</script>
