@media(min-width:900px){#app #ed,#app #pv{display:block!important}#ed{max-width:46%}#nav{display:none}#app{padding-bottom:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin-top:6px}

/* ---- academic document (always white paper) ---- */
.page{width:794px;height:1123px;box-sizing:border-box;background:#fff;color:#000;position:relative;margin:0 auto 14px;font:12pt/1.5 var(--ff),"Times New Roman",Times,"Liberation Serif",serif;box-shadow:0 1px 6px rgba(0,0,0,.3);overflow:hidden}

.bd{position:absolute;top:60px;left:76px;right:76px;bottom:84px;overflow:hidden;line-height:var(--ls,1.5)}
.hd{position:absolute;top:36px;left:76px;right:76px;font-size:10pt;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #888;line-height:1.3}

.bd p{text-align:var(--ta,justify);margin:0 0 8px;overflow-wrap:anywhere}.bd ul,.bd ol{margin:0 0 8px;padding-left:28px;text-align:var(--ta,justify)}

.citation{color:#4B3869;text-decoration:underline;font-weight:600}.autolink{color:#4B3869;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}.ref-entry{padding-left:48px;text-indent:-48px;overflow-wrap:anywhere;margin-bottom:10px}.page.rtl .ref-entry{padding-left:0;padding-right:48px;text-indent:-48px}.bd table{break-inside:auto}.bd tr{break-inside:avoid;page-break-inside:avoid}.bd thead{display:table-header-group}.bd figure{break-inside:avoid;page-break-inside:avoid}.bd h1,.bd h2,.bd h3{break-after:avoid;page-break-after:avoid}.bd img{height:auto;object-fit:contain;max-width:100%}.x .page{margin:0;box-shadow:none;page-break-after:always}.x .page:last-child{page-break-after:auto}
.bd>h1{border-bottom:2px solid var(--gd);padding-bottom:4px}.bd>h1.sh{margin-top:14px;text-transform:uppercase}.bd>h1.sh:first-child{margin-top:0}.cv h1::after{content:"";display:block;width:90px;height:3px;background:var(--gd);margin:12px auto 0}.no-report-line .bd>h1{border-bottom:0;padding-bottom:0}.no-report-line .cv h1::after{display:none}

/* Final responsive overrides for the updated UI */

.template-card{padding:16px;border-radius:14px;box-shadow:0 3px 12px rgba(20,58,123,.06)}
.template-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.template-head h3{margin:3px 0 4px;color:var(--ac);font-size:18px;line-height:1.25}
.template-head p{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.template-head label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--mut)}
.template-mark{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:#F1ECF6;color:var(--ac);font-size:20px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.tt{position:relative;display:flex;flex-direction:row;align-items:center;text-align:left;gap:10px;min-height:82px;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);transition:border-color .15s,background .15s,box-shadow .15s}

.tt .tt-check{margin-left:auto;align-self:flex-start;color:var(--gd);font-size:16px}
.tt.on{background:#f8f6ef;border:2px solid var(--yl);box-shadow:0 0 0 2px rgba(216,187,116,.16)}
.tt.on .tt-icon{background:#eee5ce;color:#725719}

.template-hint{margin:8px 0 12px;padding:10px 12px;border-radius:9px;background:#F6F3F9;line-height:1.5}
.template-divider{height:1px;background:var(--bd);margin:14px 0}

.chapter-break-label span{display:flex;flex-direction:column;gap:3px}

/* Academic editor refinement: mobile-first, calm academic hierarchy */
.content-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px}

.pr{align-items:stretch;gap:6px}

.pc{min-width:0}

.pc>.row:first-child input{min-width:0;min-height:44px}
.pc label{font-size:13px;font-weight:600;letter-spacing:.01em;margin:12px 0 6px}
.pc button{min-height:42px}

.pc textarea{min-height:112px}

.pc .bh{gap:8px;flex-wrap:wrap}
.pc .bh button{min-width:40px}
.pc .addbar{gap:7px;padding:8px;box-shadow:0 -3px 14px rgba(46,33,68,.07)}

}

/* Responsive, consistent block controls and link settings */
.pc .bh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pc .bh-title{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:15px;line-height:1.35}
.pc .bh-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.pc .bh-actions button{min-width:42px;min-height:42px;padding:7px 10px;border-radius:9px;gap:6px;font-size:12px;font-weight:600}
.pc .bh-actions .move-btn{color:var(--ac);background:var(--card);border-color:var(--bd)}
.pc .bh-actions .delete-btn{color:#a11b32;border-color:#c9828d;background:#fff}
.pc .bh-actions button .ic{width:17px;height:17px}
.pc .bh-actions button span{white-space:nowrap}
.pc .linkify-setting{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;margin:10px 0 12px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.pc .linkify-btn{display:flex;align-items:center;justify-content:flex-start;gap:9px;width:100%;min-height:44px;padding:9px 11px;border-radius:8px;text-align:left;white-space:normal;font-size:14px;font-weight:650;line-height:1.35}
.pc .linkify-btn.is-enabled{border-color:#a9c4b2;background:#f3f8f4;color:#245c3b}
.pc .linkify-state{width:18px;height:18px;flex:none;border:1.5px solid currentColor;border-radius:50%;position:relative}
.pc .linkify-btn.is-enabled .linkify-state:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pc .linkify-setting .hint{display:block;margin:0;font-size:12px;line-height:1.5;text-transform:none;overflow-wrap:anywhere}
.pc .bh-actions button:focus-visible,.pc .linkify-btn:focus-visible{outline:3px solid rgba(20,58,123,.25);outline-offset:2px}
@media(max-width:600px){
 .pc .bh{align-items:flex-start}
 .pc .bh-title{flex:1 1 100%}
 .pc .bh-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .pc .bh-actions button{width:100%;min-width:0;min-height:44px;padding:7px 5px}
 .pc .bh-actions button span{font-size:11px}
 .pc .linkify-setting{padding:9px;gap:6px}
 .pc .linkify-btn{font-size:13px;min-height:46px}
}
@media(max-width:360px){
 .pc .bh-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
 .pc .bh-actions button{font-size:11px;padding:6px 3px}
 .pc .bh-actions button .ic{width:15px;height:15px}
 .pc .linkify-btn{font-size:12px}
}


/* Soft academic treatment for student-uploaded seminar images */
.bd figure img.academic-report-image{
  display:block;
  border:1px solid rgba(30,55,90,.12);
  border-radius:9px;
  opacity:.94;
  box-shadow:0 2px 9px rgba(25,45,75,.08);
  transition:opacity .2s ease,box-shadow .2s ease;
}
@media print{
  .bd figure img.academic-report-image{
    opacity:.96;
    box-shadow:0 1px 4px rgba(25,45,75,.06);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}

/* Add-content bar: equal-size grid, no sideways scrolling */
.pc .addbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;padding:8px;overflow:visible;border-radius:14px;background:#fff}
.pc .addbar button,.pc .addbar .ab{box-sizing:border-box;width:100%;min-width:0;min-height:56px;height:auto;margin:0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;line-height:1.15;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ac);cursor:pointer}
.pc .addbar .ab .ic,.pc .addbar button .ic{width:20px;height:20px}
.pc .addbar button span,.pc .addbar .ab span{display:block;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.pc .addbar button:active,.pc .addbar .ab:active{background:#F1ECF6}
@media(max-width:600px){.pc .addbar{grid-template-columns:repeat(4,1fr);gap:5px;padding:6px}.pc .addbar button,.pc .addbar .ab{min-height:54px;font-size:11px}}
@media(max-width:340px){.pc .addbar{grid-template-columns:repeat(3,1fr)}}

en:`# Cloud Computing for Universities

## 1. Introduction
Cloud computing delivers IT resources over the Internet and charges only for what is used.
- Universities no longer need to buy and maintain every server on campus.
- Students and staff reach the same tools from any device, anywhere.
- Platforms such as Google Workspace, Microsoft 365 and Moodle run on the cloud.
- This seminar explains the models, benefits and risks of adopting it.
Image: university students using laptops on campus

## 2. Objectives
By the end of this seminar, the audience will be able to:
- Define cloud computing and name its key characteristics.
- Compare the IaaS, PaaS and SaaS service models.
- Distinguish public, private and hybrid clouds.
- Evaluate the benefits and risks of cloud adoption in a university.

## 3. Key Characteristics
| Characteristic | Definition |
|---|---|
| On-demand self-service | Users activate resources themselves. |
| Broad network access | Available from phones, tablets and laptops. |
| Rapid elasticity | Capacity grows or shrinks with demand. |
| Measured service | Usage is metered; pay only for what you use. |

## 4. Service Models
| Model | Provides | Example |
|---|---|---|
| IaaS | Servers and storage | Virtual machines |
| PaaS | Development platform | App hosting |
| SaaS | Ready-to-use software | Online office tools |

## 5. Deployment Types
| Type | Definition |
|---|---|
| Public cloud | Shared by many customers. |
| Private cloud | Reserved for one organization. |
| Hybrid cloud | Combines public and private clouds. |
| Community cloud | Shared by organizations with common goals. |

## 6. Benefits for Universities
The cloud lets a university spend less and deliver services faster.
- Lower cost: no large purchases of servers and equipment.
- Scalability: extra capacity during exams and registration.
- Collaboration: students and lecturers work together remotely.
- Reliability: automatic backups and quick recovery after failures.
Image: university library digital learning

## 7. Risks and Challenges
Adopting the cloud is not risk-free and needs careful planning.
- Data security: protecting student records and research.
- Internet dependence: services stop when the connection fails.
- Vendor lock-in: moving data to another provider is difficult.
- Legal issues: where data is stored and which laws apply.
Image: cybersecurity padlock data protection

## 8. Steps to Move to the Cloud
1. Assess the existing systems and data.
2. Set clear goals and a budget.
3. Choose the right model and provider.
4. Migrate in stages and test each stage.
5. Train users and monitor performance.
Image: team planning roadmap whiteboard

## 9. Conclusion
Cloud computing is now a core part of university IT.
- Choose the model and type that match the university's needs.
- The benefits appear only with good planning and security.
- Gradual migration reduces risk.

## References
- Mell, P., & Grance, T. (2011). The NIST definition of cloud computing (NIST Special Publication 800-145). National Institute of Standards and Technology.
- Armbrust, M., et al. (2010). A view of cloud computing. Communications of the ACM, 53(4), 50-58.
- Buyya, R., et al. (2009). Cloud computing and emerging IT platforms. Future Generation Computer Systems, 25(6), 599-616.
- Erl, T., Puttini, R., & Mahmood, Z. (2013). Cloud computing: Concepts, technology & architecture. Prentice Hall.`,
ckb:`# کلاود کۆمپیوتینگ بۆ زانکۆکان

## 1. پێشەکی
کلاود کۆمپیوتینگ سەرچاوە کۆمپیوتەرییەکان لە ڕێگەی ئینتەرنێتەوە دابین دەکات و تەنها بەپێی بەکارهێنان پارە وەردەگرێت.
- زانکۆکان پێویستیان بە کڕین و چاودێریکردنی هەموو سێرڤەرەکانی ناو کامپەس نامێنێت.
- خوێندکار و ستاف لە هەر ئامێرێک و هەر شوێنێکەوە دەگەنە هەمان ئامرازەکان.
- پلاتفۆرمەکانی وەک Google Workspace و Microsoft 365 و Moodle لەسەر کلاود کار دەکەن.
- ئەم سیمینارە مۆدێل و سوود و مەترسییەکانی بەکارهێنانی کلاود ڕوون دەکاتەوە.
Image: university students using laptops on campus

## 2. ئامانجەکان
لە کۆتایی ئەم سیمینارەدا، بەشداربووان دەتوانن:
- کلاود کۆمپیوتینگ پێناسە بکەن و تایبەتمەندییە سەرەکییەکانی ناو ببەن.
- مۆدێلەکانی IaaS و PaaS و SaaS بەراورد بکەن.
- کلاودی گشتی و تایبەت و تێکەڵ لێک جیا بکەنەوە.
- سوود و مەترسییەکانی کلاود لە زانکۆدا هەڵبسەنگێنن.

## 3. تایبەتمەندییە سەرەکییەکان
| تایبەتمەندی | پێناسە |
|---|---|
| خزمەتگوزاری خۆسەر | بەکارهێنەر خۆی سەرچاوەکان چالاک دەکات. |
| دەستگەیشتن بە تۆڕ | لە مۆبایل و تابلێت و لاپتۆپەوە بەردەستە. |
| فراوانبوونی خێرا | توانا بەپێی داواکاری زیاد یان کەم دەبێت. |
| خزمەتگوزاری پێوراو | بەکارهێنان دەپێورێت و تەنها بەپێی بەکارهێنان پارە دەدرێت. |

## 4. مۆدێلەکانی خزمەتگوزاری
| مۆدێل | دابین دەکات | نموونە |
|---|---|---|
| IaaS | سێرڤەر و هەڵگرتن | ماشینی ڤێرچواڵ |
| PaaS | پلاتفۆرمی پەرەپێدان | هۆستینگی ئەپ |
| SaaS | نەرمامێری ئامادە | ئۆفیسی ئۆنلاین |

## 5. جۆرەکانی کلاود
| جۆر | پێناسە |
|---|---|
| کلاودی گشتی | چەندین کڕیار پێکەوە بەکاری دەهێنن. |
| کلاودی تایبەت | تەنها بۆ یەک دامەزراوە تەرخان کراوە. |
| کلاودی تێکەڵ | گشتی و تایبەت پێکەوە دەگرێتەوە. |
| کلاودی کۆمەڵگە | چەند دامەزراوەیەک بە ئامانجی هاوبەش بەکاری دەهێنن. |

## 6. سوودەکان بۆ زانکۆ
کلاود تێچوو کەم دەکاتەوە و خزمەتگوزاری خێراتر دەکات.
- تێچووی کەمتر: پێویست بە کڕینی سێرڤەری گەورە نییە.
- فراوانبوون: توانای زیاتر لە وەرزی تاقیکردنەوە.
- هاوکاری: کارکردنی هاوبەش لە دووریشەوە.
- متمانەپێکراوی: پاڵپشتی خۆکاری داتا.
Image: university library digital learning

## 7. مەترسی و تەحەدیاتەکان
کلاود بێ مەترسی نییە و پلانی وردی پێویستە.
- ئاسایشی داتا: پاراستنی زانیاری خوێندکار.
- پشتبەستن بە ئینتەرنێت: بێ ئینتەرنێت خزمەتگوزاری ناگات.
- بەستراوەیی بە دابینکەر: گواستنەوەی داتا قورسە.
- لایەنی یاسایی: شوێنی هەڵگرتنی داتا و یاسا.
Image: cybersecurity padlock data protection

## 8. هەنگاوەکانی گواستنەوە بۆ کلاود
1. هەڵسەنگاندنی سیستەم و داتا هەنووکەییەکان.
2. دیاریکردنی ئامانجی ڕوون و بودجە.
3. هەڵبژاردنی مۆدێل و دابینکەری گونجاو.
4. گواستنەوە بە قۆناغ و تاقیکردنەوەی هەر قۆناغێک.
5. ڕاهێنانی بەکارهێنەران و چاودێریکردنی کارایی.
Image: team planning roadmap whiteboard

## 9. دەرئەنجام
کلاود کۆمپیوتینگ ئێستا بەشێکی سەرەکییە لە تەکنەلۆجیای زانیاری زانکۆکان.
- مۆدێل و جۆری گونجاو بەپێی پێداویستی زانکۆ هەڵبژێرە.
- سوودەکان تەنها بە پلان و ئاسایشی باش بەدی دێن.
- گواستنەوەی قۆناغ بە قۆناغ مەترسی کەم دەکاتەوە.

## سەرچاوەکان
- Mell, P., & Grance, T. (2011). The NIST definition of cloud computing (NIST Special Publication 800-145). National Institute of Standards and Technology.
- Armbrust, M., et al. (2010). A view of cloud computing. Communications of the ACM, 53(4), 50-58.

ar:`# الحوسبة السحابية في الجامعات

## 1. المقدمة
توفر الحوسبة السحابية موارد تقنية المعلومات عبر الإنترنت، ويُدفع مقابل الاستخدام الفعلي فقط.
- لم تعد الجامعات بحاجة إلى شراء وصيانة جميع الخوادم داخل الحرم الجامعي.
- يصل الطلاب والموظفون إلى الأدوات نفسها من أي جهاز وفي أي مكان.
- منصات مثل Google Workspace وMicrosoft 365 وMoodle تعمل على السحابة.
- يشرح هذا العرض النماذج والفوائد والمخاطر عند اعتماد السحابة.
Image: university students using laptops on campus

## 2. الأهداف
في نهاية هذا العرض سيكون الحضور قادرين على:
- تعريف الحوسبة السحابية وذكر خصائصها الأساسية.
- المقارنة بين نماذج الخدمة IaaS وPaaS وSaaS.
- التمييز بين السحابة العامة والخاصة والهجينة.
- تقييم فوائد السحابة ومخاطرها في الجامعة.

## 3. الخصائص الأساسية
| الخاصية | التعريف |
|---|---|
| الخدمة الذاتية | يفعّل المستخدم الموارد بنفسه. |
| الوصول عبر الشبكة | متاحة من الهاتف واللوحي والحاسوب المحمول. |
| المرونة السريعة | تزداد القدرة أو تقل حسب الطلب. |
| الخدمة المقيسة | يُقاس الاستخدام ويُدفع مقابله فقط. |

## 4. نماذج الخدمة
| النموذج | ما يوفره | مثال |
|---|---|---|
| IaaS | خوادم ومساحة تخزين | أجهزة افتراضية |
| PaaS | منصة تطوير | استضافة التطبيقات |
| SaaS | برمجيات جاهزة | أدوات مكتبية عبر الإنترنت |

## 5. أنواع النشر
| النوع | التعريف |
|---|---|
| السحابة العامة | يشاركها عدة عملاء. |
| السحابة الخاصة | مخصصة لمؤسسة واحدة فقط. |
| السحابة الهجينة | تجمع بين العامة والخاصة. |
| سحابة المجتمع | تشترك فيها مؤسسات ذات أهداف مشتركة. |

## 6. فوائد للجامعة
تتيح السحابة للجامعة أن تنفق أقل وتقدم خدماتها بسرعة أكبر.
- تكلفة أقل: لا حاجة لشراء خوادم ومعدات كبيرة.
- قابلية التوسع: قدرة إضافية في فترات الامتحانات والتسجيل.
- التعاون: يعمل الطلاب والأساتذة معاً عن بُعد.
- الموثوقية: نسخ احتياطي تلقائي واستعادة سريعة بعد الأعطال.
Image: university library digital learning

## 7. المخاطر والتحديات
اعتماد السحابة لا يخلو من المخاطر ويحتاج إلى تخطيط دقيق.
- أمن البيانات: حماية سجلات الطلاب والأبحاث.
- الاعتماد على الإنترنت: تتوقف الخدمات عند انقطاع الاتصال.
- الارتباط بالمزوّد: يصعب نقل البيانات إلى مزوّد آخر.
- الجوانب القانونية: مكان تخزين البيانات والقوانين المطبقة.
Image: cybersecurity padlock data protection

## 8. خطوات الانتقال إلى السحابة
1. تقييم الأنظمة والبيانات الحالية.
2. تحديد أهداف واضحة وميزانية.
3. اختيار النموذج والمزوّد المناسبين.
4. النقل على مراحل مع اختبار كل مرحلة.
5. تدريب المستخدمين ومراقبة الأداء.
Image: team planning roadmap whiteboard

## 9. الخاتمة
أصبحت الحوسبة السحابية جزءاً أساسياً من تقنية المعلومات في الجامعات.
- اختر النموذج والنوع المناسبين لاحتياجات الجامعة.
- لا تظهر الفوائد إلا مع تخطيط وأمن جيدين.
- الانتقال التدريجي يقلل المخاطر.

## المراجع

- Erl, T., Puttini, R., & Mahmood, Z. (2013). Cloud computing: Concepts, technology & architecture. Prentice Hall.`};

 if(r==null){const N=NUMP[UIL];let m;
  if(m=/^(\d+) items$/.exec(t))r=N.items(m[1]);else if(m=/^(\d+) words · (\d+) characters$/.exec(t))r=N.words(m[1],m[2]);
  else if(m=/^Page (\d+) of (\d+)$/.exec(t))r=N.page(m[1],m[2]);else if(m=/^Remove student (\d+)$/.exec(t))r=N.rm(m[1]);else if(m=/^Use (#[0-9a-fA-F]{6})$/.exec(t))r=N.use(m[1])}
 return r==null?s:raw.replace(t,()=>r)}

const row=(l,h,hint)=>`<div class="lf"><label>${X(l)}</label>${h}${hint?`<p class="lhint">${X(hint)}</p>`:""}</div>`;
const inp=(k,v,ph)=>`<input type="text" data-k="${k}" value="${e(v||"")}" placeholder="${e(ph?tr(ph):"")}">`;
const area=(k,v,ph,r)=>`<textarea data-k="${k}" rows="${r||6}" placeholder="${e(ph?tr(ph):"")}">${e(v||"")}</textarea>`;
const seg=(k,o,cur)=>`<div class="lseg" data-seg="${k}">${o.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(cur)===String(v)?"on":""}">${X(l)}</button>`).join("")}</div>`;
const btn=(a,l,cls,extra)=>`<button type="button" data-act="${a}" class="${cls||""}" ${extra||""}>${l}</button>`;
const vvFit=()=>{const v=window.visualViewport;if(!v||ov.hidden)return;ov.style.height=v.height+"px";ov.style.top=v.offsetTop+"px"};
if(window.visualViewport){visualViewport.addEventListener("resize",vvFit);visualViewport.addEventListener("scroll",vvFit)}
function show(title,body,o){ov.innerHTML=`<div class="lcard" role="dialog" aria-modal="true"><div class="lhd"><b>${X(title)}</b><button type="button" class="lx" data-x="close" aria-label="${X("Close")}">${ic("x")}</button></div><div class="lbd">${body}</div><div class="lft"><button type="button" class="pri" data-x="done">${X("Done")}</button><button type="button" data-x="close">${X("Cancel")}</button></div></div>`;
 ov.hidden=false;document.body.classList.add("lsh-open");sh=Object.assign({d:{}},o);vvFit();
 ov.querySelectorAll("input[type=text],textarea").forEach(x=>x.dir="auto");
 if(o.focus!==false){const f=ov.querySelector("textarea,input[type=text]");if(f)setTimeout(()=>{f.focus();try{f.setSelectionRange(f.value.length,f.value.length)}catch(x){}},80)}}
function close(){ov.hidden=true;ov.innerHTML="";document.body.classList.remove("lsh-open");sh=null}
function commit(){const y=window.scrollY;save();renderEd();fit();window.scrollTo(0,y);setTimeout(()=>window.scrollTo(0,y),60)}
const val=()=>{const o={};ov.querySelectorAll("[data-k]").forEach(x=>o[x.dataset.k]=x.value);return o};
const armed=b=>{if(!b.dataset.arm){b.dataset.arm=1;b._h=b.innerHTML;b.textContent=tr("Sure? Tap again");setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.innerHTML=b._h}},3000);return false}return true};
const pickImg=(max,cb)=>{const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=()=>{const x=f.files&&f.files[0];if(x)shrink(x,max,"image/jpeg",cb)};f.click()};
const NEW={p:{t:"p",text:"",cap:""},ul:{t:"ul",text:"",cap:""},tbl:{t:"tbl",text:"Header 1 | Header 2\nCell | Cell",cap:""},img:{t:"img",text:"",cap:"",layout:"left"},h:{t:"h",text:"",cap:""}};
const addBar=()=>`<div class="lsub">${X("Add below")}</div><div class="lact">${[["p","Paragraph"],["ul","Bullet list"],["tbl","Table"],["img","Image"],["h","Subtitle"]].map(([t,l])=>btn("add",""+"+ "+X(l),"",`data-t="${t}"`)).join("")}</div>`;
const emptyBlk=b=>b.t=="img"?!b.src:!String(b.text||"").trim();

/* --- cover info fields --- */
function sInfo(keys){const ks=keys.split(","),I=S.info,t=ks.includes("title")?"Seminar title":ks.includes("uni")?"University details":"Academic year";
 show(t,ks.map(k=>row(lab[k]||k,inp(k,I[k]))).join(""),{done(){const v=val();ks.forEach(k=>{I[k]=(v[k]||"").trim()})}})}
/* --- students + supervisor --- */
function sStu(){const I=S.info,sr=(v,i)=>`<div class="lsr"><input type="text" data-st value="${e(v||"")}" placeholder="${e(tr("Student name"))}">${btn("delstu",ic("trash"),"dng",`aria-label="${X("Delete")}"`)}</div>`;
 show("Students and supervisor",`<div class="lf"><label>${X("Students")}</label><div id="lstu">${(I.students&&I.students.length?I.students:[""]).map(sr).join("")}</div>${btn("addstu",ic("plus")+X("Add student"))}</div>${row(lab.sup,inp("sup",I.sup))}`,
 {sr,done(){const v=val();I.students=[...ov.querySelectorAll("[data-st]")].map(x=>x.value.trim()).filter(Boolean);I.sup=(v.sup||"").trim()}})}
/* --- reference --- */
function sRef(id){const i=S.refs.findIndex(r=>r.id==id),r=S.refs[i];if(!r)return;const F=[["author","Author"],["year","Year"],["title","Title"],["source","Source / journal"],["volume","Volume"],["issue","Issue"],["pages","Pages"],["publisher","Publisher"],["url","URL / DOI"]];
 show("Edit reference",F.map(([k,l])=>row(l,inp(k,r[k]))).join("")+`<div class="lact">${btn("delref",ic("trash")+X("Delete reference"),"dng")}</div>`,{focus:false,ref:r,done(){const v=val();F.forEach(([k])=>{r[k]=(v[k]||"").trim()})}})}
/* --- slide side picture --- */
function sPic(i){const g=S.pages[i];if(!g)return;const d={pos:pgPos(g)=="n"?defPos():pgPos(g),pic:g.pic};
 show("Slide image",`<div id="lprev">${d.pic?`<img class="lthumb" src="${d.pic}" alt="">`:""}</div><div class="lact">${btn("pick",ic("image")+X("Replace image"))}${btn("rmpic",ic("trash")+X("Remove image"),"dng")}</div><div class="lsub">${X("Image position")}</div>${seg("pos",[["l","Left"],["r","Right"],["t","Top"]],d.pos)}`,
 {focus:false,d,g,done(){g.pos=sh.d.pos;if(sh.d.pic!==g.pic){g.pic=sh.d.pic;delete g.credit;delete g.picUrl}}})}
/* --- section (tap the slide header) --- */
function sPg(i){const g=S.pages[i];if(!g)return;const d={fs:g.fs||12,pos:pgPos(g)};
 show("Slide settings",row("Section title",inp("title",g.title))+row("Text size",seg("fs",[10,11,12,13,14,16].map(v=>[v,v]),d.fs))+row("Side image",seg("pos",[["n","None"],["l","Left"],["r","Right"],["t","Top"]],d.pos))
 +`<div class="lsub">${X("Add to this slide")}</div><div class="lact">${[["p","Paragraph"],["ul","Bullet list"],["tbl","Table"],["img","Image"],["h","Subtitle"]].map(([t,l])=>btn("addend","+ "+X(l),"",`data-t="${t}"`)).join("")}</div>`
 +`<div class="lact" style="margin-top:12px">${btn("secup",ic("up")+X("Move section up"))}${btn("secdn",ic("down")+X("Move section down"))}</div><div class="lact" style="margin-top:6px">${btn("delsec",ic("trash")+X("Delete this section"),"dng")}</div>`,
 {d,g,i,done(){const v=val();g.title=(v.title||"").trim()||g.title;g.fs=+sh.d.fs;g.pos=sh.d.pos}})}
/* --- block (paragraph, list, table, subtitle, image) --- */
function sBlk(i,k,isNew){const g=S.pages[i],b=g&&g.blocks[k];if(!b)return;const d={ta:b.ta||"",lv:b.lv==3?3:2,layout:ph(b.layout||"left"),sz:b.sz||"m",src:b.src};let body="",t="Edit paragraph",focus=true;
 const ALN=row("Alignment",seg("ta",[["","Auto"],["left","Left"],["center","Center"],["right","Right"]],d.ta));
 if(b.t=="p"){body=row("Paragraph",area("text",b.text,"Write or paste text. A new line starts a new paragraph.",8))+ALN}
 else if(b.t=="ul"||b.t=="ol"){t="Edit list";body=row(b.t=="ul"?"Bullet list":"Numbered list",area("text",b.text,"One item per line",7))+row("Type",seg("lt",[["ul","Bullet list"],["ol","Numbered list"]],b.t))+ALN;d.lt=b.t}
 else if(b.t=="tbl"){t="Edit table";body=row("Table",area("text",b.text,"",7),"Header 1 | Header 2")+row("Image caption (optional)",inp("cap",b.cap))}
 else if(b.t=="h"){t="Edit subtitle";body=row("Subtitle",inp("text",b.text))+row("Level",seg("lv",[[2,"Level 2 (1.1)"],[3,"Level 3 (1.1.1)"]],d.lv))}
 else if(b.t=="img"){t="Edit image";focus=false;body=`<div id="lprev">${b.src?`<img class="lthumb" src="${b.src}" alt="">`:""}</div><div class="lact">${btn("pick",ic("image")+X(b.src?"Replace image":"Choose image"))}</div>`
  +row("Image position",seg("layout",[["left","Left"],["center","Center"],["right","Right"],["top","Top"],["bottom","Bottom"]],d.layout))+row("Size",seg("sz",[["s","Small"],["m","Medium"],["l","Large"]],d.sz))
  +row("Image caption (optional)",inp("cap",b.cap))+row("Text beside the image",area("note",b.note,"",4))}
 body+=`<div class="lsub">${X("Add below")}</div><div class="lact">${[["p","Paragraph"],["ul","Bullet list"],["tbl","Table"],["img","Image"],["h","Subtitle"]].map(([x,l])=>btn("add","+ "+X(l),"",`data-t="${x}"`)).join("")}</div>`
  +`<div class="lact" style="margin-top:12px">${btn("bup",ic("up")+X("Move up"))}${btn("bdn",ic("down")+X("Move down"))}${btn("delb",ic("trash")+X("Delete this item"),"dng")}</div>`;
 show(t,body,{focus,d,g,b,i,k,isNew,
  cancel(){if(isNew&&emptyBlk(b)){const x=g.blocks.indexOf(b);if(x>=0)g.blocks.splice(x,1)}},
  done(){const v=val(),dd=sh.d;
   if(b.t=="img"){b.src=dd.src;b.cap=(v.cap||"").trim();b.note=v.note||"";b.layout=ph(dd.layout);b.sz=dd.sz}
   else if(b.t=="h"){b.text=(v.text||"").trim();b.lv=+dd.lv}
   else{b.text=String(v.text||"").replace(/\s+$/,"");if(b.t=="tbl")b.cap=(v.cap||"").trim();else{if(dd.lt)b.t=dd.lt;if(dd.ta)b.ta=dd.ta;else delete b.ta}}
   if(b.t=="img"?!b.src&&!String(b.note).trim():!String(b.text).trim()){const x=g.blocks.indexOf(b);if(x>=0)g.blocks.splice(x,1)}}})}
function open(id){const p=String(id).split(":");
 if(p[0]=="info")sInfo(p[1]);else if(p[0]=="stu")sStu();else if(p[0]=="ref")sRef(p.slice(1).join(":"));else if(p[0]=="pic")sPic(+p[1]);else if(p[0]=="pg")sPg(+p[1]);else if(p[0]=="b")sBlk(+p[1],+p[2])}
window.LV={open};
/* --- actions inside the sheet --- */
ov.addEventListener("click",ev=>{const t=ev.target;
 if(t===ov){if(sh&&sh.cancel)sh.cancel();close();return}
 const x=t.closest("[data-x]");
 if(x){if(x.dataset.x=="close"){if(sh&&sh.cancel)sh.cancel();close()}else if(sh){const was=sh;was.done&&was.done();close();commit()}return}
 const sg=t.closest(".lseg button");if(sg&&sh){const w=sg.parentElement;sh.d[w.dataset.seg]=w.dataset.seg=="fs"||w.dataset.seg=="lv"?+sg.dataset.v:sg.dataset.v;w.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===sg));return}
 const a=t.closest("[data-act]");if(!a||!sh)return;const act=a.dataset.act,s=sh;
 if(act=="addstu"){const w=ov.querySelector("#lstu");w.insertAdjacentHTML("beforeend",s.sr("",0));const n=w.lastElementChild.querySelector("input");n.dir="auto";n.focus();return}
 if(act=="delstu"){a.closest(".lsr").remove();return}
 if(act=="pick"){pickImg(s.b?1100:1000,d=>{s.d[s.b?"src":"pic"]=d;ov.querySelector("#lprev").innerHTML=`<img class="lthumb" src="${d}" alt="">`});return}
 if(act=="rmpic"){if(!armed(a))return;s.g.pos="n";delete s.g.pic;delete s.g.credit;delete s.g.picUrl;close();commit();return}
 if(act=="delref"){if(!armed(a))return;const x=S.refs.indexOf(s.ref);if(x>=0)S.refs.splice(x,1);close();commit();return}
 if(act=="delsec"){if(!armed(a))return;S.pages.splice(s.i,1);close();commit();return}
 if(act=="secup"||act=="secdn"){mv(S.pages,s.i,act=="secup"?-1:1);close();commit();return}
 if(act=="addend"){const nb=Object.assign({},NEW[a.dataset.t]);s.done&&s.done();s.g.blocks.push(nb);close();commit();sBlk(s.i,s.g.blocks.length-1,true);return}
 if(act=="add"){const nb=Object.assign({},NEW[a.dataset.t]),at0=s.g.blocks.indexOf(s.b);s.done&&s.done();const at=s.g.blocks.indexOf(s.b),pos=at>=0?at+1:at0;s.g.blocks.splice(pos,0,nb);close();commit();sBlk(s.i,pos,true);return}
 if(act=="bup"||act=="bdn"){s.done&&s.done();const at=s.g.blocks.indexOf(s.b);if(at>=0)mv(s.g.blocks,at,act=="bup"?-1:1);close();commit();return}
 if(act=="delb"){if(!armed(a))return;const at=s.g.blocks.indexOf(s.b);if(at>=0)s.g.blocks.splice(at,1);close();commit()}});
document.addEventListener("keydown",ev=>{if(ev.key=="Escape"&&sh){if(sh.cancel)sh.cancel();close()}});
/* --- open the editor when an element in Live is tapped --- */
$("doc").addEventListener("click",ev=>{if(ev.target.closest(".pic,.lgc,a[href^=http]"))return;const t=ev.target.closest("[data-ed]");if(!t)return;ev.preventDefault();open(t.dataset.ed)});
const _tab=tab;tab=function(t){_tab(t);if(t==="pv"&&!window.LV.hinted){window.LV.hinted=1;toast(tr("Tap any text or image on a slide to edit it"),5000)}};
})();

statics();applyUI();trInit();renderEd();trTree(document.getElementById("top"));trTree(document.getElementById("nav"));trTree(document.getElementById("ed"));
</script></body></html>
