.bio .lk,.bio .soc a{--bc:color-mix(in srgb,var(--b) 60%,#000)}.bio.dk .lk,.bio.dk .soc a{--bc:var(--b)}

.sec{text-align:left;font-size:14px;font-weight:600;opacity:.6;margin:36px 4px 4px}
.lk:hover{transform:translateY(-2px)}.lk.pill{border-radius:999px;padding-inline-end:24px}.lk.square{border-radius:8px}.lk.outline{background:transparent}
.bio svg{width:20px;height:20px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}

.bio{overflow:hidden}.bio .av{display:block;margin:0}

async function route(){

  if(u)return showPublic(u);

  session?showDash(session.user):showLogin();

const fmtViews=n=>{n=Number(n)||0;if(n<1000)return'1K+';
  const f=(v,k)=>{const t=Math.floor(v*10)/10;return(t%1?t.toFixed(1):t+'')+k+(t%1?'':'+')};
  return(n>=1e6?f(n/1e6,'M'):f(n/1e3,'K'))};
async function countView(u){
  const k='vw:'+u.toLowerCase();
  try{if(localStorage.getItem(k))return null}catch{}
  try{const{data:{session}}=await sb.auth.getSession();if(session&&session.user.email===em(u))return null}catch{}
  const{data,error}=await sb.rpc('increment_view',{uname:u});
  if(error||data==null)return null;
  try{localStorage.setItem(k,'1')}catch{}
  return Number(data);
}
async function showPublic(u){
  setPub(true);loading();
  const[r,loc]=await Promise.all([sb.rpc('get_public_profile',{uname:u}),sb.rpc('get_public_location',{uname:u})]);
  const{data,error}=r;
  if(error)return msg('Something went wrong','Please try again in a few minutes.');
  if(!data)return msg('Page not found',`There is no online page called "${u}".`);
  if(loc&&loc.data)Object.assign(data,loc.data);
  document.title=(data.display_name||u)+' | Link Bio';renderBio(app,data);
  countView(u).then(n=>{if(n!=null){const v=app.querySelector('.vw b');if(v)v.textContent=fmtViews(n)}});
}

async function cropImage(file,ratio,outW,radius){
  let bmp;try{bmp=await createImageBitmap(file)}catch{throw new Error('Could not read this image')}
  return new Promise(res=>{
    const w=Math.min(340,innerWidth-64),h=Math.round(w/ratio),dpr=window.devicePixelRatio||1;
    const base=Math.max(w/bmp.width,h/bmp.height);let z=1,ox=(w-bmp.width*base)/2,oy=(h-bmp.height*base)/2;
    const sc=()=>base*z,cl=()=>{ox=Math.min(0,Math.max(w-bmp.width*sc(),ox));oy=Math.min(0,Math.max(h-bmp.height*sc(),oy))};
    const ov=el('div','crop'),bx=el('div','cbx'),vp=el('div','cvp'),cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    cv.width=w*dpr;cv.height=h*dpr;cv.style.width=vp.style.width=w+'px';cv.style.height=vp.style.height=h+'px';vp.style.borderRadius=radius;
    ctx.imageSmoothingQuality='high';
    const draw=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.drawImage(bmp,ox,oy,bmp.width*sc(),bmp.height*sc())};
    cl();draw();vp.append(cv);
    let drag=null;
    cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!drag)return;ox=drag.ox+e.clientX-drag.x;oy=drag.oy+e.clientY-drag.y;cl();draw()};
    cv.onpointerup=cv.onpointercancel=()=>{drag=null};
    const zr=document.createElement('input');zr.type='range';zr.min='1';zr.max='4';zr.step='0.01';zr.value='1';zr.setAttribute('aria-label','Zoom');
    zr.oninput=()=>{const o=sc(),cx=(w/2-ox)/o,cy=(h/2-oy)/o;z=+zr.value;ox=w/2-cx*sc();oy=h/2-cy*sc();cl();draw()};
    const ok=el('button','btn pri','Use photo'),no=el('button','btn','Cancel'),row=el('div','row');ok.type='button';no.type='button';
    const done=v=>{ov.remove();res(v)};
    no.onclick=()=>done(null);
    ok.onclick=()=>{const k=outW/w,o=document.createElement('canvas');o.width=outW;o.height=Math.round(outW/ratio);
      const c2=o.getContext('2d');c2.imageSmoothingQuality='high';c2.drawImage(bmp,ox*k,oy*k,bmp.width*sc()*k,bmp.height*sc()*k);done(o)};
    row.append(no,ok);
    const zl=el('label','','Zoom');
    bx.append(el('h2','','Move and zoom'),el('p','','Drag the photo to choose what shows.'),vp,zl,zr,row);ov.append(bx);document.body.append(ov);
  });
}
async function uploadAvatar(e,kind){
  kind=kind==='cover'?'cover':'avatar';const col=kind==='cover'?'cover_url':'avatar_url';
  const f=e.target.files[0];if(!f)return;
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))return toast('Use a JPG, PNG or WebP image');
  if(f.size>2*1024*1024)return toast('Image must be under 2MB');
  try{
    const rad=kind==='cover'?'0':({round:'50%',rounded:'18px',square:'0'}[S.p.avatar_shape]||'50%');
    const c=await cropImage(f,kind==='cover'?8/5:1,kind==='cover'?1200:512,rad);
    if(!c){e.target.value='';return}
    const tb=t=>new Promise(r=>c.toBlob(r,t,.85));
    let blob=await tb('image/webp');if(!blob||blob.type!=='image/webp')blob=await tb('image/jpeg');
    if(!blob)throw new Error('Could not process the image');
    const path=S.p.id+'/'+kind+(blob.type==='image/webp'?'.webp':'.jpg');
    const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:blob.type,cacheControl:'3600'});
    if(up.error)throw up.error;
    const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
    const{error}=await sb.from('profiles').update({[col]:url}).eq('id',S.p.id);
    if(error)throw error;S.p[col]=url;preview();toast('Picture updated');
  }catch(err){toast('Upload failed: '+((err&&err.message)||'unknown error').slice(0,80))}
  e.target.value='';
}
