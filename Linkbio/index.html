.bio .lk,.bio .soc a{--bc:color-mix(in srgb,var(--b) 60%,#000)}.bio.dk .lk,.bio.dk .soc a{--bc:var(--b)}

.sec{text-align:left;font-size:14px;font-weight:600;opacity:.6;margin:36px 4px 4px}
.lk:hover{transform:translateY(-2px)}.lk.pill{border-radius:999px;padding-inline-end:24px}.lk.square{border-radius:8px}.lk.outline{background:transparent}
.bio svg{width:20px;height:20px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}

.bio{overflow:hidden}.bio .av{display:block;margin:0}

/* app-like scrolling: no bounce, no pull-to-refresh, no scrollbar, no extra blank space */
html.pub,html.pub body{height:100%;overflow:hidden;overscroll-behavior:none}
html.pub #app{height:100%;height:100dvh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
html.pub #app::-webkit-scrollbar{display:none}
html.pub .bio{min-height:100%;padding-bottom:28px}
/* ---- login page ---- */
.auth{min-height:calc(100vh - 75px);min-height:calc(100dvh - 75px);display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:32px 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.auth h1{margin:0 0 8px;font-size:34px;line-height:1.15;letter-spacing:-.025em;color:var(--navy)}
.auth .s{margin:0 0 28px;color:var(--mute);font-size:16px}
.grp{background:var(--soft);border-radius:16px;overflow:hidden;text-align:start;margin-bottom:12px;border:1px solid rgba(0,0,0,.06)}
.fld{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:54px}
.fld+.fld{border-top:1px solid var(--line)}
.fld label{margin:0;flex:0 0 88px;color:var(--navy);font-size:16px;font-weight:500}
.fld input{border:0;background:transparent;padding:15px 0;border-radius:0;direction:ltr;min-width:0}
.fld input:focus-visible{outline:none}
.fld:focus-within{background:#eaeffa}
.auth .err{min-height:20px;margin:0 4px 10px;text-align:start}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.txt{border:0;background:transparent;margin-top:8px;width:100%;color:var(--mute);font-weight:500}
.auth .dev{margin-top:28px;padding:0}
/* ---- edit page sections ---- */
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;margin:0 0 6px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:4;box-shadow:0 6px 12px -8px rgba(0,0,0,.25)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg button svg{width:18px;height:18px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.pane{display:none}.pane.on{display:block}
.gh{margin:20px 6px 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.pr{display:flex;align-items:center;gap:12px;padding:8px 0}.pr+.pr{border-top:1px solid var(--line)}
.th{width:56px;height:56px;border-radius:14px;flex:none;background:var(--soft) center/cover no-repeat;border:1.5px solid var(--line)}.th.wide{width:88px}
.pt{flex:1;min-width:0}.pt b{display:block;color:var(--navy);font-size:15px}.pt span{display:block;font-size:13px;color:var(--mute)}
.pb{display:flex;gap:6px;flex:none}
.note{margin:6px 0 0;font-size:12px;color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:2px 0 4px}
.chip{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--navy);font-weight:600;font-size:14px;cursor:pointer;text-align:start;-webkit-tap-highlight-color:transparent;transition:border-color .15s,transform .12s}
.chip:active{transform:scale(.97)}
.chip .pv{height:64px;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:7px;border:1px solid rgba(128,128,128,.25)}
.chip .pv span{display:block;border-radius:6px}
.chip .pv .a{width:45%;height:8px}.chip .pv .b{width:100%;height:14px}

.chip .ck svg{width:12px;height:12px}
.chip.on{border-color:var(--navy);background:var(--soft)}.chip.on .ck{display:grid}

.card.soon svg{width:26px;height:26px;color:var(--gold)}.card.soon b{color:var(--navy)}

.bio.tpl{position:relative;background:radial-gradient(ellipse 100% 38% at 50% 100%,rgba(165,0,68,.30),transparent 70%),var(--bg)}

.bio.tpl .av{box-shadow:0 0 0 2px #edbb00,0 12px 28px -10px rgba(0,0,0,.7)}

    const upd=()=>{const e=segE(),cu=Math.max(0,(au.currentTime||0)-S0);
      if(isFinite(e)&&e>S0){if(!seeking)sk.value=Math.min(1000,Math.round(cu/(e-S0)*1000));t2.textContent='-'+fmt(e-S0-cu)}
      t1.textContent=fmt(cu);paint()};
    let lastSk=0;const seek=v=>{lastSk=Date.now();au.currentTime=v};
    const chk=()=>{if(au.seeking||Date.now()-lastSk<1500)return;const c0=au.currentTime||0,e=segE();
      if(c0<S0-.4)seek(S0);
      else if(mm.e>S0&&isFinite(e)&&c0>=e-.1)seek(S0)};
    const ticker=()=>{if(!mc2.isConnected){clearInterval(lp);return}try{chk();upd()}catch{}};
    au.onended=()=>{seek(S0);au.play().catch(()=>{})};
    au.onloadedmetadata=()=>{if(S0&&!yid&&au.currentTime<S0)seek(S0);upd()};au.ondurationchange=upd;
    au.onplay=()=>{mc2.classList.add('on');clearInterval(lp);lp=setInterval(ticker,200)};
    au.onpause=()=>{mc2.classList.remove('on');clearInterval(lp);stop()};au.onplaying=start;au.onwaiting=stop;
    sk.oninput=()=>{seeking=true;paint();const e=segE();if(isFinite(e)&&e>S0)t1.textContent=fmt(sk.value/1000*(e-S0))};
    sk.onchange=()=>{const e=segE();if(isFinite(e)&&e>S0)au.currentTime=S0+sk.value/1000*(e-S0);seeking=false;manual=true;upd()};
    pp.onclick=()=>{manual=true;au.paused?au.play().catch(()=>{}):au.pause()};
    rw.onclick=()=>{manual=true;au.currentTime=Math.max(S0,(au.currentTime||0)-10)};
    ff.onclick=()=>{manual=true;const e=segE(),c0=au.currentTime||0;au.currentTime=isFinite(e)&&e>0?Math.min(e-.1,c0+10):c0+10};
    if(ed)mc2.onclick=e=>{if(e.target.closest('.mc,.mpr'))return;ed.music()};
    else{
      const evs=['pointerdown','pointerup','mousedown','touchstart','touchend','click','keydown'];
      const off=()=>evs.forEach(k=>document.removeEventListener(k,first,true));
      const arm=()=>evs.forEach(k=>document.addEventListener(k,first,true));
      let lastTry=0;
      /* keeps trying on every tap/hold/click until the song is really playing with sound */
      const first=e=>{
        if(manual){off();return}
        if(e.target&&e.target.closest&&e.target.closest('.mc,.mpr'))return;
        if(navigator.userActivation&&!navigator.userActivation.isActive)return;
        if(Date.now()-lastTry<250)return;lastTry=Date.now();
        au.muted=false;
        const pr=au.paused?au.play():Promise.resolve();
        Promise.resolve(pr).then(()=>setTimeout(()=>{if(!au.paused&&!au.muted)off()},500),()=>{})};
      let told=false;const st0=au.onplaying;au.onplaying=()=>{st0();if(au.muted&&!told){told=true;toast('Tap anywhere for sound')}};
      const startMuted=()=>{au.muted=true;arm();au.play().catch(()=>{})};
      if(yid)startMuted();else au.play().catch(startMuted);
      try{if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:d.music_title||'',artist:d.music_artist||'',artwork:cvu2?[{src:cvu2}]:[]})}catch{}
    }
    inn.append(mc2)}
  else if(ed){const b=el('button','addl','Add music');b.type='button';b.onclick=ed.music;inn.append(b)}
  root.replaceChildren(...(cvEl?[cvEl,inn]:[inn]));lucide.createIcons();
}

async function uploadMusicCover(f){
  if(!f)return;
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))return toast('Use a JPG, PNG or WebP image');
  if(f.size>2*1024*1024)return toast('Image must be under 2MB');
  try{
    const c=await cropImage(f,1,400,'14px');if(!c)return;
    const tb=t=>new Promise(r=>c.toBlob(r,t,.85));
    let blob=await tb('image/webp');if(!blob||blob.type!=='image/webp')blob=await tb('image/jpeg');
    if(!blob)throw new Error('Could not process the image');
    const path=S.p.id+'/musiccover'+(blob.type==='image/webp'?'.webp':'.jpg');
    const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:blob.type,cacheControl:'3600'});
    if(up.error)throw up.error;
    const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
    const{error}=await sb.from('profiles').update({music_cover:url}).eq('id',S.p.id);
    if(error)throw error;S.p.music_cover=url;preview();toast('Cover updated');
  }catch(err){toast('Upload failed: '+((err&&err.message)||'unknown error').slice(0,80))}
}
function musicSheet(){
  const box=$('#sheet');box.replaceChildren();
  const P=S.p,mm=parseMusic(P.music_url||''),c=el('div','card'),h=el('h2','','Music'),t=el('input'),a=el('input'),fa=el('input'),yl=el('input'),yb=el('button','btn','Use link'),fc=el('input'),ts=el('input'),te=el('input'),er=el('div','err'),st=el('div','');
  st.style.cssText='font-size:13px;margin-top:8px;color:var(--mute)';
  t.maxLength=80;t.placeholder='Song title';t.value=P.music_title||'';
  a.maxLength=80;a.placeholder='Artist';a.value=P.music_artist||'';
  fa.type='file';fa.accept='audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.mp4,.mov';
  fc.type='file';fc.accept='image/jpeg,image/png,image/webp';
  yl.placeholder='https://youtube.com/watch?v=...';yl.maxLength=300;yb.type='button';
  ts.placeholder='0:00';ts.value=fmtT(mm.s);te.placeholder='End of song';te.value=fmtT(mm.e);ts.maxLength=te.maxLength=8;
  st.textContent=P.music_url?(ytId(mm.base)?'✓ A YouTube song is set.':'✓ A track is uploaded. Choose a file to replace it.'):'No track yet.';
  const lab=x=>el('label','',x),row=el('div','row'),sv=el('button','btn pri','Save'),rm=el('button','btn','Remove'),cl=el('button','btn','Close');
  [sv,rm,cl].forEach(b=>b.type='button');row.style.marginTop='12px';row.append(sv,rm,cl);
  const yr=el('div','row');yr.append(yl,yb);
  const tr=el('div','row'),d1=el('div'),d2=el('div');d1.append(lab('Start at (minutes:seconds)'),ts);d2.append(lab('Stop at (minutes:seconds)'),te);tr.append(d1,d2);
  const hint=el('div','','Only the part between start and stop will play again and again. Leave stop empty to play to the end.');
  hint.style.cssText='font-size:12px;color:var(--mute);margin-top:4px';
  let busy=false;
  const say=(m,bad)=>{er.textContent=bad?m:'';st.textContent=bad?'':m};
  const setBusy=b=>{busy=b;[sv,rm,cl,fa,fc,yl,yb,ts,te].forEach(x=>x.disabled=b)};
  const close=()=>box.replaceChildren();box.onclick=e=>{if(e.target===box&&!busy)close()};cl.onclick=close;
  fa.onchange=async()=>{const f=fa.files[0];fa.value='';if(!f)return;
    setBusy(true);say('Uploading 0%... please wait');
    const ok=await uploadMusic(f,say,pc=>say('Uploading '+pc+'%... please wait'));
    if(ok){ts.value='';te.value='';const up={};
      if(!P.music_title){up.music_title=f.name.replace(/\.[^.]+$/,'').slice(0,80);t.value=up.music_title}
      if(/ytimg\.com/.test(P.music_cover||''))up.music_cover=null;
      if(Object.keys(up).length){const r=await sb.from('profiles').update(up).eq('id',P.id);if(!r.error){Object.assign(P,up);preview()}}
      say('✓ Music uploaded: '+f.name)}
    setBusy(false)};
  yb.onclick=async()=>{
    const raw=yl.value.trim(),id=ytId(raw);
    if(!id)return say('Paste a valid YouTube link',1);
    setBusy(true);say('Checking link...');
    let info=null;
    try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
      if(r.status===401||r.status===403||r.status===404){setBusy(false);return say('This video cannot be used (private, deleted or embedding is disabled). Try another link.',1)}
      if(r.ok)info=await r.json()}catch{}
    const s0=ytStart(raw),v={music_url:buildMusic('https://www.youtube.com/watch?v='+id,s0,0),music_cover:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'};
    if(info){v.music_title=String(info.title||'').slice(0,80)||null;v.music_artist=String(info.author_name||'').replace(/ - Topic$/,'').slice(0,80)||null}
    const{error}=await sb.from('profiles').update(v).eq('id',P.id);
    setBusy(false);
    if(error)return say(error.code==='42703'?'Music columns are missing. Run the SQL setup in Supabase first.':'Could not save. Try again.',1);
    Object.assign(P,v);preview();t.value=P.music_title||'';a.value=P.music_artist||'';ts.value=fmtT(s0);te.value='';yl.value='';
    say('✓ YouTube song added. Set start and stop below, then press Save.')};
  fc.onchange=async()=>{const f=fc.files[0];fc.value='';if(!f)return;setBusy(true);await uploadMusicCover(f);setBusy(false)};
  const save=async v=>{const{error}=await sb.from('profiles').update(v).eq('id',P.id);
    if(error)return er.textContent=error.code==='42703'?'Music columns are missing. Run the SQL setup in Supabase first.':'Could not save. Try again.';
    Object.assign(P,v);close();preview();toast('Saved')};
  sv.onclick=()=>{const s=parseT(ts.value),e=parseT(te.value);
    if(s===false||e===false)return er.textContent='Time must look like 1:25 or 85';
    if(e!=null&&e<=(s||0))return er.textContent='Stop time must be after the start time';
    const v={music_title:t.value.trim()||null,music_artist:a.value.trim()||null};
    if(P.music_url)v.music_url=buildMusic(parseMusic(P.music_url).base,s,e);
    save(v)};
  rm.onclick=()=>save({music_url:null,music_title:null,music_artist:null,music_cover:null});
  c.append(h,lab('Upload a song, or a video from your gallery (we take the sound from the video)'),fa,lab('Or paste a YouTube link'),yr,st,lab('Song photo (optional)'),fc,lab('Title'),t,lab('Artist'),a,tr,hint,er,row);box.append(c);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
route();
</script>
