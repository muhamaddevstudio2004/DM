.lk .s{font-size:12.5px;opacity:.55;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bio{overflow:hidden}.bio .av{display:block;margin:0}

async function route(){

  if(u)return showPublic(u);
  const{data:{session}}=await sb.auth.getSession();
  if(location.search.includes('code='))history.replaceState(null,'',location.pathname);
  session?showDash(session.user):showLogin();
}
addEventListener('hashchange',route);

const fmtViews=n=>{n=Number(n)||0;if(n<1000)return'1K+';
  const f=(v,k)=>{const t=Math.floor(v*10)/10;return(t%1?t.toFixed(1):t+'')+k+(t%1?'':'+')};
  return(n>=1e6?f(n/1e6,'M'):f(n/1e3,'K'))};
async function countView(u){
  const k='vw:'+u.toLowerCase();
  try{if(localStorage.getItem(k))return null}catch{}
  try{const{data:{session}}=await sb.auth.getSession();if(session&&session.user.email===em(u))return null}catch{}
  const{data,error}=await sb.rpc('increment_view',{uname:u});
  if(error||data==null)return null;
  try{localStorage.setItem(k,'1')}catch{}
  return Number(data);
}
async function showPublic(u){
  setPub(true);loading();
  const[r,loc]=await Promise.all([sb.rpc('get_public_profile',{uname:u}),sb.rpc('get_public_location',{uname:u})]);
  const{data,error}=r;
  if(error)return msg('Something went wrong','The service is temporarily unavailable. Please try again shortly.');
  if(!data)return msg('Page not found',`There is no published page for "${u}".`);
  if(loc&&loc.data)Object.assign(data,loc.data);
  document.title=(data.display_name||u)+' | Link Bio';renderBio(app,data);
  countView(u).then(n=>{if(n!=null){const v=app.querySelector('.vw b');if(v)v.textContent=fmtViews(n)}});
}

async function cropImage(file,ratio,outW,radius){
  let bmp;try{bmp=await createImageBitmap(file)}catch{throw new Error('Could not read this image')}
  return new Promise(res=>{
    const w=Math.min(340,innerWidth-64),h=Math.round(w/ratio),dpr=window.devicePixelRatio||1;
    const base=Math.max(w/bmp.width,h/bmp.height);let z=1,ox=(w-bmp.width*base)/2,oy=(h-bmp.height*base)/2;
    const sc=()=>base*z,cl=()=>{ox=Math.min(0,Math.max(w-bmp.width*sc(),ox));oy=Math.min(0,Math.max(h-bmp.height*sc(),oy))};
    const ov=el('div','crop'),bx=el('div','cbx'),vp=el('div','cvp'),cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    cv.width=w*dpr;cv.height=h*dpr;cv.style.width=vp.style.width=w+'px';cv.style.height=vp.style.height=h+'px';vp.style.borderRadius=radius;
    ctx.imageSmoothingQuality='high';
    const draw=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.drawImage(bmp,ox,oy,bmp.width*sc(),bmp.height*sc())};
    cl();draw();vp.append(cv);
    let drag=null;
    cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!drag)return;ox=drag.ox+e.clientX-drag.x;oy=drag.oy+e.clientY-drag.y;cl();draw()};
    cv.onpointerup=cv.onpointercancel=()=>{drag=null};
    const zr=document.createElement('input');zr.type='range';zr.min='1';zr.max='4';zr.step='0.01';zr.value='1';zr.setAttribute('aria-label','Zoom');
    zr.oninput=()=>{const o=sc(),cx=(w/2-ox)/o,cy=(h/2-oy)/o;z=+zr.value;ox=w/2-cx*sc();oy=h/2-cy*sc();cl();draw()};
    const ok=el('button','btn pri','Use photo'),no=el('button','btn','Cancel'),row=el('div','row');ok.type='button';no.type='button';
    const done=v=>{ov.remove();res(v)};
    no.onclick=()=>done(null);
    ok.onclick=()=>{const k=outW/w,o=document.createElement('canvas');o.width=outW;o.height=Math.round(outW/ratio);
      const c2=o.getContext('2d');c2.imageSmoothingQuality='high';c2.drawImage(bmp,ox*k,oy*k,bmp.width*sc()*k,bmp.height*sc()*k);done(o)};
    row.append(no,ok);
    const zl=el('label','','Zoom');
    bx.append(el('h2','','Move and zoom'),el('p','','Drag the photo to choose what shows.'),vp,zl,zr,row);ov.append(bx);document.body.append(ov);
  });
}
async function uploadAvatar(e,kind){
  kind=kind==='cover'?'cover':'avatar';const col=kind==='cover'?'cover_url':'avatar_url';
  const f=e.target.files[0];if(!f)return;
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))return toast('Use a JPG, PNG or WebP image');
  if(f.size>2*1024*1024)return toast('Image must be under 2MB');
  try{
    const rad=kind==='cover'?'0':({round:'50%',rounded:'18px',square:'0'}[S.p.avatar_shape]||'50%');
    const c=await cropImage(f,kind==='cover'?8/5:1,kind==='cover'?1200:512,rad);
    if(!c){e.target.value='';return}
    const tb=t=>new Promise(r=>c.toBlob(r,t,.85));
    let blob=await tb('image/webp');if(!blob||blob.type!=='image/webp')blob=await tb('image/jpeg');
    if(!blob)throw new Error('Could not process the image');
    const path=S.p.id+'/'+kind+(blob.type==='image/webp'?'.webp':'.jpg');
    const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:blob.type,cacheControl:'3600'});
    if(up.error)throw up.error;
    const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
    const{error}=await sb.from('profiles').update({[col]:url}).eq('id',S.p.id);
    if(error)throw error;S.p[col]=url;preview();toast('Picture updated');
  }catch(err){toast('Upload failed: '+((err&&err.message)||'unknown error').slice(0,80))}
  e.target.value='';
}

function drawLinks(){
  const box=$('#ll');box.replaceChildren();$('#cnt').textContent=`(${S.links.length}/15)`;
  S.links.forEach((l,i)=>{
    const d=el('div','link'),t=el('input'),u=el('input'),ic=el('select'),ac=el('input');
    t.value=l.title;t.maxLength=80;t.placeholder='Title';u.value=l.url;u.placeholder='https://';
    Object.keys(ICONS).forEach(k=>{const o=el('option','',k);o.value=k;ic.append(o)});ic.value=l.icon||'link';
    ac.type='checkbox';ac.checked=l.is_active;ac.setAttribute('aria-label','Enabled');
    const save=async()=>{
      const url=safeUrl(u.value);if(!url||!t.value.trim())return toast('Enter a title and a valid URL');
      l.title=t.value.trim();l.url=url;l.icon=ic.value;l.is_active=ac.checked;u.value=url;
      const{error}=await sb.from('links').update({title:l.title,url:l.url,icon:l.icon,is_active:l.is_active}).eq('id',l.id);
      error?toast('Could not save link'):(preview(),toast('Saved'));
    };
    [t,u,ic,ac].forEach(x=>x.onchange=save);
    const mv=(dir)=>async()=>{const j=i+dir;if(j<0||j>=S.links.length)return;[S.links[i],S.links[j]]=[S.links[j],S.links[i]];
      await Promise.all(S.links.map((x,n)=>x.position!==n?(x.position=n,sb.from('links').update({position:n}).eq('id',x.id)):null));drawLinks();preview()};
    const btn=(n,f,lab)=>{const b=el('button','btn sm');b.type='button';b.setAttribute('aria-label',lab);b.append(icon(n));b.onclick=f;return b};
    const del=btn('trash-2',async()=>{const{error}=await sb.from('links').delete().eq('id',l.id);if(error)return toast('Could not delete');S.links.splice(i,1);drawLinks();preview()},'Delete');
    const r1=el('div','row'),r2=el('div','row');r1.append(t,u);r2.append(ic,el('label','','Enabled'),ac,btn('arrow-up',mv(-1),'Move up'),btn('arrow-down',mv(1),'Move down'),del);
    r2.querySelector('label').style.cssText='margin:0;flex:0 0 auto';d.append(r1,r2);box.append(d);
  });
  $('#al').disabled=S.links.length>=15;lucide.createIcons();
}

function drawSocials(){
  const box=$('#sl');box.replaceChildren();
  SOCIALS.forEach(pf=>{
    const cur=S.soc.find(s=>s.platform===pf),i=el('input');
    i.value=cur?(pf==='email'?cur.url.replace(/^mailto:/,''):cur.url):'';i.placeholder=pf==='email'?'name@example.com':'https://';
    const lab=el('label','',pf[0].toUpperCase()+pf.slice(1));
    i.onchange=async()=>{
      let v=i.value.trim();if(pf==='email'&&v&&!v.startsWith('mailto:'))v='mailto:'+v;
      const cu=S.soc.find(s=>s.platform===pf);
      if(!v){if(cu){await sb.from('social_links').delete().eq('id',cu.id);S.soc=S.soc.filter(s=>s!==cu)}preview();return}
      const url=safeUrl(v);if(!url)return toast('Enter a valid URL');
      const{data,error}=await sb.from('social_links').upsert({user_id:S.p.id,platform:pf,url},{onConflict:'user_id,platform'}).select().single();
      if(error)return toast('Could not save');S.soc=S.soc.filter(s=>s.platform!==pf).concat(data);preview();toast('Saved');
    };
    box.append(lab,i);
  });
}

async function uploadPromo(n,f){
  if(!f)return;
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))return toast('Use a JPG, PNG or WebP image');
  if(f.size>2*1024*1024)return toast('Image must be under 2MB');
  try{
    const c=await cropImage(f,1,800,'14px');if(!c)return;
    const tb=t=>new Promise(r=>c.toBlob(r,t,.85));
    let blob=await tb('image/webp');if(!blob||blob.type!=='image/webp')blob=await tb('image/jpeg');
    if(!blob)throw new Error('Could not process the image');
    const path=S.p.id+'/promo'+n+(blob.type==='image/webp'?'.webp':'.jpg');

function putAudio(path,file,ct,onp){

    if(!session)return rej(new Error('Please sign in again'));
    const x=new XMLHttpRequest();
    x.open('POST',CFG.url+'/storage/v1/object/music/'+path.split('/').map(encodeURIComponent).join('/'));
    x.setRequestHeader('Authorization','Bearer '+session.access_token);
    x.setRequestHeader('apikey',CFG.key);
    x.setRequestHeader('x-upsert','true');
    x.setRequestHeader('Content-Type',ct);

/* ---- Music helpers: YouTube, start/end (stored in the URL hash as #s=..&e=..), video -> MP3 ---- */

/* Wraps a hidden YouTube player so it behaves like an <audio> element */

/* Takes the sound out of a video file and turns it into a small MP3 (< 9MB) */
