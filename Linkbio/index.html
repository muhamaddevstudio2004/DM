<script>
/* ---- CONFIG: publishable (anon) key only. Never put service_role here. ---- */
const CFG={url:'https://eonhogpurbaxuswwwflm.supabase.co',key:'sb_publishable_BqtCxtW3NuCxVD9NLU6kAw_eA4dJRF5'};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{flowType:'pkce',persistSession:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),app=$('#app');
const ICONS={link:'link',website:'globe',instagram:'instagram',facebook:'facebook',youtube:'youtube',x:'x',tiktok:'music-2',whatsapp:'message-circle',telegram:'send',snapchat:'ghost',email:'mail',phone:'phone',shop:'shopping-bag',star:'star'};
const BRAND={whatsapp:'#25D366',snapchat:'#FFD400',instagram:'#E1306C',tiktok:'#25F4EE',telegram:'#2AABEE',youtube:'#FF2D2D',facebook:'#1877F2',x:'#A1A1AA',email:'#EA4335'};
const SOCIALS=['instagram','tiktok','facebook','whatsapp','telegram','youtube','snapchat','x','website','email'];
const THEMES={midnight:['#0a1124','#3b82f6','#e5e7eb'],light:['#ffffff','#111111','#111111'],dark:['#111111','#ffffff','#ffffff'],stone:['#f4f4f5','#27272a','#18181b']};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const icon=n=>{const i=document.createElement('i');i.dataset.lucide=ICONS[n]||'link';return i};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function safeUrl(u){try{const x=new URL(String(u).trim());return['http:','https:','mailto:','tel:'].includes(x.protocol)?x.href:null}catch{return null}}
const hex=(c,d)=>/^#[0-9a-f]{6}$/i.test(c)?c:d;
const lum=c=>{const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};

/* ---- Shared renderer: public page and live preview ---- */
function subOf(u){
  try{const x=new URL(u);if(x.protocol==='mailto:'||x.protocol==='tel:')return decodeURIComponent(x.pathname);
    const h=x.hostname.replace(/^www\./,''),seg=x.pathname.split('/').filter(Boolean)[0]||'';
    if(h==='wa.me'||h==='api.whatsapp.com')return seg&&/^\d+$/.test(seg)?'+'+seg:'WhatsApp';
    if(['instagram.com','tiktok.com','t.me','x.com','twitter.com','snapchat.com','youtube.com'].includes(h)&&/^@?[\w.\-]{2,40}$/.test(seg))return '@'+seg.replace(/^@/,'');
    const t=h+(seg?'/'+seg:'');return t.length>32?t.slice(0,31)+'\u2026':t}catch{return''}}
function confirmOpen(root,u,title,color){
  const old=root.querySelector('.mod');if(old)old.remove();
  const m=el('div','mod'),bx=el('div','bx'),row=el('div','mr'),no=el('button','mb','Cancel'),go=el('button','mb','Open');
  const kd=e=>{if(e.key==='Escape')close()};
  const close=()=>{m.remove();document.removeEventListener('keydown',kd)};
  bx.style.setProperty('--b',color);
  go.style.cssText=`background:${color};border-color:${color};color:${lum(hex(color,'#111111'))>.55?'#111':'#fff'}`;
  m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Open this link?');
  no.type='button';go.type='button';no.onclick=close;
  go.onclick=()=>{close();if(/^(mailto:|tel:)/i.test(u))location.href=u;else window.open(u,'_blank','noopener,noreferrer')};
  m.onclick=e=>{if(e.target===m)close()};
  document.addEventListener('keydown',kd);
  row.append(no,go);bx.append(el('h3','','Open this link?'),el('div','mt',title),el('div','mu',subOf(u)),row);m.append(bx);root.append(m);no.focus();
}
function renderBio(root,d,ed){
  const bg=hex(d.background_color,'#ffffff'),bt=hex(d.button_color,'#111111'),tx=hex(d.text_color,'#111111');
  const dk=lum(bg)<.5;root.className='bio'+(dk?' dk':'')+(ed?' ed':'');root.style.cssText=`--bg:${bg};--bt:${bt};--tx:${tx};--glow:${dk?'#3b6fd8':'#a9bff0'};--card:${dk?`color-mix(in srgb,${bg} 90%,#ffffff)`:'#ffffff'}`;
  const inn=el('div','in'),shape=['round','rounded','square'].includes(d.avatar_shape)?d.avatar_shape:'round';
  const cvu=d.cover_url&&safeUrl(d.cover_url);let cvEl=null;
  if(cvu||ed){cvEl=el('div','cv'+(cvu?'':' ph'));
    if(cvu){const im=el('img');im.src=cvu;im.alt='';cvEl.append(im)}else cvEl.append(el('span','','Tap to add a cover'));
    if(ed){cvEl.style.cursor='pointer';cvEl.setAttribute('role','button');cvEl.setAttribute('aria-label','Change cover');cvEl.onclick=ed.cover}
    inn.classList.add('hascv')}
  if(d.avatar_url&&safeUrl(d.avatar_url)){const im=el('img','av '+shape);im.src=safeUrl(d.avatar_url);im.alt=ed?'Change picture':'';if(ed){im.style.cursor='pointer';im.onclick=ed.avatar}inn.append(im)}
  else if(ed){const ph=el('div','av ph '+shape,((d.display_name||'?').trim()[0]||'?').toUpperCase());ph.style.fontSize='32px';ph.style.fontWeight='500';ph.setAttribute('role','button');ph.setAttribute('aria-label','Add picture');ph.onclick=ed.avatar;inn.append(ph)}
  const txt=(tag,val,ph,field,max)=>{
    const n=el(tag,'',val||'');
    if(ed){try{n.contentEditable='plaintext-only'}catch{n.contentEditable='true'}
      n.dataset.ph=ph;n.spellcheck=false;
      if(tag==='h1')n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();n.blur()}};
      n.onblur=()=>ed.text(field,n.textContent.trim().slice(0,max))}
    return n};
  if(ed||d.display_name){const nm=el('div','nm');nm.dir='auto';nm.append(txt('h1',d.display_name,'Your name','display_name',60));
    nm.insertAdjacentHTML('beforeend','<svg class="vb" viewBox="0 0 24 24" role="img" aria-label="Verified"><rect x="4.5" y="4.5" width="15" height="15" rx="4" fill="#1d9bf0"/><rect x="4.5" y="4.5" width="15" height="15" rx="4" fill="#1d9bf0" transform="rotate(45 12 12)"/><path d="M8.2 12.4l2.6 2.6 5-5.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');inn.append(nm)}
  if(ed||d.bio)inn.append(txt('p',d.bio,'Write a short bio','bio',280));

  if((d.links||[]).length)inn.append(el('div','sec','Links'));
  (d.links||[]).forEach((l,i)=>{const u=safeUrl(l.url);if(!u&&!ed)return;
    const a=el('a','lk '+(['pill','rounded','square','outline'].includes(d.button_style)?d.button_style:'rounded'));
    const rtl=/^[^A-Za-z\u0590-\u08FF]*[\u0590-\u08FF]/.test(l.title||'');a.dir=rtl?'rtl':'ltr';
    if(ed){a.href='#';a.onclick=e=>{e.preventDefault();ed.link(l)};if(l.is_active===false)a.style.opacity='.45'}
    else{a.href=u;a.rel='noopener noreferrer';a.onclick=e=>{e.preventDefault();confirmOpen(root,u,l.title,BRAND[l.icon]||bt)}}
    a.style.setProperty('--i',i);if(BRAND[l.icon])a.style.setProperty('--b',BRAND[l.icon]);
    const ic=el('span','ic');ic.append(icon(l.icon));
    const tx2=el('span','tx');tx2.append(el('span','t',l.title));const subt=subOf(u||l.url);if(subt)tx2.append(el('span','s',subt));
    const ch=document.createElement('i');ch.dataset.lucide=rtl?'chevron-left':'chevron-right';ch.className='ch';
    a.append(ic,tx2,ch);inn.append(a)});
  if(!ed)inn.append(el('div','ft','Made with Link Bio Builder'));
  root.replaceChildren(...(cvEl?[cvEl,inn]:[inn]));lucide.createIcons();
}

/* ---- Router: #username = public page, empty hash = dashboard ---- */
const loading=()=>app.replaceChildren(Object.assign(el('div','center'),{innerHTML:'<div class="spin"></div>'}));
async function route(){
  delete document.body.dataset.v;
  const u=decodeURIComponent(location.hash.slice(1)).trim();
  if(u)return showPublic(u);
  const{data:{session}}=await sb.auth.getSession();
  if(location.search.includes('code='))history.replaceState(null,'',location.pathname);
  session?showDash(session.user):showLogin();
}
addEventListener('hashchange',route);
sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')route()});

async function showPublic(u){
  loading();
  const{data,error}=await sb.rpc('get_public_profile',{uname:u});

async function cropImage(file,ratio,outW,radius){
  let bmp;try{bmp=await createImageBitmap(file)}catch{throw new Error('Could not read this image')}
  return new Promise(res=>{
    const w=Math.min(340,innerWidth-64),h=Math.round(w/ratio),dpr=window.devicePixelRatio||1;
    const base=Math.max(w/bmp.width,h/bmp.height);let z=1,ox=(w-bmp.width*base)/2,oy=(h-bmp.height*base)/2;
    const sc=()=>base*z,cl=()=>{ox=Math.min(0,Math.max(w-bmp.width*sc(),ox));oy=Math.min(0,Math.max(h-bmp.height*sc(),oy))};
    const ov=el('div','crop'),bx=el('div','cbx'),vp=el('div','cvp'),cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    cv.width=w*dpr;cv.height=h*dpr;cv.style.width=vp.style.width=w+'px';cv.style.height=vp.style.height=h+'px';vp.style.borderRadius=radius;
    ctx.imageSmoothingQuality='high';
    const draw=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.drawImage(bmp,ox,oy,bmp.width*sc(),bmp.height*sc())};
    cl();draw();vp.append(cv);
    let drag=null;
    cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!drag)return;ox=drag.ox+e.clientX-drag.x;oy=drag.oy+e.clientY-drag.y;cl();draw()};
    cv.onpointerup=cv.onpointercancel=()=>{drag=null};
    const zr=document.createElement('input');zr.type='range';zr.min='1';zr.max='4';zr.step='0.01';zr.value='1';zr.setAttribute('aria-label','Zoom');
    zr.oninput=()=>{const o=sc(),cx=(w/2-ox)/o,cy=(h/2-oy)/o;z=+zr.value;ox=w/2-cx*sc();oy=h/2-cy*sc();cl();draw()};
    const ok=el('button','btn pri','Use photo'),no=el('button','btn','Cancel'),row=el('div','row');ok.type='button';no.type='button';
    const done=v=>{ov.remove();res(v)};
    no.onclick=()=>done(null);
    ok.onclick=()=>{const k=outW/w,o=document.createElement('canvas');o.width=outW;o.height=Math.round(outW/ratio);
      const c2=o.getContext('2d');c2.imageSmoothingQuality='high';c2.drawImage(bmp,ox*k,oy*k,bmp.width*sc()*k,bmp.height*sc()*k);done(o)};
    row.append(no,ok);
    const zl=el('label','','Zoom');
    bx.append(el('h2','','Move and zoom'),el('p','','Drag the photo to choose what shows.'),vp,zl,zr,row);ov.append(bx);document.body.append(ov);
  });
}
async function uploadAvatar(e,kind){
  kind=kind==='cover'?'cover':'avatar';const col=kind==='cover'?'cover_url':'avatar_url';
  const f=e.target.files[0];if(!f)return;
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))return toast('Use a JPG, PNG or WebP image');
  if(f.size>2*1024*1024)return toast('Image must be under 2MB');
  try{
    const rad=kind==='cover'?'0':({round:'50%',rounded:'22px',square:'0'}[S.p.avatar_shape]||'50%');
    const c=await cropImage(f,kind==='cover'?5/2:1,kind==='cover'?1200:512,rad);
    if(!c){e.target.value='';return}
    const tb=t=>new Promise(r=>c.toBlob(r,t,.85));
    let blob=await tb('image/webp');if(!blob||blob.type!=='image/webp')blob=await tb('image/jpeg');
    if(!blob)throw new Error('Could not process the image');
    const path=S.p.id+'/'+kind+(blob.type==='image/webp'?'.webp':'.jpg');
    const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:blob.type,cacheControl:'3600'});
    if(up.error)throw up.error;
    const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
    const{error}=await sb.from('profiles').update({[col]:url}).eq('id',S.p.id);
    if(error)throw error;S.p[col]=url;preview();toast('Picture updated');
  }catch(err){toast('Upload failed: '+((err&&err.message)||'unknown error').slice(0,80))}
  e.target.value='';
}

    ac.type='checkbox';ac.checked=l.is_active;ac.setAttribute('aria-label','Enabled');

      const url=safeUrl(u.value);if(!url||!t.value.trim())return toast('Enter a title and a valid URL');
      l.title=t.value.trim();l.url=url;l.icon=ic.value;l.is_active=ac.checked;u.value=url;

      error?toast('Could not save link'):(preview(),toast('Saved'));
    };
    [t,u,ic,ac].forEach(x=>x.onchange=save);
    const mv=(dir)=>async()=>{const j=i+dir;if(j<0||j>=S.links.length)return;[S.links[i],S.links[j]]=[S.links[j],S.links[i]];
      await Promise.all(S.links.map((x,n)=>x.position!==n?(x.position=n,sb.from('links').update({position:n}).eq('id',x.id)):null));drawLinks();preview()};

    const del=btn('trash-2',async()=>{const{error}=await sb.from('links').delete().eq('id',l.id);if(error)return toast('Could not delete');S.links.splice(i,1);drawLinks();preview()},'Delete');
    const r1=el('div','row'),r2=el('div','row');r1.append(t,u);r2.append(ic,el('label','','Enabled'),ac,btn('arrow-up',mv(-1),'Move up'),btn('arrow-down',mv(1),'Move down'),del);
