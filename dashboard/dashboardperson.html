<!DOCTYPE html>
<html lang="ckb" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevMuhamad.com — Invoice Generator</title>
<!-- Optional web fonts. The app works fully offline: if these cannot load, system fonts are used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1. DESIGN TOKENS  (edit colors here)
   ===================================================================== */
:root{
  --navy:#0f1f3d; --navy-2:#1b2f57; --charcoal:#2b3140; --gold:#b8933f; --gold-soft:#f4ecd6;
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f9fafc; --border:#e5e8ef; --border-strong:#d3d8e3;
  --text:#161b29; --muted:#6a7389; --primary:#0f1f3d; --primary-contrast:#ffffff;
  --accent:#b8933f; --danger:#c8372d; --success:#1f8a5b;
  --shadow-sm:0 1px 2px rgba(15,31,61,.06);
  --shadow:0 6px 24px rgba(15,31,61,.08);
  --shadow-lg:0 18px 50px rgba(15,31,61,.14);
  --radius:14px; --radius-sm:10px;
  --font:'Inter','Noto Sans Arabic','Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0b111d; --surface:#121a2a; --surface-2:#172136; --border:#223048; --border-strong:#2d3d5a;
  --text:#e9edf6; --muted:#93a0ba; --primary:#d9b45c; --primary-contrast:#101828;
  --accent:#d9b45c; --gold-soft:#2a2512;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.hidden{display:none !important}

/* =====================================================================
   2. APP SHELL
   ===================================================================== */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--navy),var(--navy-2));display:grid;place-items:center;position:relative;box-shadow:var(--shadow-sm)}
.logo-mark svg{width:22px;height:22px}
.logo-mark::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.2px;direction:ltr}
.brand-name span{color:var(--accent)}
.top-actions{display:flex;gap:8px}
.icon-btn{height:40px;min-width:40px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;transition:.18s;box-shadow:var(--shadow-sm)}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.container{max-width:1280px;margin:0 auto;padding:28px 20px 60px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 20px;border-radius:12px;font-weight:600;font-size:14px;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--primary-contrast);box-shadow:0 6px 16px rgba(15,31,61,.22)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(15,31,61,.28)}
.btn-ghost{background:var(--surface);border-color:var(--border-strong)}
.btn-ghost:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(0)}

/* =====================================================================
   3. HOME / DASHBOARD
   ===================================================================== */
.home{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:calc(100vh - 170px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--gold-soft);color:var(--accent);font-size:12.5px;font-weight:600;margin-bottom:18px;direction:ltr}
.home h1{font-size:clamp(32px,4.6vw,52px);line-height:1.2;letter-spacing:-.8px;font-weight:700;margin-bottom:14px}
.home p.lead{color:var(--muted);font-size:16px;max-width:480px;margin-bottom:28px}
.cta-card{display:flex;align-items:center;gap:18px;width:100%;max-width:480px;padding:22px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;text-align:start;box-shadow:var(--shadow-lg);transition:.2s;position:relative;overflow:hidden}
.cta-card::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(184,147,63,.45),transparent 70%)}
.cta-card:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(15,31,61,.3)}
.cta-ico{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);flex:none}
.cta-ico svg{width:26px;height:26px;color:#e8c875}
.cta-card b{display:block;font-size:19px;margin-bottom:2px}
.cta-card small{opacity:.75;font-size:13px}
.cta-arrow{margin-inline-start:auto;opacity:.8}
[dir="rtl"] .cta-arrow{transform:scaleX(-1)}
.home-preview{display:flex;justify-content:center}
.home-preview .paper-wrap{width:min(100%,400px);box-shadow:var(--shadow-lg);border-radius:6px;transform:rotate(-1.2deg);transition:.3s}
.home-preview .paper-wrap:hover{transform:rotate(0) translateY(-4px)}

/* =====================================================================
   4. FORM VIEW
   ===================================================================== */
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:24px;letter-spacing:-.3px}
.page-head .rno{margin-inline-start:auto;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:99px;direction:ltr}
.page-head .rno b{color:var(--text);font-weight:600}
.workspace{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:28px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.card-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:18px}
.card-title .ct-ico{width:32px;height:32px;border-radius:9px;background:var(--gold-soft);color:var(--accent);display:grid;place-items:center}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px}
.field label .opt{font-weight:500;color:var(--muted);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);padding:1px 8px;border-radius:99px}
.control{position:relative;display:flex;align-items:center}
.control > svg.i{position:absolute;inset-inline-start:13px;color:var(--muted);pointer-events:none}
.control input,.control textarea,.control select{width:100%;height:46px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface-2);padding:0 14px;padding-inline-start:42px;outline:none;transition:.16s;font-size:14.5px}
.control textarea{height:96px;padding-top:12px;resize:vertical;line-height:1.6}
.control textarea ~ svg.i{top:14px}
.control.no-ico input{padding-inline-start:14px}
.control input:focus,.control textarea:focus,.control select:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.control .suffix{position:absolute;inset-inline-end:13px;font-size:12px;font-weight:700;color:var(--muted);direction:ltr;pointer-events:none}
.control.has-suffix input{padding-inline-end:52px}
.ltr-input{direction:ltr;text-align:start}
[dir="rtl"] .ltr-input{text-align:right}
.field.err input,.field.err textarea{border-color:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 14%,transparent)}
.msg{display:none;color:var(--danger);font-size:12px;margin-top:6px;font-weight:500}
.field.err .msg{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-top:8px}
.seg button{padding:7px 8px;font-size:11.5px;font-weight:600;border-radius:8px;color:var(--muted);transition:.15s;line-height:1.3}
.seg button.on{background:var(--primary);color:var(--primary-contrast);box-shadow:var(--shadow-sm)}
.fee-block{padding:14px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);margin-bottom:16px;background:var(--surface-2)}
.fee-block .field{margin-bottom:0}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

/* Sticky preview */
.preview-col{position:sticky;top:84px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.toolbar .btn{height:42px;padding:0 16px;font-size:13.5px}
.preview-stage{background:linear-gradient(180deg,var(--surface-2),var(--bg));border:1px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;justify-content:center}
.preview-stage .paper-wrap{width:100%;max-width:640px;box-shadow:var(--shadow);border-radius:4px}
.preview-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(31,138,91,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,138,91,0)}100%{box-shadow:0 0 0 0 rgba(31,138,91,0)}}

/* Toasts */
#toasts{position:fixed;bottom:22px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:100;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--success);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;animation:tin .28s ease;max-width:420px}
.toast.error{border-inline-start-color:var(--danger)}
.toast.error svg{color:var(--danger)}
.toast.success svg{color:var(--success)}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}

/* =====================================================================
   5. THE RECEIPT  (A4 — always light "paper", independent of theme)
   ===================================================================== */
.paper-wrap{position:relative;overflow:hidden;background:#fff;direction:ltr}
.receipt{
  position:absolute;top:0;left:0;transform-origin:top left;
  width:210mm;height:297mm;background:#fff;color:#1d2433;
  font-family:'Inter','Noto Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  font-size:13px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.receipt *{box-sizing:border-box}
.rc-top{height:9px;background:linear-gradient(90deg,#0f1f3d 0 72%,#b8933f 72% 100%)}
.rc-body{padding:12mm 16mm 0;flex:1;display:flex;flex-direction:column;min-height:0}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.rc-brand{display:flex;gap:14px;align-items:center}
/* LOGO PLACEHOLDER — replace the <svg> inside .rc-logo with <img src="logo.png"> later */
.rc-logo{width:58px;height:58px;border-radius:15px;background:linear-gradient(145deg,#0f1f3d,#1b2f57);display:grid;place-items:center;position:relative;flex:none}
.rc-logo svg{width:32px;height:32px}
.rc-logo::after{content:"";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#b8933f;border:3px solid #fff}
.rc-brand h3{font-size:22px;letter-spacing:-.4px;color:#0f1f3d;font-weight:700;line-height:1.15}
.rc-brand h3 span{color:#b8933f}
.rc-brand p{font-size:11px;color:#6a7389;letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.rc-title{text-align:right}
.rc-title h2{font-size:25px;letter-spacing:2px;color:#0f1f3d;font-weight:700;line-height:1.1}
.rc-title h2 em{font-style:normal;color:#b8933f}
.rc-title small{display:block;font-size:11px;letter-spacing:1.6px;color:#6a7389;margin-top:5px;text-transform:uppercase}
.rc-title .ku-t{font-size:13px;letter-spacing:0;color:#2b3140;margin-top:2px;font-weight:600}
.rc-rule{height:1px;background:#e3e6ee;margin:7mm 0 6mm;position:relative}
.rc-rule::after{content:"";position:absolute;left:0;top:-1px;width:56px;height:3px;background:#b8933f;border-radius:2px}
.rc-meta{display:grid;grid-template-columns:1fr 1fr;gap:10mm}
.rc-box h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#b8933f;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.rc-box h4 i{font-style:normal;font-weight:600;letter-spacing:0;color:#9aa2b5;font-size:11px;text-transform:none}
.rc-box .big{font-size:16px;font-weight:600;color:#0f1f3d;word-break:break-word;line-height:1.35}
.rc-box .sub{color:#4a5368;margin-top:3px;font-size:13px}
.rc-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px}
.rc-kv dt{color:#7b849a}
.rc-kv dd{font-weight:600;color:#0f1f3d;text-align:right}
.rc-kv dd.mono{font-variant-numeric:tabular-nums;letter-spacing:.3px}
.rc-table{width:100%;border-collapse:collapse;margin-top:7mm}
.rc-table th{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:#6a7389;text-align:left;padding:10px 12px;background:#f5f6fa;border-top:1px solid #e3e6ee;border-bottom:1px solid #e3e6ee;font-weight:700}
.rc-table th small{font-weight:600;letter-spacing:0;color:#9aa2b5;text-transform:none;margin-left:6px;font-size:11px}
.rc-table th:last-child,.rc-table td:last-child{text-align:right;white-space:nowrap}
.rc-table td{padding:11px 12px;border-bottom:1px solid #edeff5;vertical-align:top}
.rc-table td .it{font-weight:600;color:#0f1f3d;word-break:break-word}
.rc-table td .id{font-size:11.5px;color:#7b849a;margin-top:1px}
.rc-table td.amt{font-weight:600;font-variant-numeric:tabular-nums;color:#1d2433}
.rc-totals{margin-top:5mm;display:flex;justify-content:flex-end}
.rc-total-box{width:60%;}
.rc-line{display:flex;justify-content:space-between;padding:6px 12px;font-size:12.5px;color:#4a5368}
.rc-line b{color:#1d2433;font-variant-numeric:tabular-nums}
.rc-grand{margin-top:8px;border-radius:12px;background:linear-gradient(135deg,#0f1f3d,#1b2f57);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative;overflow:hidden}
.rc-grand::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#b8933f}
.rc-grand .lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;line-height:1.3}
.rc-grand .lbl b{display:block;font-size:13.5px;letter-spacing:.3px;opacity:1;color:#e8c875;text-transform:none}
.rc-grand .val{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
.rc-grand .val small{font-size:12px;font-weight:600;color:#e8c875;margin-left:5px;letter-spacing:.5px}
.rc-recur{margin-top:6mm;border:1px solid #ecdfba;background:#fbf7ea;border-radius:12px;padding:12px 16px}
.rc-recur h5{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:#9a7a2a;font-weight:700;margin-bottom:6px}
.rc-recur h5 i{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;margin-left:6px}
.rc-recur .rr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#4a5368}
.rc-recur .rr b{color:#1d2433;font-variant-numeric:tabular-nums}
.rc-recur p{font-size:11px;color:#8b7a4b;margin-top:4px}
.rc-notes{margin-top:6mm}
.rc-notes h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#b8933f;font-weight:700;margin-bottom:6px}
.rc-notes h4 i{font-style:normal;font-weight:600;letter-spacing:0;color:#9aa2b5;text-transform:none;font-size:11px;margin-left:6px}
.rc-notes div{color:#4a5368;white-space:pre-line;word-break:break-word;font-size:12.5px;max-height:28mm;overflow:hidden}
.rc-foot{margin:auto -16mm 0;padding:7mm 16mm 8mm;background:#f5f6fa;border-top:1px solid #e3e6ee;text-align:center}
.rc-foot b{display:block;font-size:14px;color:#0f1f3d;font-weight:600}
.rc-foot span{display:block;font-size:11px;color:#b8933f;letter-spacing:1.6px;text-transform:uppercase;margin-top:3px;font-weight:600}
.rc-foot .ku-f{font-size:11.5px;color:#7b849a;letter-spacing:0;text-transform:none;margin-top:5px;font-weight:500}

/* =====================================================================
   6. RESPONSIVE
   ===================================================================== */
@media (max-width:1020px){
  .workspace{grid-template-columns:1fr}
  .preview-col{position:static}
  .home{grid-template-columns:1fr;min-height:auto;gap:36px;padding-top:10px}
  .home-preview{order:2}
}
@media (max-width:560px){
  .container{padding:20px 14px 50px}
  .row2{grid-template-columns:1fr}
  .toolbar .btn{flex:1 1 calc(50% - 10px);padding:0 10px}
  .brand-name{font-size:15px}
  .icon-btn .txt{display:none}
  .preview-stage{padding:10px}
  .card{padding:18px}
}

/* =====================================================================
   7. PRINT — only the receipt, A4 portrait
   ===================================================================== */
#printRoot{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff !important;width:210mm;height:297mm;margin:0;padding:0;overflow:hidden}
  body > *:not(#printRoot){display:none !important}
  #printRoot{display:block !important}
  #printRoot .receipt{position:relative !important;transform:none !important;width:210mm;height:296mm;box-shadow:none;margin:0;page-break-after:avoid;page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
}
</style>
</head>

     ICON SPRITE (Lucide-style, inline SVG — no external files)

  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>

<script>
/* =====================================================================
   DevMuhamad.com — Invoice Generator
   Pure vanilla JS. Nothing is saved: no receipts, no customer data.
   (Only the light/dark + language preference may be remembered.)
   ===================================================================== */
(function(){
'use strict';

/* ---------------------------- CONFIG ---------------------------- */
const CONFIG = {
  brand: 'DevMuhamad',
  brandSuffix: '.com',
  tagline: 'Digital Systems & Software Solutions',
  currency: 'IQD',
  receiptPrefix: 'DM'
};

/* ---------------------------- i18n ---------------------------- */
const T = {
  ku:{
    homeTitle:'دروستکەری فاکتور',
    homeLead:'وەصڵ و فاکتۆری پڕۆفیشناڵ بۆ سیستەم و سۆفتوێرەکانت دروست بکە، چاپی بکە یان وەک PDF هەڵیبگرە.',
    createNew:'دروستکردنی وەصڵی نوێ', ctaSub:'تەنها چەند چرکەیەک',
    receiptNo:'ژمارەی وەصڵ',
    secCustomer:'زانیاری کڕیار', customer:'ناوی کڕیار', phone:'ژمارەی تەلەفۆنی کڕیار', date:'بەرواری وەصڵ',
    secSystem:'زانیاری سیستەم', system:'ناوی سیستەم / بەرهەم', price:'نرخی سیستەم (دینار)',
    annual:'کرێی ساڵانەی سێرڤەر', monthly:'کرێی مانگانە', details:'وردەکاری زیاتر / وەسف', optional:'ئارەزوومەندانە',
    modeNow:'بخرێتە کۆی گشتی', modeRec:'بە جیا پیشان بدە',
    secStaff:'زانیاری کارمەند', staff:'ناوی کارمەند',
    phCustomer:'نموونە: ئاری مەحمود', phSystem:'نموونە: سیستەمی بەڕێوەبردنی نەخۆشخانە',
    phDetails:'هەر تێبینییەک یان وردەکارییەک بۆ وەصڵەکە...', phStaff:'ناوی کارمەندی فرۆشتن',
    print:'چاپکردنی وەصڵ', pdf:'هەڵگرتن وەک PDF', copy:'لەبەرگرتنەوە', newReceipt:'وەصڵی نوێ',
    livePreview:'پێشبینینی ڕاستەوخۆ',
    reqMsg:'ئەم خانەیە پێویستە', phoneMsg:'ژمارەی تەلەفۆنێکی دروست بنووسە', priceMsg:'نرخێکی گەورەتر لە سفر بنووسە',
    toastFix:'تکایە خانە پێویستەکان پڕ بکەرەوە', toastPrint:'وەصڵەکە ئامادەیە بۆ چاپکردن',
    toastPdf:'لە پەنجەرەی چاپکردن، «Save as PDF» هەڵبژێرە', toastCopy:'وردەکارییەکانی وەصڵ لەبەرگیرانەوە',
    toastCopyFail:'لەبەرگرتنەوە سەرکەوتوو نەبوو', toastNew:'وەصڵی نوێ ئامادەکرا', langName:'English'
  },
  en:{
    homeTitle:'Invoice Generator',
    homeLead:'Create professional invoices and sales receipts for your systems and software, then print or save them as PDF.',
    createNew:'Create New Receipt', ctaSub:'Takes only a few seconds',
    receiptNo:'Receipt No.',
    secCustomer:'Customer Information', customer:'Customer Name', phone:'Customer Phone Number', date:'Receipt Date',
    secSystem:'System Information', system:'System / Product Name', price:'System Price (IQD)',
    annual:'Annual Server Fee', monthly:'Monthly Fee', details:'Additional Details / Description', optional:'Optional',
    modeNow:'Include in total', modeRec:'Show separately',
    secStaff:'Staff Information', staff:'Staff Name',
    phCustomer:'e.g. Ari Mahmood', phSystem:'e.g. Hospital Management System',
    phDetails:'Any notes or details to appear on the receipt...', phStaff:'Name of the sales staff',
    print:'Print Receipt', pdf:'Save as PDF', copy:'Copy Details', newReceipt:'New Receipt',
    livePreview:'Live Preview',
    reqMsg:'This field is required', phoneMsg:'Enter a valid phone number', priceMsg:'Enter a price greater than zero',
    toastFix:'Please fill in the required fields', toastPrint:'Receipt is ready to print',
    toastPdf:'In the print dialog, choose “Save as PDF”', toastCopy:'Receipt details copied',
    toastCopyFail:'Could not copy to clipboard', toastNew:'New receipt ready', langName:'کوردی'
  }
};
let lang = 'ku';
const t = k => (T[lang] && T[lang][k]) || k;

/* ---------------------------- HELPERS ---------------------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLatinDigits = s => String(s)
  .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
  .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0);
const toNum = s => parseInt(toLatinDigits(s).replace(/[^\d]/g, ''), 10) || 0;
const fmt = n => n.toLocaleString('en-US');
const money = n => fmt(n) + ' ' + CONFIG.currency;
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function prettyDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function newReceiptNo(){
  const d = todayISO().replace(/-/g,'');
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = new Uint32Array(4);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  let r = ''; buf.forEach(v => r += chars[v % chars.length]);
  return `${CONFIG.receiptPrefix}-${d}-${r}`;
}
let receiptNo = newReceiptNo();
const mode = { annual:'now', monthly:'recurring' };

/* ---------------------------- DATA + CALC ---------------------------- */
function readData(){
  const d = {
    no: receiptNo,
    date: $('#date').value,
    customer: $('#customer').value.trim(),
    phone: toLatinDigits($('#phone').value.trim()),
    system: $('#system').value.trim(),
    price: toNum($('#price').value),
    annual: toNum($('#annual').value),
    monthly: toNum($('#monthly').value),
    annualMode: mode.annual,
    monthlyMode: mode.monthly,
    details: $('#details').value.trim(),
    staff: $('#staff').value.trim()
  };
  d.annualNow  = d.annual  > 0 && d.annualMode  === 'now';
  d.monthlyNow = d.monthly > 0 && d.monthlyMode === 'now';
  d.total = d.price + (d.annualNow ? d.annual : 0) + (d.monthlyNow ? d.monthly : 0);
  return d;
}

/* ---------------------------- RECEIPT TEMPLATE ---------------------------- */
const LOGO_SVG = '<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 9 4 16l7 7"/><path d="m21 9 7 7-7 7"/><path d="m18 7-4 18" stroke="#e8c875"/></svg>';

function receiptHTML(d){
  const rows = [];
  rows.push(`<tr><td><div class="it" dir="auto">${esc(d.system || '—')}</div></td><td class="amt">${money(d.price)}</td></tr>`);
  if(d.annualNow)  rows.push(`<tr><td><div class="it">Annual Server Fee</div></td><td class="amt">${money(d.annual)}</td></tr>`);
  if(d.monthlyNow) rows.push(`<tr><td><div class="it">Monthly Fee</div></td><td class="amt">${money(d.monthly)}</td></tr>`);

  // calculation breakdown (only when more than one item is charged now)
  let lines = '';
  if(d.annualNow || d.monthlyNow){
    lines += `<div class="rc-line"><span>System Price</span><b>${money(d.price)}</b></div>`;
    if(d.annualNow)  lines += `<div class="rc-line"><span>+ Annual Server Fee</span><b>${money(d.annual)}</b></div>`;
    if(d.monthlyNow) lines += `<div class="rc-line"><span>+ Monthly Fee</span><b>${money(d.monthly)}</b></div>`;
  }

  const recurring = [];
  if(d.annual  > 0 && !d.annualNow)  recurring.push(`<div class="rr"><span>Annual Server Fee <span style="color:#9aa2b5">· per year</span></span><b>${money(d.annual)}</b></div>`);
  if(d.monthly > 0 && !d.monthlyNow) recurring.push(`<div class="rr"><span>Monthly Fee <span style="color:#9aa2b5">· per month</span></span><b>${money(d.monthly)}</b></div>`);

  return `
  <div class="receipt">
    <div class="rc-top"></div>
    <div class="rc-body">
      <div class="rc-head">
        <div class="rc-brand">
          <div class="rc-logo">${LOGO_SVG}</div>
          <div>
            <h3>${CONFIG.brand}<span>${CONFIG.brandSuffix}</span></h3>
            <p>${CONFIG.tagline}</p>
          </div>
        </div>
        <div class="rc-title">
          <h2>INVOICE<em> /</em></h2>
          <small>Sales Receipt</small>
          <div class="ku-t">وەصڵی فرۆشتن</div>
        </div>
      </div>

      <div class="rc-rule"></div>

      <div class="rc-meta">
        <div class="rc-box">
          <h4>Billed To <i>بۆ</i></h4>
          <div class="big" dir="auto">${esc(d.customer || '—')}</div>
          <div class="sub" dir="ltr">${esc(d.phone || '—')}</div>
        </div>
        <div class="rc-box">
          <h4>Receipt Details <i>وردەکاری</i></h4>
          <dl class="rc-kv">
            <dt>Receipt No.</dt><dd class="mono">${esc(d.no)}</dd>
            <dt>Date</dt><dd>${esc(prettyDate(d.date))}</dd>
            ${d.staff ? `<dt>Staff</dt><dd dir="auto">${esc(d.staff)}</dd>` : ''}
          </dl>
        </div>
      </div>

      <table class="rc-table">
        <thead><tr><th>Description <small>وەسف</small></th><th>Amount <small>بڕ</small></th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>

      <div class="rc-totals">
        <div class="rc-total-box">
          ${lines}
          <div class="rc-grand">
            <div class="lbl">${(d.annualNow||d.monthlyNow) ? 'Total Due Now' : 'Total Amount'}<b>کۆی گشتی</b></div>
            <div class="val">${fmt(d.total)}<small>${CONFIG.currency}</small></div>
          </div>
        </div>
      </div>

      ${recurring.length ? `
      <div class="rc-recur">
        <h5>Recurring Fees <i>· not included in the total above</i></h5>
        ${recurring.join('')}
      </div>` : ''}

      ${d.details ? `
      <div class="rc-notes">
        <h4>Additional Details <i>وردەکاری زیاتر</i></h4>
        <div dir="auto">${esc(d.details)}</div>
      </div>` : ''}

      <div class="rc-foot">
        <b>Thank you for choosing DevMuhamad.com</b>
        <span>${CONFIG.tagline}</span>
      </div>
    </div>
  </div>`;
}

/* ---------------------------- SCALING A4 INTO CONTAINERS ---------------------------- */
function fit(wrap){
  const r = $('.receipt', wrap);
  if(!r) return;
  r.style.transform = 'none';
  const w = wrap.clientWidth;
  if(!w) return;
  const s = w / r.offsetWidth;
  r.style.transform = `scale(${s})`;
  wrap.style.height = (r.offsetHeight * s) + 'px';
}
function fitAll(){ $$('.paper-wrap').forEach(fit); }

function renderLive(){
  const d = readData();
  $('#livePaper').innerHTML = receiptHTML(d);
  $('#rnoTop').textContent = d.no;
  fit($('#livePaper'));
}
function renderHome(){
  const sample = {
    no:'DM-20261030-A7K9', date:todayISO(), customer:'Sample Customer', phone:'0750 000 0000',
    system:'Business Management System', price:1500000, annual:200000, monthly:50000,
    annualNow:true, monthlyNow:false, details:'', staff:'', total:1700000
  };
  $('#homePaper').innerHTML = receiptHTML(sample);
  fit($('#homePaper'));
}

/* ---------------------------- VALIDATION ---------------------------- */
function setErr(name, bad){ const f = $(`[data-f="${name}"]`); if(f) f.classList.toggle('err', bad); return bad; }
function validate(){
  const d = readData();
  const phoneDigits = d.phone.replace(/\D/g,'');
  const errs = [
    ['customer', d.customer.length < 2],
    ['phone', phoneDigits.length < 7],
    ['date', !d.date],
    ['system', d.system.length < 2],
    ['price', d.price <= 0]
  ];
  let first = null;
  errs.forEach(([n,bad]) => { setErr(n,bad); if(bad && !first) first = n; });
  if(first){ const el = $('#'+first); el.focus(); el.scrollIntoView({block:'center', behavior:'smooth'}); return false; }
  return true;
}

/* ---------------------------- TOASTS ---------------------------- */
function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<svg class="i"><use href="#i-${type==='error'?'alert':'check'}"/></svg><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 260); }, 3200);
}

/* ---------------------------- ACTIONS ---------------------------- */
function doPrint(pdfHint){
  if(!validate()){ toast(t('toastFix'), 'error'); return; }
  toast(pdfHint ? t('toastPdf') : t('toastPrint'));
  setTimeout(()=>window.print(), pdfHint ? 700 : 350);
}
// Build print copy right before the browser prints (works for Ctrl+P too)
window.addEventListener('beforeprint', ()=>{ $('#printRoot').innerHTML = receiptHTML(readData()); });
window.addEventListener('afterprint',  ()=>{ $('#printRoot').innerHTML = ''; });

function copyDetails(){
  if(!validate()){ toast(t('toastFix'), 'error'); return; }
  const d = readData();
  const L = [];
  L.push('DevMuhamad.com — INVOICE / SALES RECEIPT');
  L.push('--------------------------------------');
  L.push('Receipt No: ' + d.no);
  L.push('Date: ' + prettyDate(d.date));
  L.push('Customer: ' + d.customer);
  L.push('Phone: ' + d.phone);
  L.push('System: ' + d.system);
  L.push('System Price: ' + money(d.price));
  if(d.annual  > 0) L.push('Annual Server Fee: ' + money(d.annual)  + (d.annualNow  ? ' (included in total)' : ' (recurring, per year)'));
  if(d.monthly > 0) L.push('Monthly Fee: '       + money(d.monthly) + (d.monthlyNow ? ' (included in total)' : ' (recurring, per month)'));
  if(d.details) L.push('Details: ' + d.details);
  if(d.staff)   L.push('Staff: ' + d.staff);
  L.push('--------------------------------------');
  L.push('TOTAL: ' + money(d.total));
  L.push('');
  L.push('Thank you for choosing DevMuhamad.com');
  const text = L.join('\n');

  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove(); toast(ok ? t('toastCopy') : t('toastCopyFail'), ok ? 'success' : 'error');
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(t('toastCopy')), fallback);
  } else fallback();
}

function resetForm(silent){
  $('#form').reset();
  $$('.field.err').forEach(f=>f.classList.remove('err'));
  $('#date').value = todayISO();
  mode.annual = 'now'; mode.monthly = 'recurring';
  syncSeg();
  receiptNo = newReceiptNo();
  renderLive();
  if(!silent) toast(t('toastNew'));
}

/* ---------------------------- UI WIRING ---------------------------- */
function syncSeg(){
  $$('.seg').forEach(s=>{
    const m = mode[s.dataset.mode];
    $$('button', s).forEach(b=>b.classList.toggle('on', b.dataset.v === m));
  });
}
function showView(v){
  $('#viewHome').classList.toggle('hidden', v !== 'home');
  $('#viewForm').classList.toggle('hidden', v !== 'form');
  window.scrollTo({top:0});
  requestAnimationFrame(()=>{ v==='home' ? renderHome() : renderLive(); });
}
function openForm(){
  if(!$('#date').value) $('#date').value = todayISO();
  showView('form');
}

function applyLang(){
  const rtl = lang === 'ku';
  document.documentElement.lang = rtl ? 'ckb' : 'en';
  document.documentElement.dir  = rtl ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('#langTxt').textContent = t('langName');
  try{ localStorage.setItem('dm_lang', lang); }catch(e){}
  requestAnimationFrame(fitAll);
}
function applyTheme(th){
  document.documentElement.dataset.theme = th;
  $('#themeIco use').setAttribute('href', th === 'dark' ? '#i-sun' : '#i-moon');
  try{ localStorage.setItem('dm_theme', th); }catch(e){}
}

// numeric inputs: normalise Kurdish/Arabic digits + thousands separators
$$('.money').forEach(inp=>{
  inp.addEventListener('input', ()=>{
    const n = toNum(inp.value);
    inp.value = n ? fmt(n) : '';
  });
});
$('#phone').addEventListener('input', e=>{ e.target.value = toLatinDigits(e.target.value).replace(/[^\d+\s-]/g,''); });

// live preview + clear error as the user types
$('#form').addEventListener('input', e=>{
  const f = e.target.closest('.field'); if(f) f.classList.remove('err');
  renderLive();
});
$('#form').addEventListener('submit', e=>e.preventDefault());

$$('.seg button').forEach(b=>b.addEventListener('click', ()=>{
  mode[b.closest('.seg').dataset.mode] = b.dataset.v;
  syncSeg(); renderLive();
}));

$('#ctaNew').addEventListener('click', openForm);
$('#brandHome').addEventListener('click', ()=>showView('home'));
$('#backBtn').addEventListener('click', ()=>showView('home'));
$('#btnPrint').addEventListener('click', ()=>doPrint(false));
$('#btnPdf').addEventListener('click', ()=>doPrint(true));
$('#btnCopy').addEventListener('click', copyDetails);
$('#btnNew').addEventListener('click', ()=>resetForm(false));
$('#langBtn').addEventListener('click', ()=>{ lang = lang === 'ku' ? 'en' : 'ku'; applyLang(); });
$('#themeBtn').addEventListener('click', ()=>applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
window.addEventListener('resize', fitAll);
if(window.ResizeObserver){ new ResizeObserver(fitAll).observe(document.body); }

/* ---------------------------- INIT ---------------------------- */
(function init(){
  let th = null, lg = null;
  try{ th = localStorage.getItem('dm_theme'); lg = localStorage.getItem('dm_lang'); }catch(e){}
  if(!th) th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  if(lg === 'en' || lg === 'ku') lang = lg;
  $('#date').value = todayISO();
  syncSeg();
  applyTheme(th);
  applyLang();
  renderHome();
  renderLive();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
})();

})();
</script>
</body>
</html>
